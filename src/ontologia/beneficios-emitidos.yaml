# Ontologia dos benefícios emitidos — conceitos da fonte (INSS), versionados.
#
# Nada aqui vale sozinho: carregar_ontologia (src/medalhao/ontologia.py) só a aceita se
# conferir com os bytes de _raw/ e com o contrato. O nome oficial de cada espécie é o texto
# do dicionário, sem abreviar nem normalizar. O GRUPO de cada espécie NÃO está aqui: vem
# de grupos_especie do contrato, por referência — duas fontes do mesmo fato divergem em silêncio.
#
# As colunas ligam ao termo do glossário pela POSIÇÃO (0 a 13), nunca pelo nome: os
# cabeçalhos divergem dos termos e as duas 'Espécie' têm cabeçalho idêntico (ADR 0002).

ontologia: beneficios-emitidos

fontes:
  dicionario:
    arquivo: dicionario-especies-beneficio.xlsx
    sha256: fbd909cb40512559d5e934286f600fe042bbac37f409d0caddf90b252f2e62d7
  glossario:
    arquivo: glossario-beneficios-emitidos.xlsx
    sha256: a564f5d7235c944439f99eb6cc49748ab928798d3a89615057d490695915e2a9

colunas:
  - {posicao: 0, cabecalho: "Despacho", termo: "Despacho"}
  - {posicao: 1, cabecalho: "Sexo.", termo: "Sexo"}
  - {posicao: 2, cabecalho: "Clientela", termo: "Clientela"}
  - {posicao: 3, cabecalho: "Tipo Benefício", termo: "Tipo de Benefício"}
  - {posicao: 4, cabecalho: "UF", termo: "UF"}
  - {posicao: 5, cabecalho: "Meio pagamento", termo: "Meio pagamento"}
  - {posicao: 6, cabecalho: "Banco", termo: "Banco"}
  - {posicao: 7, cabecalho: "Mun Pagto", termo: "Mun Pagto"}
  - {posicao: 8, cabecalho: "Mun Resid", termo: "Mun Resid"}
  - {posicao: 9, cabecalho: "Vl Líquido", termo: "Valor líquido"}
  - {posicao: 10, cabecalho: "Ramo Atividade", termo: "Ramo Atividade"}
  - {posicao: 11, cabecalho: "Dt início validade", termo: "Data do início de validade"}
  - {posicao: 12, cabecalho: "Espécie", termo: "Espécie", papel: codigo}
  - {posicao: 13, cabecalho: "Espécie", termo: "Espécie", papel: descricao_truncada}

termos:
  - {nome: "Espécie", descricao: "Nome da espécie do benefício."}
  - {nome: "Despacho", descricao: "Tipo de despacho na concessão do benefício"}
  - {nome: "Clientela", descricao: "Divisão do ramo de atividade em urbano e rural."}
  - {nome: "Sexo", descricao: "Sexo do titular do benefício."}
  - {nome: "Tipo de Benefício", descricao: "Normal, desdobrado (no caso de mais de uma pessoa com direito ao recebimento) ou  Pensão Alimentícia"}
  - {nome: "UF", descricao: "Estado onde reside o titular do benefício"}
  - {nome: "Meio pagamento", descricao: "Indica se o benefício é pago  por conta/corrente ou cartão magnético"}
  - {nome: "Banco", descricao: "Banco responsável pelo pagamento"}
  - {nome: "Mun Pagto", descricao: "Município do Órgão Pagador do Benefício"}
  - {nome: "Mun Resid", descricao: "Município de Residência do titular do benefício"}
  - {nome: "Valor líquido", descricao: "Valor do pagamento com os descontos (líquido)"}
  - {nome: "Ramo Atividade", descricao: "Ramo de atividade exercida pelo titular do benefício."}
  - {nome: "Data do início de validade", descricao: "Data em que o crédito do pagamento do  benefício foi disponibilizado ao banco pagador para saque"}

