# A infra que o ADR 0006 declarou ausente: PySpark + MinIO, em contêiner.
#
# Nada é instalado no host. `_raw/` entra como somente-leitura, porque W-1
# exige que os bytes de origem sejam imutáveis — e um bind-mount rw daria
# ao contêiner o poder que o chmod 444 nega.
#
# Credenciais vêm de .env, que NÃO é versionado. O BRD nomeou "credenciais
# em texto puro no código versionado" como um dos três defeitos do legado;
# repetir isso aqui seria copiar o bug junto (Regra 6).
#
#   cd infra && cp .env.exemplo .env && docker compose up -d

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: pda-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?defina MINIO_USER no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?defina MINIO_PASSWORD no .env}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # console
    volumes:
      - minio-dados:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [pda]

  # Cria o bucket uma vez e sai. O produtor depende dele ter terminado.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: pda-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_USER} $${MINIO_PASSWORD} &&
      mc mb --ignore-existing local/landing &&
      mc ls local &&
      echo 'BUCKET=OK'
      "
    environment:
      MINIO_USER: ${MINIO_USER:?}
      MINIO_PASSWORD: ${MINIO_PASSWORD:?}
    networks: [pda]

  # Imagem OFICIAL da Apache. A tag 3.5.9 é a linha que o script legado
  # assume — subir 4.x mudaria o motor junto com a infra, e aí um defeito
  # não teria como ser atribuído a um ou a outro.
  spark:
    image: apache/spark:3.5.9-scala2.12-java17-python3-r-ubuntu
    container_name: pda-spark
    depends_on:
      minio-init:
        condition: service_completed_successfully
    # Sem SPARK_MODE: a imagem oficial não tem o entrypoint do Bitnami.
    # O contêiner fica vivo e o produtor roda via `docker compose exec`.
    #
    # PyYAML entra aqui, não à mão: o contrato é YAML e `carregar_contrato`
    # precisa dele. Instalar por fora daria um contêiner que funciona nesta
    # máquina e falha na próxima — o mesmo tipo de armadilha ambiental que
    # reprovou o selo do Pass 5 três vezes.
    user: root
    command:
      - /bin/sh
      - -c
      - "pip install --quiet --no-cache-dir pyyaml==6.0.2 && sleep infinity"
    environment:
      # A imagem oficial traz pyspark.zip em /opt/spark/python/lib mas deixa
      # SPARK_HOME e PYTHONPATH vazios — sem isto, `import pyspark` falha
      # dentro de um contêiner que tem o Spark instalado.
      SPARK_HOME: /opt/spark
      PYTHONPATH: /opt/spark/python/lib/pyspark.zip:/opt/spark/python/lib/py4j-0.10.9.7-src.zip
      # O produtor lê estas, nunca as tem escritas no código (Regra 6).
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_USER:?}
      S3_SECRET_KEY: ${MINIO_PASSWORD:?}
    ports:
      - "4040:4040"   # UI da aplicação, quando roda
    volumes:
      # ⚠ :ro — W-1. O contêiner LÊ a fonte e não pode tocá-la.
      - ../_raw:/dados/_raw:ro
      # o produtor e o contrato, para rodar dentro do contêiner
      - ../src:/app/src:ro
      - ../contracts:/app/contracts:ro
      - ../scripts:/app/scripts:ro
      - spark-trabalho:/app/trabalho
    working_dir: /app
    networks: [pda]

volumes:
  minio-dados:
  spark-trabalho:

networks:
  pda:
    driver: bridge
