# A infra que o ADR 0006 declarou ausente: PySpark + MinIO, em contêiner.
#
# Nada é instalado no host. `_raw/` entra como somente-leitura, porque W-1
# exige que os bytes de origem sejam imutáveis — e um bind-mount rw daria
# ao contêiner o poder que o chmod 444 nega.
#
# Credenciais vêm de .env, que NÃO é versionado. O BRD nomeou "credenciais
# em texto puro no código versionado" como um dos três defeitos do legado;
# repetir isso aqui seria copiar o bug junto (Regra 6).
#
#   cd infra && cp .env.exemplo .env && docker compose up -d

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: pda-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?defina MINIO_USER no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?defina MINIO_PASSWORD no .env}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # console
    volumes:
      - minio-dados:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [pda]

  # Cria o bucket uma vez e sai. O produtor depende dele ter terminado.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: pda-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_USER} $${MINIO_PASSWORD} &&
      mc mb --ignore-existing local/landing &&
      mc mb --ignore-existing local/bronze &&
      mc mb --ignore-existing local/silver &&
      mc mb --ignore-existing local/gold &&
      mc ls local &&
      echo 'BUCKET=OK'
      "
    environment:
      MINIO_USER: ${MINIO_USER:?}
      MINIO_PASSWORD: ${MINIO_PASSWORD:?}
    networks: [pda]

  # A PROJEÇÃO da ontologia para quem consulta fora do Spark (agentes, BI).
  # Não é fonte da verdade: a ontologia versionada em src/ontologia/ é, e o
  # que está aqui é carregado por ela e reconferido linha a linha. Um dado
  # editado direto no banco não tem selo nem histórico (Regra 11).
  # A porta só escuta em 127.0.0.1: consulta local, não serviço exposto.
  postgres:
    image: postgres:16.4
    container_name: pda-postgres
    environment:
      POSTGRES_USER: ${PG_USER:?defina PG_USER no .env}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?defina PG_PASSWORD no .env}
      POSTGRES_DB: ${PG_DB:?defina PG_DB no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [pda]

  # Imagem OFICIAL da Apache. A tag 3.5.9 é a linha que o script legado
  # assume — subir 4.x mudaria o motor junto com a infra, e aí um defeito
  # não teria como ser atribuído a um ou a outro.
  spark:
    image: apache/spark:3.5.9-scala2.12-java17-python3-r-ubuntu
    container_name: pda-spark
    depends_on:
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    # Sem SPARK_MODE: a imagem oficial não tem o entrypoint do Bitnami.
    # O contêiner fica vivo e o produtor roda via `docker compose exec`.
    #
    # PyYAML entra aqui, não à mão: o contrato é YAML e `carregar_contrato`
    # precisa dele. Instalar por fora daria um contêiner que funciona nesta
    # máquina e falha na próxima — o mesmo tipo de armadilha ambiental que
    # reprovou o selo do Pass 5 três vezes.
    # O script de preparo fica num ARQUIVO, não inline: o Compose interpreta
    # $VAR como variável dele e substitui por vazio antes do shell ver. A
    # versão inline virou `curl -o "" ""` e baixou nada, com S3A_JARS=0.
    user: root
    command: ["/bin/sh", "/app/infra/preparar-spark.sh"]
    environment:
      # A imagem oficial traz pyspark.zip em /opt/spark/python/lib mas deixa
      # SPARK_HOME e PYTHONPATH vazios — sem isto, `import pyspark` falha
      # dentro de um contêiner que tem o Spark instalado.
      SPARK_HOME: /opt/spark
      PYTHONPATH: /opt/spark/python/lib/pyspark.zip:/opt/spark/python/lib/py4j-0.10.9.7-src.zip
      # O produtor lê estas, nunca as tem escritas no código (Regra 6).
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_USER:?}
      S3_SECRET_KEY: ${MINIO_PASSWORD:?}
      # A projeção da ontologia lê estas; nenhuma credencial no código.
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB:?}
      PG_USER: ${PG_USER:?}
      PG_PASSWORD: ${PG_PASSWORD:?}
    ports:
      - "4040:4040"   # UI da aplicação, quando roda
    volumes:
      # ⚠ :ro — W-1. O contêiner LÊ a fonte e não pode tocá-la.
      - ../_raw:/dados/_raw:ro
      # o produtor e o contrato, para rodar dentro do contêiner
      - ../src:/app/src:ro
      - ../contracts:/app/contracts:ro
      - ../scripts:/app/scripts:ro
      # os testes, para o eval do Pass 8 enxergá-los. Sem este monte o
      # `pytest tests/test_x.py` sai com "no tests ran" e EXIT 0 — um eval
      # que aprova por não achar nada, que é a Regra 9 no verificador.
      - ../tests:/app/tests:ro
      - ./preparar-spark.sh:/app/infra/preparar-spark.sh:ro
      - spark-trabalho:/app/trabalho
    working_dir: /app
    networks: [pda]

volumes:
  minio-dados:
  spark-trabalho:
  pg-dados:

networks:
  pda:
    driver: bridge
