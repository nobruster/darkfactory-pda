version: 1
file_type:
  number: "05"
  name: Merchant Fee Assessment
  code: MER_FEESET05
  layout_version: "001"
  filename_regex: '^NW_MERCHANT_FEES_[0-9]{8}_B[0-9]{15}\.csv$'
  encoding: UTF-8
  decoding: strict
  bom: forbidden
  unicode_normalization: NFC_required_on_input
  line_ending: LF
  final_line_ending: required
  blank_lines: forbidden
  bare_cr: forbidden
  max_detail_rows: 10000
  max_physical_record_bytes: 512
  max_source_file_bytes: 5130138

grammar:
  style: semicolon_delimited
  parser: single_pass_quote_aware_lexer
  delimiter: semicolon
  quote_character: double_quote
  escaped_quote: doubled_quote
  multiline_fields: forbidden
  whitespace_outside_quotes: forbidden
  field_count: 10
  description_must_be_quoted: true
  non_description_fields_must_be_unquoted: true
  empty_fields: forbidden

header:
  exact: 'assessment_id;batch_id;merchant_id;merchant_tax_id;fee_code;description;gross_amount_brl;rate_percent;assessed_fee_brl;assessment_date'

columns:
  - { position: 1, name: assessment_id, type: safe_ascii_identifier, regex: '^FEE[0-9]{13}$' }
  - { position: 2, name: batch_id, type: safe_ascii_identifier, regex: '^B[0-9]{15}$' }
  - { position: 3, name: merchant_id, type: safe_ascii_identifier, regex: '^MER[0-9]{13}$' }
  - { position: 4, name: merchant_tax_id, type: digits, length: 14, validation: CNPJ_two_Mod11_check_digits, privacy: mask }
  - { position: 5, name: fee_code, type: safe_ascii_identifier, regex: '^[A-Z][A-Z0-9_]{1,9}$' }
  - { position: 6, name: description, type: quoted_nfc_string, min_codepoints: 1, max_codepoints: 80, privacy: validated_passthrough }
  - { position: 7, name: gross_amount_brl, type: locale_unsigned_decimal, canonical_regex: '^(0|[1-9][0-9]{0,11}),[0-9]{2}$', scale: 2, minimum_exclusive: "0,00" }
  - { position: 8, name: rate_percent, type: locale_unsigned_decimal, canonical_regex: '^(0|[1-9][0-9]{0,2}),[0-9]{3}$', scale: 3, minimum_exclusive: "0,000", maximum: "100,000" }
  - { position: 9, name: assessed_fee_brl, type: locale_unsigned_decimal, canonical_regex: '^(0|[1-9][0-9]{0,11}),[0-9]{2}$', scale: 2, minimum: "0,00" }
  - { position: 10, name: assessment_date, type: date, format: dd/MM/yyyy }

description_rules:
  unicode_normalization: NFC_required_on_input
  forbidden_codepoints:
    - C0_controls
    - C1_controls
    - bidi_controls
    - CR
    - LF
  forbidden_prefixes: ['=', '+', '-', '@']
  digit_runs_11_through_19: forbidden
  raw_merchant_tax_id_substrings: forbidden

calculation:
  expression: gross_amount_brl * rate_percent / 100
  intermediate: arbitrary_precision_decimal
  final_scale: 2
  rounding_mode: HALF_UP
  assessed_fee_must_equal_calculated_fee: true
  binary_floating_point: forbidden

source_control_manifest:
  location: source-manifest.json
  ownership: source_system_of_record
  raw_csv_contains_no_trailer: true
  fields:
    - row_count
    - gross_amount
    - assessed_fee
    - calculated_fee
  validation:
    - declared_row_count_equals_parsed_detail_count
    - declared_gross_equals_exact_row_sum
    - declared_assessed_fee_equals_exact_row_sum
    - declared_calculated_fee_equals_independent_HALF_UP_row_sum

cross_record_rules:
  - Every row batch ID equals the filename batch ID.
  - Every assessment date equals the filename date.
  - Assessment IDs are unique within the batch and globally unique across accepted batches.
  - Merchant IDs may recur because they identify merchants rather than assessments.
  - Every CNPJ contains fourteen digits, is not a repeated digit, and passes both Mod-11 check digits.
  - Gross and rate are strictly positive; assessed fee may be zero only when the HALF_UP result is zero.
  - Every assessed fee equals its independently calculated HALF_UP fee.
  - Source controls are supplied beside the raw CSV and are validated before sanitized CSV publication.
  - All arithmetic uses arbitrary-precision decimals; binary floating point is forbidden.

validation_order:
  - source_size
  - strict_UTF8_without_BOM
  - NFC_normalization
  - exact_LF_transport_and_record_byte_bounds
  - exact_header
  - CSV_quoting
  - field_count
  - field_lexical_and_decimal_rules
  - CNPJ_Mod11
  - identifier_and_description_rules
  - filename_batch_and_business_date_rules
  - assessment_id_uniqueness
  - HALF_UP_fee_calculation
  - source_count_control
  - source_gross_control
  - source_assessed_fee_control
  - source_calculated_fee_control
  - whole_output_privacy_scan

canonical_rejection_codes:
  source_size: INVALID_SOURCE_SIZE
  invalid_utf8: INVALID_UTF8
  invalid_unicode_normalization: INVALID_UNICODE_NORMALIZATION
  invalid_transport: INVALID_TRANSPORT
  invalid_record_length: INVALID_RECORD_LENGTH
  invalid_header: INVALID_HEADER
  invalid_csv_quoting: INVALID_CSV_QUOTING
  invalid_field_count: INVALID_FIELD_COUNT
  invalid_field: INVALID_FIELD
  invalid_document: INVALID_DOCUMENT
  invalid_identifier: INVALID_IDENTIFIER
  invalid_description: INVALID_DESCRIPTION
  invalid_business_date: INVALID_BUSINESS_DATE
  duplicate_identifier: DUPLICATE_IDENTIFIER
  fee_calculation_mismatch: FEE_CALCULATION_MISMATCH
  source_control_count_mismatch: SOURCE_CONTROL_COUNT_MISMATCH
  source_control_gross_mismatch: SOURCE_CONTROL_GROSS_MISMATCH
  source_control_assessed_fee_mismatch: SOURCE_CONTROL_ASSESSED_FEE_MISMATCH
  source_control_calculated_fee_mismatch: SOURCE_CONTROL_CALCULATED_FEE_MISMATCH
  privacy_output_violation: PRIVACY_OUTPUT_VIOLATION
