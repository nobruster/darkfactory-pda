version: 1
type_number: "01"

grain:
  keys:
    - batch_id
    - currency
  currency: BRL

source_controls:
  count: trailer.detail_count
  net_amount: trailer.net_amount_brl
  persistence: control.batches

stage_controls:
  count: 'count(*) from staging.card_settlement where batch_id = :batch_id'
  net_amount: 'sum(amount_brl) from staging.card_settlement where batch_id = :batch_id'

operational_controls:
  count: 'count(*) from legacy.card_settlement where batch_id = :batch_id'
  net_amount: 'sum(amount_brl) from legacy.card_settlement where batch_id = :batch_id'

procedure_order:
  - sequence: 1
    procedure: legacy.apply_card_settlement_batch
    arguments: [batch_id]
    transaction: same_business_transaction
  - sequence: 2
    procedure: reporting.refresh_card_settlement_reconciliation
    arguments: [batch_id]
    transaction: same_business_transaction

report:
  relation: reporting.card_settlement_reconciliation
  required_columns:
    - batch_id
    - currency
    - source_count
    - staged_count
    - applied_count
    - source_net_amount
    - staged_net_amount
    - applied_net_amount
    - count_delta
    - amount_delta
    - reject_count
    - status

tolerances:
  count_delta: 0
  amount_delta: "0.00"

semantics:
  replay: idempotent_by_batch_id_and_source_record_number
  operational_apply: insert_missing_rows_without_updating_existing_rows
  count_delta: applied_count_minus_source_count
  amount_delta: applied_net_amount_minus_source_net_amount
  reject_count: 'count(*) from control.rejects where batch_id = :batch_id'
  transaction: staging_load_then_both_procedures_commit_or_rollback_together

success:
  - No rejected records.
  - Source, staged, and applied counts are identical.
  - Source, staged, and applied net amounts are identical.
  - No duplicate natural batch key exists.
  - Report status is MATCHED.

approved_example:
  batch_id: B202607230000001
  currency: BRL
  source_count: 2
  staged_count: 2
  applied_count: 2
  source_net_amount: "173.45"
  staged_net_amount: "173.45"
  applied_net_amount: "173.45"
  count_delta: 0
  amount_delta: "0.00"
  status: MATCHED
