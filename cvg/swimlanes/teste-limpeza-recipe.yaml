        - tests/test_limpeza.py
        creates_paths: []
        behavior:
        - id: B-1
          given: o teste selado test_commit_seguido_de_outro_preserva, cujo cenário é idêntico ao de test_substituida_conferida_apaga com a expectativa oposta
          when: a regra aprovada — substituída e conferida apaga — vale
          then: test_commit_seguido_de_outro_preserva é RETIRADO do módulo, sem ser reescrito, porque reescrito seria uma duplicata de test_substituida_conferida_apaga, que já cobre o mesmo cenário com a expectativa nova; nenhuma outra função test_* do módulo muda; src/medalhao/limpeza.py fica FORA do escopo de escrita — o comportamento entregue governa, e o path_policy recusa qualquer escrita nele.
        - id: B-2
          given: o módulo depois da retirada
          when: é coletado e executado inteiro
          then: 'um teste-guarda, test_lista_de_testes_da_limpeza, confere que o módulo tem EXATAMENTE os testes test_apaga_preparo_de_execucao_publicada, test_publicada_intacta_depois, test_id_vazio_recusado, test_caminho_fora_do_preparo_recusado, test_execucao_nao_publicada_preserva, test_commit_revertido_preserva, test_outra_execucao_intacta, test_substituida_conferida_apaga, test_publicada_intacta_apos_limpar_substituida, test_revertida_preserva, test_sem_commit_preserva, test_execucao_ativa_preserva, test_prefixo_montado_de_partes_validadas e ele mesmo — nem um a mais, nem um a menos; os casos que a regra antiga ainda governa seguem preservando: revertida, sem commit, execução ativa; todos passam.'
        evals:
        - id: eval_1
          description: A regra nova governa o cenário
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in substituida_conferida_apaga publicada_intacta_apos_limpar_substituida; do python3 -m pytest --collect-only -q tests/test_limpeza.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_limpeza.py -k "substituida_conferida_apaga or publicada_intacta_apos_limpar_substituida"'
          verifies:
          - B-1
        - id: eval_2
          description: A lista de testes é exatamente a esperada
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in lista_de_testes_da_limpeza revertida_preserva sem_commit_preserva execucao_ativa_preserva; do python3 -m pytest --collect-only -q tests/test_limpeza.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_limpeza.py -k "lista_de_testes_da_limpeza or revertida_preserva or sem_commit_preserva or execucao_ativa_preserva"'
          verifies:
          - B-2
        - id: eval_3
          description: O resto do módulo segue verde
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in apaga_preparo_de_execucao_publicada commit_revertido_preserva caminho_fora_do_preparo_recusado publicada_intacta_depois id_vazio_recusado execucao_nao_publicada_preserva outra_execucao_intacta prefixo_montado_de_partes_validadas; do python3 -m pytest --collect-only -q tests/test_limpeza.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_limpeza.py -k "apaga_preparo_de_execucao_publicada or commit_revertido_preserva or caminho_fora_do_preparo_recusado or publicada_intacta_depois or id_vazio_recusado or execucao_nao_publicada_preserva or outra_execucao_intacta or prefixo_montado_de_partes_validadas"'
          verifies:
          - B-1
          - B-2
