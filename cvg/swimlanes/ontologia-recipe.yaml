    captured_at: '2026-09-21T00:00:00Z'
    sha256: 0505a743963abfb09a257373a431c3878b25cf6c19d71467c722da9830779acd
  confidence: 1.0
  summary: 'Competência 2026-01 medida na origem: 41572553 linhas, soma 78521752562.12.'
- id: E-DICIONARIOS-INSS
  claim: external
  source:
    uri: cvg/docs/adrs/0010-the-versioned-ontology-is-the-source-of-truth-delta-and-postgres-are-projections.md
    captured_at: '2026-09-24T00:00:00Z'
    sha256: f305a788683ab73cd9e689527cb41ec3d84187ef9b0daae2033da2dcfd2ad321
  confidence: 1.0
  summary: 'Dicionário e glossário do INSS conferidos contra a Silver real 2026-01: 65 de 65 códigos, 11 de 11 colapsos desfeitos, 43 de 65 textos iguais ao prefixo do nome oficial.'
decisions:
- id: ADR-0010-ONTOLOGIA-FONTE
  status: accepted
  owner: Bruno Nunes
  rationale: 'ADR 0010, decidido pelo dono em 2026-09-24: a ontologia versionada é a fonte da verdade; a Delta especie e o Postgres são projeções reconferidas, consultadas por agentes e BI fora do Spark. Postgres como fonte foi rejeitado: dado editado no banco escapa da cadeia.'
seams:
- id: SEAM-ONTOLOGIA
  name: Ontologia versionada
  description: Separa o conceito da fonte do dado da fonte.
  evidence:
  - E-DICIONARIOS-INSS
  responsibility: Declarar colunas, termos, espécies e grupos e recusar o que não confere com o INSS.
  consumes:
  - dicionarios do INSS em _raw
  produces: &id001
  - ontologia carregada
  owner: medalhao
  independent_proof: Carregador confere 65 nomes, 13 termos e o sha256 contra _raw/.
  decision_ids:
  - ADR-0010-ONTOLOGIA-FONTE
  rejected_alternatives:
  - alternative: Ler o dicionário direto do .xlsx em cada consumidor
    reason: cada consumidor faria sua própria interpretação, sem ligação coluna-termo revisada.
  swimlane:
    id: LANE-ONTOLOGIA
    name: Ontologia versionada lane
    owner: medalhao
    legs:
    - id: LEG-ONTOLOGIA
      observable_state: Ontologia carregada e conferida
      proof: Carregador confere 65 nomes, 13 termos e o sha256 contra _raw/.
      requires: []
      produces: *id001
      tasks:
      - id: T-20260924-ontologia-versionada
        title: Ontologia versionada dos benefícios emitidos, reconferida contra os bytes do INSS
        goal: Ter num arquivo versionado os conceitos da fonte — colunas, termos do glossário, espécies com o nome oficial e o grupo de cada uma — e um carregador que só aceita a ontologia se ela confere com os bytes de _raw/. Para rodar testes, o ÚNICO comando liberado ao agente é `docker compose -f infra/docker-compose.yml exec -T spark python3 -m pytest <arquivo> -k <cenarios>`.
        done_condition: src/ontologia/beneficios-emitidos.yaml existe; carregar_ontologia devolve a ontologia com 14 colunas, 13 termos e 65 espécies quando ela confere com os dois .xlsx de /dados/_raw e com o contrato, e recusa em qualquer divergência ou ausência; os testes de tests/test_ontologia.py passam.
        effort: M
        profile: standard
        execution_backend: any
        required_tools: &id003
        - git
        - bash
        - python3
        - pytest
        - docker
        depends_on: []
        touches_paths: []
        creates_paths:
        - src/ontologia/beneficios-emitidos.yaml
        - src/medalhao/ontologia.py
        - tests/test_ontologia.py
        behavior:
        - id: B-1
          given: os bytes oficiais em /dados/_raw (dicionario-especies-beneficio.xlsx e glossario-beneficios-emitidos.xlsx, com sha256 em /dados/_raw/CHECKSUMS.txt) e o contrato contracts/competencia-202601.yaml com grupos_especie
          when: carregar_ontologia lê src/ontologia/beneficios-emitidos.yaml
          then: 'devolve a ontologia com: as duas fontes e o sha256 de cada, que confere com o arquivo e com o CHECKSUMS.txt; as 14 colunas do CSV, cada uma por POSIÇÃO de 0 a 13 com o cabeçalho da fonte e o termo do glossário que representa — as posições 12 e 13 são as duas ''Espécie'', com papel codigo e descricao_truncada (ADR 0002), e nenhuma ligação é feita pelo nome; os 13 termos com a descrição do glossário; as 65 espécies, código de 2 dígitos em texto, com o nome oficial IGUAL ao do dicionário depois de normalizar para NFC e tirar espaços das pontas, e o grupo de cada uma lido de grupos_especie do contrato, por referência. Os .xlsx são lidos só com a biblioteca padrão (zipfile e xml), sem openpyxl, porque o contêiner não tem rede.'
        - id: B-2
          given: uma ontologia, uma fonte ou um contrato que não conferem, ou que não foram lidos
          when: carregar_ontologia confere
          then: 'recusa, nunca devolve ontologia parcial: sha256 divergente do arquivo ou do CHECKSUMS.txt, código a mais ou a menos que o dicionário, nome diferente do dicionário, código sem grupo ou em dois grupos, termo que o glossário não tem, posição de coluna faltando ou repetida — cada caso com o motivo nomeado; zero espécies lidas, zero termos lidos ou arquivo ausente devolvem NAO_MEDIDO, não OK (Regra 9). Os cenários de recusa usam cópias em tmp_path, nunca alteram /dados/_raw.'
        evals:
        - id: eval_1
          description: A ontologia real confere com o INSS e com o contrato
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in ontologia_real_confere sessenta_e_cinco_especies catorze_colunas_por_posicao; do python3 -m pytest --collect-only -q tests/test_ontologia.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_ontologia.py -k "ontologia_real_confere or sessenta_e_cinco_especies or catorze_colunas_por_posicao"'
          verifies:
          - B-1
        - id: eval_2
          description: Divergência recusa com motivo
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in sha256_divergente_recusa nome_diferente_recusa codigo_sem_grupo_recusa termo_fora_do_glossario_recusa; do python3 -m pytest --collect-only -q tests/test_ontologia.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_ontologia.py -k "sha256_divergente_recusa or nome_diferente_recusa or codigo_sem_grupo_recusa or termo_fora_do_glossario_recusa"'
          verifies:
          - B-2
        - id: eval_3
          description: Ausência não é medição
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in dicionario_vazio_nao_medido fonte_ausente_nao_medido le_xlsx_sem_dependencia; do python3 -m pytest --collect-only -q tests/test_ontologia.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_ontologia.py -k "dicionario_vazio_nao_medido or fonte_ausente_nao_medido or le_xlsx_sem_dependencia"'
          verifies:
          - B-1
          - B-2
        anti_patterns:
        - action: ligar coluna a termo pelo nome do cabeçalho
          reason: os nomes divergem e as duas Espécie têm cabeçalho idêntico (ADR 0002)
          instead: ligar pela posição de 0 a 13
        - action: copiar os grupos de espécie para dentro da ontologia
          reason: duas fontes do mesmo fato divergem em silêncio
          instead: referenciar grupos_especie do contrato e conferir a cobertura
        - action: corrigir ou abreviar o nome oficial para caber em 20 caracteres
          reason: o nome oficial é o que a ontologia acrescenta; o truncado já está na Silver
          instead: guardar o nome exatamente como o dicionário publica
        do_not_touch:
        - _raw
        - cvg/docs/adrs
        - contracts
        - src/pda
        - infra
        rollback: Remover os três arquivos criados; nada mais depende deles até a próxima tarefa.
        observability: ontologia recusada por divergência com os bytes do INSS
- id: SEAM-ESPECIE-SILVER
  name: Especie na Silver
  description: Separa o nome oficial do texto truncado da fonte.
  evidence:
  - E-DICIONARIOS-INSS
  responsibility: Publicar a tabela especie com os dois textos e reconferir o gravado.
  consumes:
  - ontologia carregada
  produces: &id002
  - especie na silver
  owner: medalhao
  independent_proof: 65 linhas na competência real, 65 nomes distintos, multiconjunto 0/0.
  decision_ids:
  - ADR-0010-ONTOLOGIA-FONTE
  rejected_alternatives:
  - alternative: Coluna nome_oficial acrescentada à Silver principal
    reason: mudaria o schema da Silver selada e reescreveria 41 milhões de linhas.
  swimlane:
    id: LANE-ESPECIE-SILVER
    name: Especie na Silver lane
    owner: medalhao
    legs:
    - id: LEG-ESPECIE-SILVER
      observable_state: Tabela especie publicada e reconferida
      proof: 65 linhas na competência real, 65 nomes distintos, multiconjunto 0/0.
      requires:
      - ontologia carregada
      produces: *id002
      tasks:
      - id: T-20260924-especie-silver
        title: 'Tabela Delta especie: o nome oficial ao lado do texto da fonte'
        goal: Publicar, por competência, uma tabela Delta com cada código de espécie, o nome oficial da ontologia, o grupo e o texto que a fonte publicou, sem corrigir nada. Para rodar testes, o ÚNICO comando liberado ao agente é `docker compose -f infra/docker-compose.yml exec -T spark python3 -m pytest <arquivo> -k <cenarios>`.
        done_condition: publicar_especie grava a tabela com uma linha por código da competência, reconfere o que gravou, e recusa sem gravar quando a Silver e a ontologia não conferem; os testes de tests/test_especie.py passam.
        effort: S
        profile: standard
        execution_backend: any
        required_tools: *id003
        depends_on:
        - T-20260924-ontologia-versionada
        touches_paths: []
        creates_paths:
        - src/medalhao/especie.py
        - tests/test_especie.py
        behavior:
        - id: B-1
          given: a ontologia carregada e uma Silver Delta com especie_codigo e especie_descricao da competência
          when: publicar_especie(spark, ontologia, silver, destino, competencia) roda
          then: 'grava em Delta, por replaceWhere da competência, uma linha por código com: especie_codigo, nome_oficial, grupo, descricao_fonte (o texto da Silver COMO VEIO, Regra 4), texto_fonte_confere_prefixo (verdadeiro quando descricao_fonte sem espaços à direita é igual aos 20 primeiros caracteres do nome oficial sem espaços à direita, ambos em NFC) e competencia; o commit leva em userMetadata a versão da Silver lida e o sha256 da ontologia; depois de gravar, relê a versão commitada e confere o multiconjunto contra o que calculou, nos dois sentidos. Sobre a Silver real de 2026-01 o resultado tem 65 linhas, 65 nomes oficiais distintos e 43 linhas com texto_fonte_confere_prefixo verdadeiro.'
        - id: B-2
          given: uma Silver que não confere com a ontologia, ou vazia
          when: publicar_especie confere antes de gravar
          then: 'recusa SEM gravar nada: código na Silver que a ontologia não tem, código da ontologia ausente da competência, código com mais de uma descrição na competência — cada um com o motivo e os códigos; competência sem nenhuma linha devolve NAO_MEDIDO (Regra 9). Os testes gravam só em tmp_path, nunca no MinIO; o teste da Silver real lê o MinIO e grava em tmp_path.'
        evals:
        - id: eval_1
          description: A tabela guarda os dois textos e fecha com a Silver
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in grava_nome_oficial_e_texto_da_fonte reconfere_o_que_gravou linhagem_no_commit; do python3 -m pytest --collect-only -q tests/test_especie.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_especie.py -k "grava_nome_oficial_e_texto_da_fonte or reconfere_o_que_gravou or linhagem_no_commit"'
          verifies:
          - B-1
        - id: eval_2
          description: Divergência recusa sem gravar
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in codigo_fora_da_ontologia_recusa codigo_ausente_recusa duas_descricoes_recusa competencia_vazia_nao_medido; do python3 -m pytest --collect-only -q tests/test_especie.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_especie.py -k "codigo_fora_da_ontologia_recusa or codigo_ausente_recusa or duas_descricoes_recusa or competencia_vazia_nao_medido"'
          verifies:
          - B-2
        - id: eval_3
          description: A Silver real de 2026-01
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in especie_real_2026_01 colapsos_desfeitos_pelo_nome; do python3 -m pytest --collect-only -q tests/test_especie.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_especie.py -k "especie_real_2026_01 or colapsos_desfeitos_pelo_nome"'
          verifies:
          - B-1
          - B-2
        anti_patterns:
        - action: sobrescrever especie_descricao da Silver com o nome oficial
          reason: o texto truncado é a prova do defeito da fonte (Regra 4)
          instead: guardar os dois lado a lado
        - action: escolher uma descrição quando o código tem duas
          reason: escolher é decidir em silêncio
          instead: recusar com o código e as descrições
        - action: gravar e só depois conferir a cobertura de códigos
          reason: publica uma tabela que a conferência reprovaria
          instead: conferir antes, gravar, e reconferir o gravado
        do_not_touch:
        - _raw
        - cvg/docs/adrs
        - contracts
        - src/pda
        - infra
        - src/ontologia/beneficios-emitidos.yaml
        - src/medalhao/ontologia.py
        rollback: Remover os dois arquivos criados; a tabela especie de produção só é publicada fora do loop.
        observability: códigos de espécie que a ontologia não conhece
- id: SEAM-ONTOLOGIA-POSTGRES
  name: Ontologia no Postgres
  description: Separa a consulta fora do Spark da fonte.
  evidence:
  - E-DICIONARIOS-INSS
  responsibility: Projetar a ontologia no Postgres numa transação e reconferir linha a linha.
  consumes:
  - ontologia carregada
  produces: &id004
  - ontologia no postgres
  owner: medalhao
  independent_proof: Contagens 2/13/14/5/65 relidas do banco iguais à ontologia; sha256 na tabela carga.
  decision_ids:
  - ADR-0010-ONTOLOGIA-FONTE
  rejected_alternatives:
  - alternative: Postgres como fonte da verdade
    reason: dado editado no banco não passa por costura, adversário, selo nem escopo (Regra 11).
  swimlane:
    id: LANE-ONTOLOGIA-POSTGRES
    name: Ontologia no Postgres lane
    owner: medalhao
    legs:
    - id: LEG-ONTOLOGIA-POSTGRES
      observable_state: Ontologia projetada e reconferida
      proof: Contagens 2/13/14/5/65 relidas do banco iguais à ontologia; sha256 na tabela carga.
      requires:
      - ontologia carregada
      produces: *id004
      tasks:
      - id: T-20260924-ontologia-postgres
        title: Projeção da ontologia no Postgres, carregada numa transação e reconferida
        goal: 'Carregar a ontologia no Postgres pda-postgres para consulta fora do Spark, sem que o banco vire fonte da verdade: tudo ou nada, reconferido linha a linha, com a versão da ontologia gravada. Para rodar testes, o ÚNICO comando liberado ao agente é `docker compose -f infra/docker-compose.yml exec -T spark python3 -m pytest <arquivo> -k <cenarios>`.'
        done_condition: projetar_ontologia carrega fontes, termos, colunas, grupos e espécies num schema nomeado, numa transação só, reconfere cada tabela contra a ontologia e grava o sha256 da ontologia; falha no meio deixa a carga anterior intacta; os testes de tests/test_projecao_postgres.py passam.
        effort: S
        profile: standard
        execution_backend: any
        required_tools: *id003
        depends_on:
        - T-20260924-ontologia-versionada
        touches_paths: []
        creates_paths:
        - src/medalhao/projecao_postgres.py
        - tests/test_projecao_postgres.py
        behavior:
        - id: B-1
          given: a ontologia carregada e as variáveis PG_HOST, PG_PORT, PG_DB, PG_USER e PG_PASSWORD do ambiente
          when: projetar_ontologia(ontologia, schema) roda
          then: num schema cujo nome é validado como identificador simples (letras minúsculas, dígitos e _), cria as tabelas fonte, termo, coluna, grupo e especie, com chave primária em cada uma e chave estrangeira de coluna para termo e de especie para grupo, e uma tabela carga com o sha256 da ontologia e o instante da carga; a carga substitui o conteúdo anterior do schema numa ÚNICA transação; depois do commit, relê cada tabela e confere linha a linha contra a ontologia — 2 fontes, 13 termos, 14 colunas, 5 grupos, 65 espécies — e devolve PROJETADA com as contagens. Credenciais só do ambiente, nunca escritas no código, nunca impressas.
        - id: B-2
          given: uma carga que falha no meio, uma variável de ambiente ausente, ou um nome de schema inválido
          when: projetar_ontologia roda
          then: falha no meio desfaz a transação e a carga anterior fica intacta, conferida pelo sha256 na tabela carga; variável ausente recusa sem conectar e nomeia a variável, nunca o valor; nome de schema fora do padrão recusa sem executar SQL; reconferência divergente devolve DIVERGENTE. Cada teste usa um schema próprio com sufixo aleatório e o apaga ao final, para não deixar dado de teste no banco.
        evals:
        - id: eval_1
          description: A projeção carrega e confere
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in projeta_e_reconfere grava_sha256_da_ontologia chaves_estrangeiras_valem; do python3 -m pytest --collect-only -q tests/test_projecao_postgres.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_projecao_postgres.py -k "projeta_e_reconfere or grava_sha256_da_ontologia or chaves_estrangeiras_valem"'
          verifies:
          - B-1
        - id: eval_2
          description: Tudo ou nada
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in falha_no_meio_preserva_carga_anterior reconferencia_divergente; do python3 -m pytest --collect-only -q tests/test_projecao_postgres.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_projecao_postgres.py -k "falha_no_meio_preserva_carga_anterior or reconferencia_divergente"'
          verifies:
          - B-2
        - id: eval_3
          description: Sem credencial no código e sem SQL de nome livre
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in variavel_ausente_recusa_sem_conectar schema_invalido_recusa schema_de_teste_apagado; do python3 -m pytest --collect-only -q tests/test_projecao_postgres.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_projecao_postgres.py -k "variavel_ausente_recusa_sem_conectar or schema_invalido_recusa or schema_de_teste_apagado"'
          verifies:
          - B-1
          - B-2
        anti_patterns:
        - action: escrever credencial, host ou senha padrão no código ou no teste
          reason: é o defeito do legado que o BRD nomeou (Regra 6)
          instead: ler PG_* do ambiente e recusar se faltar
        - action: montar SQL com o nome do schema sem validar
          reason: nome livre em SQL é injeção
          instead: validar o identificador e usar psycopg.sql.Identifier
        - action: inserir tabela por tabela em transações separadas
          reason: uma falha no meio deixa o banco com meia ontologia
          instead: uma transação para a carga inteira
        do_not_touch:
        - _raw
        - cvg/docs/adrs
        - contracts
        - src/pda
        - infra
        - src/ontologia/beneficios-emitidos.yaml
        - src/medalhao/ontologia.py
        rollback: Remover os dois arquivos criados e apagar o schema carregado.
        observability: projeções divergentes da ontologia versionada
steel_thread:
- LEG-ONTOLOGIA
- LEG-ESPECIE-SILVER
- LEG-ONTOLOGIA-POSTGRES
