decisions:
- id: DEC-MEMORIA-6G
  status: accepted
  owner: Bruno Nunes
  rationale: 'Correção de 2026-09-24: a costura de performance mandou declarar a memória sem dizer quanto, e a entrega declarou 1g. Medido: suíte numa JVM ainda estoura; gate NAO_MEDIDO por 6g->1g; o builder define o heap efetivo (6g -> 6,00 GiB). O valor é o das baselines.'
seams:
- id: SEAM-MEMORIA-6G
  name: Memória declarada com o valor medido
  description: Separa declarar a memória de declarar o valor certo.
  evidence:
  - E-ANCORA-202601
  responsibility: Fazer criar_sessao nascer com 6g de heap efetivo por padrão.
  consumes:
  - sessao com memoria declarada
  produces:
  - sessao com memoria medida
  owner: medalhao
  independent_proof: Sessão padrão com heap efetivo >= 5,5 GiB; suíte inteira numa JVM verde.
  decision_ids:
  - DEC-MEMORIA-6G
  rejected_alternatives:
  - alternative: Subir a memória por spark-defaults.conf no contêiner
    reason: A declaração sairia da sessão e voltaria a ser herdada.
  swimlane:
    id: LANE-MEMORIA-6G
    name: Memória 6g lane
    owner: medalhao
    legs:
    - id: LEG-MEMORIA-6G
      observable_state: Sessão padrão com 6 GB de heap efetivo
      proof: maxMemory da JVM, não a propriedade.
      requires: []
      produces:
      - sessao com memoria medida
      tasks:
      - id: T-20260924-memoria-6g
        title: Memória do driver declarada com o valor medido
        goal: Fazer a sessão nascer com o heap que as baselines mediram, e não com o 1 GB de antes. Para rodar testes, o ÚNICO comando liberado ao agente é `docker compose -f infra/docker-compose.yml exec -T spark python3 -m pytest <arquivo> -k <cenarios>`.
        done_condition: Uma sessão criada por criar_sessao sem memória explícita tem spark.driver.memory = 6g e heap efetivo de pelo menos FOLGA_DO_HEAP × 6g, medido numa JVM nova; a recusa de heap menor que o declarado segue valendo; toda a suíte já existente de tests/test_performance.py passa sem edição.
        effort: S
        profile: standard
        execution_backend: any
        required_tools:
        - git
        - bash
        - python3
        - pytest
        - docker
        depends_on: []
        touches_paths:
        - src/medalhao/bronze.py
        - tests/test_performance.py
        creates_paths: []
        behavior:
        - id: B-1
          given: uma sessão criada por criar_sessao sem memória explícita, numa JVM ainda não iniciada
          when: a sessão é criada
          then: o padrão MEMORIA_DRIVER_PADRAO é "6g" — o valor com que as baselines de perf/ foram medidas e que tirou a Bronze de 506s para 374s de executor —, declarado no builder, e o heap EFETIVO lido por Runtime.getRuntime().maxMemory() é de pelo menos FOLGA_DO_HEAP × 6g — a regra que o código já tem, 0,85, porque a JVM desconta o espaço de sobrevivente; aceite e recusa são complementares, sem faixa intermediária. O cenário mede numa JVM NOVA, num processo filho, porque numa JVM já iniciada o builder não muda o heap; o valor fica como constante nomeada com o porquê, nunca espalhado.
        - id: B-2
          given: uma sessão cujo heap efetivo é menor que o declarado — JVM já iniciada com menos
          when: criar_sessao confere a sessão
          then: recusa quando o heap efetivo é menor que FOLGA_DO_HEAP × declarado — a mesma regra do B-1, do outro lado —, com o heap efetivo e o declarado na mensagem; o cenário sobe, num processo filho, uma JVM com MENOS memória que o padrão (2g contra 6g), e não um pedido absurdo; um pedido explícito de memória continua prevalecendo sobre o padrão; nenhum teste já existente de tests/test_performance.py é editado.
        evals:
        - id: eval_1
          description: O padrão é o valor medido
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in memoria_padrao_e_seis_gigas heap_efetivo_do_padrao; do python3 -m pytest --collect-only -q tests/test_performance.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_performance.py -k "memoria_padrao_e_seis_gigas or heap_efetivo_do_padrao"'
          verifies:
          - B-1
        - id: eval_2
          description: A recusa e o pedido explícito seguem
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in heap_menor_que_declarado_recusado pedido_explicito_prevalece; do python3 -m pytest --collect-only -q tests/test_performance.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_performance.py -k "heap_menor_que_declarado_recusado or pedido_explicito_prevalece"'
          verifies:
          - B-2
        - id: eval_3
          description: O que já existia segue verde
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in sessao_declara_memoria heap_efetivo_conferido_pela_jvm uma_passada_igual_a_duas; do python3 -m pytest --collect-only -q tests/test_performance.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_performance.py -k "sessao_declara_memoria or heap_efetivo_conferido_pela_jvm or uma_passada_igual_a_duas"'
          verifies:
          - B-1
          - B-2
        anti_patterns:
        - action: declarar a memória por PYSPARK_SUBMIT_ARGS ou spark-defaults
          reason: esconde a declaração fora da sessão
          instead: a constante no builder de criar_sessao
        - action: baixar o padrão para caber num teste
          reason: é o 1 GB que estourou a suíte
          instead: o teste pede memória explícita quando precisa de outra
        - action: editar um teste já existente
          reason: teste selado que precisa mudar denuncia mudança de comportamento
          instead: só acrescentar testes novos
        do_not_touch:
        - _raw
        - cvg/docs/adrs
        - contracts
        - src/pda
        rollback: Reverter src/medalhao/bronze.py e tests/test_performance.py ao commit assentado.
        observability: sessões com heap efetivo abaixo do declarado
steel_thread:
- LEG-MEMORIA-6G
