  - Partição competencia=2026-01 no MinIO, escrita pelo produtor
  - Spark 3.5.9 e os jars S3A, no contêiner pda-spark
  - 'pytest num ambiente que também leia Parquet — medido: hoje nenhum dos dois tem os dois'
  unknowns: []
