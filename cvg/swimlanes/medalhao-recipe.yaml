        - id: eval_2
          description: Ausente e vazia devolvem NAO_MEDIDO; medida e divergente devolve DIVERGE
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in particao_ausente particao_vazia presente_sem_ancora diverge_nao_e_nao_medido objeto_orfao_na_listagem erro_leitura_nao_e_nao_medido sem_ancora_vence_o_fechamento; do python3 -m pytest --collect-only -q tests/test_bronze.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_bronze.py -k "particao_ausente or particao_vazia or presente_sem_ancora or diverge_nao_e_nao_medido or objeto_orfao_na_listagem or erro_leitura_nao_e_nao_medido or sem_ancora_vence_o_fechamento"'
          verifies:
