        title: Normalizar a forma e classificar a identidade colapsada
        goal: Preservar o defeito da fonte com o total intacto.
        done_condition: A contagem de linhas e a soma não mudam entre Bronze e Silver, e cada colapso recebe exatamente uma das seis classificações. Na competência real, enquanto o mapa código→descrição não for aprovado no contrato, 'silver classificado' sai com estado NAO_MEDIDO na competência real — a capacidade existe e é entregue, com o estado dizendo por que a cadeia para.
