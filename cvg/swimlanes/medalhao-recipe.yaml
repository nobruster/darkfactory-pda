    sha256: 823955da853edb64bd7dc9caafb2e87327ca6aac3e5a6bae06c23dc7e2d0c5eb
  confidence: 1.0
  summary: 'Medido na competência inteira (ADR 0008): 65 códigos, 52 descrições, e 11 descrições cobrem 24 códigos — ''Pensão por Morte de '' funde 01, 03, 23 e 59. O defeito é identidade colapsada, não largura.'
decisions:
- id: ADR-0002-POSICIONAL
  status: accepted
  owner: Bruno Nunes
  rationale: Espécie aparece duas vezes no cabeçalho; ler por nome perde uma das duas em silêncio.
- id: ADR-0003-HALF-EVEN
  status: accepted
  owner: Bruno Nunes
  rationale: Precisão declarada, arredonda uma vez no total, meio-para-par — as três em ordem de precedência.
- id: ADR-0004-CODIGO-E-CHAVE
  status: accepted
  owner: Bruno Nunes
  rationale: A chave é o código; agrupar por descrição somaria quatro espécies numa linha com o total continuando a bater.
seams:
- id: SEAM-BRONZE
  name: Bronze — o lago lido como fonte
  description: Separa ler o lago de interpretar o que está nele.
  evidence:
  - E-ANCORA-202601
  responsibility: Ler a partição publicada e recusar seguir quando ela não reproduz a âncora, antes de qualquer transformação.
  consumes:
  - contrato validado
  produces:
  - bronze conferido
  - totais por código de Bronze
  owner: medalhao
  independent_proof: Partição ausente ou vazia devolve NAO_MEDIDO; partição medida que não reproduz QUALQUER um dos cinco controles devolve DIVERGE, com o controle que falhou nomeado. Nenhum dos dois escreve camada.
  decision_ids:
  - ADR-0002-POSICIONAL
  rejected_alternatives:
  - alternative: Tratar o Parquet do lago como já conferido por ter sido escrito pela fábrica
    reason: Mede o que o pipeline produziu, não o que a fonte publicou; e a gravação é incremental, então a partição pode ter recebido uma segunda execução sem que nada acuse.
  swimlane:
    id: LANE-BRONZE
    name: Bronze lane
    owner: medalhao
    legs:
    - id: LEG-BRONZE-REPRODUZ-ANCORA
      observable_state: Bronze só existe quando reproduz a âncora do contrato
      proof: A partição lida reproduz os cinco controles ancorados; ausente ou vazia devolve NAO_MEDIDO, e medida-e-divergente devolve DIVERGE — estados distintos, nunca colapsados.
      requires: []
      produces:
      - bronze conferido
      - totais por código de Bronze
      tasks:
      - id: T-20260922-bronze-confere-ancora
        title: Ler a partição do lago e conferi-la contra a âncora
        goal: Fazer a camada recusar nascer sobre dado que não bate.
        done_condition: 'Os cinco controles da partição real batem com o contrato. Partição AUSENTE ou VAZIA devolve NAO_MEDIDO; partição MEDIDA que diverge em qualquer controle devolve DIVERGE — os dois são estados distintos e nenhum escreve camada, porque confundir ausência de medição com reprovação torna instável a interface que Silver consome. Os evals rodam num ambiente que tem AO MESMO TEMPO pytest e um leitor de Parquet — medido, hoje nenhum tem: o host não tem pyspark, pyarrow, pandas, duckdb nem java, e o contêiner pda-spark não tem pytest. As ferramentas do HOST são git, bash, python3, pytest e docker: pyspark NÃO entra em required_tools, porque o pré-voo confere o PATH do host com shutil.which e a tarefa que existe PARA montar o ambiente seria impedida de começar por exigir o que ela mesma vai prover — pyspark vive dentro do contêiner, que o docker levanta. Montar esse ambiente é parte desta tarefa e tem caminho declarado — infra/medalhao-evals.sh, que roda os evals num checkout limpo sem instalação manual — e os nove evals das três camadas o INVOCAM, em vez de chamar pytest direto, porque criar o script não muda o ambiente de quem executa e o eval falharia antes de testar Bronze. Sem ele a obrigação existiria sem forma reproduzível de cumpri-la, e um agente que criasse o arquivo mesmo assim receberia path_policy: fail.'
        effort: M
        profile: standard
        execution_backend: any
        required_tools:
        - git
        - bash
        - python3
        - pytest
        - docker
        depends_on: []
        touches_paths: []
        creates_paths:
        - src/medalhao/bronze.py
        - tests/test_bronze.py
        - infra/medalhao-evals.sh
        behavior:
        - id: B-1
          given: uma partição do lago e o contrato da competência, com a âncora de linhas e de soma medidas na fonte
          when: Bronze lê a partição
          then: 'a contagem e a soma são recalculadas SOBRE A PARTIÇÃO, nunca sobre a união das partições — um agregado sem GROUP BY na coluna de partição não mede partição nenhuma, e foi assim que a leitura da união deu 41.622.553 contra a âncora de 41.572.553 e uma contaminação inexistente foi reportada, quando a partição real batia exato e as 50.000 linhas estavam em competencia=fatia-teste, isolada. A soma é feita com a precisão DECLARADA no contrato, jamais herdada do contexto global, como o ADR 0009 exige, porque qualquer biblioteca importada pode alterar o contexto e o acumulador passaria a perder centavos sem que uma linha deste código mude. Os CINCO controles da âncora são comparados INDIVIDUALMENTE, como a R-5 da tech-spec exige — count_linhas, sum_vl_liquido, min_vl_liquido, max_vl_liquido e linhas_invalidas. Contagem e soma sozinhas não bastam, e não bastam nem juntas: uma alteração COMPENSADA entre duas linhas preserva as duas e ainda assim empurra o máximo acima dos 183.725,76 ancorados, com todos os valores finitos, não negativos e na escala permitida. Silver preservaria a soma e Gold compararia soma e cardinalidade; nenhuma das três veria. Bronze PRODUZ o mapa total_por_codigo — soma exata não quantizada, por código — e ele é parte declarada de ''bronze conferido''. É a ORIGEM do mapa: quem lê o Parquet é quem sabe qual valor pertence a qual código, e uma camada posterior que o recalcule a partir dos mesmos bytes repetiria um erro de atribuição nos dois lados da comparação, aprovando-o. Cada controle que diverge é nomeado na saída, porque saber QUAL falhou é o que separa investigar de adivinhar — e cada diferença recebe EXATAMENTE UMA das seis classificações da R-6 (CONFIRMED_SOURCE_DEFECT, CONFIRMED_LEGACY_DEFECT, APPROVED_BEHAVIOR_CHANGE, MODERN_DEFECT, CONTRACT_AMBIGUITY, UNRESOLVED). DIVERGE é estado de MEDIÇÃO, não classificação: recusar a partição corretamente e entregar diagnóstico sem classificação deixaria a diferença sem dono. Diferença que a camada não saiba classificar recebe UNRESOLVED, que é uma das seis e BLOQUEIA — nunca fica em branco. O tipo monetário da ENTRADA é recusado se não for decimal — a R-4 manda recusar float, nunca convertê-lo, e converter apaga a evidência da entrada proibida: Decimal(str(1.25)) devolve 1.25, finito, não negativo e na escala 2, satisfazendo todas as verificações de domínio enquanto a origem era um DOUBLE. A recusa é do TIPO declarado no esquema do Parquet, antes de ler valor algum. Só então a comparação monetária é entre Decimal e Decimal, e a igualdade é exata — tolerância aqui seria a Regra 3 pelo avesso, afrouxar o oráculo para a camada passar. Todo valor lido é conferido contra o domínio monetário do contrato antes de entrar no acumulador — finito, NÃO NEGATIVO e dentro da escala declarada. A não-negatividade não é preferência, e sim a premissa de soma MONOTÔNICA sob a qual o ADR 0009 deriva a precisão 14 — um valor negativo quebra a premissa e a perda de centavo passa a acontecer DURANTE a soma, onde a comparação final não a enxerga. Bronze lê Parquet, que não passa nem pela gramática do CSV nem pela fronteira do envelope, e por isso é uma TERCEIRA porta de entrada para valores; fechá-la é obrigação desta camada. Valor fora do domínio é defeito classificado com identidade, valor original e posição, nunca somado em silêncio. A procedência do arquivo que originou a partição é APRESENTADA a Bronze junto da leitura — hoje pelo pacote que a gravação emite, não por coluna do Parquet, porque MEDIDO em gravar_lago.py a partição tem três colunas mais a de partição e nenhuma é procedência; exigir que ela viesse do Parquet faria Bronze devolver NAO_MEDIDO na partição CORRETA, que é o defeito da Regra 9 pelo avesso. Quando apresentada, o hash_csv_sha256 é comparado com o ancorado e divergência é DIVERGE, porque reproduzir os dois controles não distingue o arquivo ancorado de outro com os mesmos totais, e a âncora vale para UM arquivo. Fazer a partição carregar a procedência é melhoria desejável e exige tarefa própria, por tocar em gravar_lago.py, que está sem Task-Spec (Regra 11) — enquanto não existir, a ausência do vínculo tem CONSEQUÊNCIA definida e propagada — ''bronze conferido'' sai marcado PROCEDENCIA_NAO_VINCULADA, Silver e Gold propagam a marca sem removê-la, e Gold NÃO PUBLICA sob ela. Registrar só uma ressalva deixaria a cadeia publicar partição diferente da ancorada, porque o hash correto num pacote sem vínculo verificável com a partição lida satisfaz a comparação textual e não prova nada. Partição que diverge é DIVERGE, e Bronze não escreve nada'
        - id: B-2
          given: uma competência cuja partição não existe no lago, ou existe com zero linhas
          when: Bronze lê a partição
          then: 'retorna NAO_MEDIDO como valor, sem escrever camada nenhuma e sem encerrar o processo; partição ausente e partição vazia são casos distintos e ambos NAO_MEDIDO, porque ler o lago e não encontrar nada não é o mesmo que medir e encontrar zero — a Regra 9 existe porque o segundo caminho é o que veste NAO_MEDIDO de MEDIDO. As outras partições do lago são nomeadas E CONTADAS na saída, e a soma das contagens por partição é conferida contra o total lido — nomear sem contar afirma isolação sem medi-la, e a lista de nomes continuaria idêntica se as linhas de uma partição tivessem migrado para outra. A PRECEDÊNCIA é declarada e não negociável: o estado da competência SOLICITADA decide primeiro. Ausente ou vazia devolve NAO_MEDIDO mesmo que o lago tenha outros problemas, porque não se reprova o que não se mediu. Só quando a competência existe e foi medida é que o fechamento do lago entra — e aí, se a soma das partições não fecha com o total, é DIVERGE, porque linha que não pertence a partição nenhuma é contaminação — e o total vem de um UNIVERSO INDEPENDENTE, a listagem dos objetos do lago, nunca da mesma leitura agrupada: somar contagens agrupadas pela própria relação lida é identidade, fecha sempre, inclusive somando o grupo nulo, e não veria arquivo que as DUAS leituras ignoraram. As chaves que constituem partição válida são as declaradas no contrato; objeto fora delas, ou linha cuja chave de partição é nula, conta como não pertencente e faz o controle reprovar, e foi para vê-la que este controle existe'
        evals:
        - id: eval_1
          description: Os cinco controles comparados individualmente, e a partição medida isoladamente
          bash: bash infra/medalhao-evals.sh tests/test_bronze.py -k "cinco_controles or alteracao_compensada or isola_particao or nao_soma_uniao or precisao_declarada"
          verifies:
          - B-1
        - id: eval_2
          description: Ausente e vazia devolvem NAO_MEDIDO; medida e divergente devolve DIVERGE
          bash: bash infra/medalhao-evals.sh tests/test_bronze.py -k "particao_ausente or particao_vazia or diverge_nao_e_nao_medido"
          verifies:
          - B-2
        - id: eval_3
          description: Float recusado na entrada, e toda diferença com uma das seis classificações
          bash: bash infra/medalhao-evals.sh tests/test_bronze.py -k "centavo_a_mais or maximo_acima_do_ancorado or recusa_float_na_entrada or classificacao_das_seis"
          verifies:
          - B-1
        anti_patterns:
        - action: conferir só contagem e soma, deixando min, max e linhas_invalidas de fora
          reason: a R-5 exige os cinco individualmente, e uma alteração compensada entre duas linhas preserva contagem e soma enquanto empurra o máximo acima do ancorado
          instead: comparar os cinco, nomeando na saída qual deles divergiu
        - action: aceitar diferença de centavos como arredondamento
          reason: afrouxar a tolerância é editar o oráculo pelo avesso
          instead: exigir igualdade exata entre Decimal e Decimal
        - action: reimplementar do zero o que scripts/medir_lago.py já faz, sem citá-lo
          reason: os dois passariam a medir a mesma partição com pisos possivelmente diferentes, e medir_lago.py traz a âncora como default de linha de comando em vez de lê-la do contrato
          instead: partir de medir_lago.py, lendo a âncora do CONTRATO, e declarar no código qual dos dois é o de produção
        do_not_touch:
        - _raw
        - cvg/docs/adrs
        - contracts
        rollback: Remover o leitor Bronze e seus testes.
        observability: partições recusadas por controle divergente
- id: SEAM-SILVER
  name: Silver — o defeito classificado, nunca corrigido
  description: Separa normalizar a forma de alterar o conteúdo.
  evidence:
  - E-ESPECIE-TRUNCADA
  responsibility: Tipar e normalizar sem tocar no valor, e classificar o defeito de identidade em vez de resolvê-lo.
  consumes:
  - bronze conferido
  - totais por código de Bronze
  produces:
  - silver classificado
  - totais por código de Silver
  owner: medalhao
  independent_proof: Os 11 colapsos do contrato aparecem classificados como CONFIRMED_SOURCE_DEFECT, e a soma de Silver é idêntica à de Bronze.
  decision_ids:
  - ADR-0004-CODIGO-E-CHAVE
  rejected_alternatives:
  - alternative: Deduplicar as descrições colapsadas escolhendo a mais frequente
    reason: Destrói a prova de que a origem publica 24 códigos sob 11 descrições; sem prova ninguém cobra quem mandou o dado errado.
  swimlane:
    id: LANE-SILVER
    name: Silver lane
    owner: medalhao
    legs:
    - id: LEG-SILVER-PRESERVA-DEFEITO
      observable_state: Silver classifica o defeito e conserva o total
      proof: A soma de Silver é idêntica à de Bronze, e os 11 colapsos saem classificados em vez de corrigidos.
      requires:
      - bronze conferido
      - totais por código de Bronze
      produces:
      - silver classificado
      - totais por código de Silver
      tasks:
      - id: T-20260922-silver-classifica-colapso
        title: Normalizar a forma e classificar a identidade colapsada
        goal: Preservar o defeito da fonte com o total intacto.
        done_condition: A contagem de linhas e a soma não mudam entre Bronze e Silver, e cada colapso recebe exatamente uma das seis classificações.
        effort: S
        profile: standard
        execution_backend: any
        required_tools:
        - git
        - bash
        - python3
        - pytest
        - docker
        depends_on:
        - T-20260922-bronze-confere-ancora
        touches_paths: []
        creates_paths:
        - src/medalhao/silver.py
        - tests/test_silver.py
        behavior:
        - id: B-1
          given: o Bronze conferido e o contrato, que declara 65 códigos, 52 descrições e 11 colapsos cobrindo 24 códigos, pré-classificados como CONFIRMED_SOURCE_DEFECT com aprovador e data
          when: Silver normaliza
          then: 'a CHAVE é o código, nunca a descrição, como o ADR 0008 exige — agrupar por descrição fundiria os 24 códigos colapsados em 11 linhas e o total continuaria batendo, com os mapas por código errados e nada acusando. A normalização é de FORMA e não de conteúdo — espaços à borda e caixa da descrição, jamais o valor monetário. E a CONTAGEM DE COLAPSOS é medida sobre a descrição ORIGINAL, nunca sobre a normalizada, porque a normalização pode FUNDIR descrições que a fonte publica distintas: ''ABC'' e ''abc'' de códigos diferentes viram um grupo só depois de igualar a caixa, e o colapso criado pela camada seria atribuído à fonte, ou uma partição correta receberia DIVERGE. Se as duas contagens diferirem, a diferença é da normalização e sai nomeada, não somada aos 11 do contrato. E a descrição ORIGINAL é PRESERVADA no registro do defeito, não apenas usada para contar — medir sobre ela e depois gravar o texto normalizado faria ''ABC'' e ''abc'' virarem indistinguíveis na saída, com as contagens corretas e a prova específica perdida. A Regra 4 pede preservar o defeito, e defeito de identidade sem a identidade original não é preservação, que atravessa como Decimal com a precisão declarada. A marca PROCEDENCIA_NAO_VINCULADA, quando Bronze a emite, atravessa Silver SEM ser removida e segue em ''silver classificado'' — remover uma marca de limitação é apagar prova, não normalizar. Silver PRODUZ o mapa total_por_codigo, em soma EXATA não quantizada, e ele é parte declarada de ''silver classificado'' — Gold o consome, e sem essa declaração Gold recalcularia os dois lados com a mesma transformação, perdendo a independência que o próprio plano dele exige. A conservação provada NÃO é só a soma global: o mapa de Silver é comparado com o de Bronze CÓDIGO A CÓDIGO, porque trocar os valores de dois códigos preserva soma, chaves, cardinalidades e grupos — {''01'': 10.00, ''03'': 20.00} virando {''01'': 20.00, ''03'': 10.00} passa em toda prova global e altera o resultado por espécie. O MULTICONJUNTO de linhas de Silver é idêntico ao de Bronze no que toca código e valor — igualdade linha a linha, não agregada: duas linhas do MESMO código e MESMA descrição, 10.00 e 20.00, virando 11.00 e 19.00 preservam contagem, soma E o mapa por código, porque o mapa agrega justamente por código e não separa linhas irmãs. Por isso a prova é sobre o multiconjunto, e a contagem de linhas de Silver é idêntica à de Bronze — soma e mapa por código não bastam: remover uma linha de valor ZERO cuja combinação código/descrição continue presente preserva a soma, o mapa, as cardinalidades e os colapsos, e a perda passaria em toda prova declarada. A soma de Silver também é comparada com a de Bronze e precisa ser IDÊNTICA — um pipeline que altera o total ao normalizar texto tem um defeito, não uma melhoria. Cada colapso recebe EXATAMENTE UMA das seis classificações e a contagem medida é conferida contra a do contrato — encontrar número diferente de 11 é DIVERGE, porque o contrato mediu na competência inteira e a divergência significa fonte diferente da ancorada, não permissão para ajustar o número'
        - id: B-2
          given: um código cuja descrição diverge do contrato, ou um colapso não declarado
          when: Silver normaliza
          then: 'a linha atravessa com o VALOR intacto e o defeito registrado, nunca descartada nem corrigida — descartar mudaria o total e corrigir destruiria a prova. Defeito não classificado BLOQUEIA a camada, e UNRESOLVED — que é uma das seis — BLOQUEIA igualmente: classificação preenchida não é defeito resolvido, e uma descrição divergente que recebesse UNRESOLVED conservaria o valor e satisfaria literalmente a condição de conclusão enquanto a diferença segue sem dono, porque a classificação é o que transforma um erro da origem em cobrança rastreável; e nenhuma classificação é inferida em silêncio, já que atribuir CONFIRMED_SOURCE_DEFECT sem aprovador transformaria juízo em default. MEDIDO no contrato: existem as cardinalidades 65/52/11/24 e a classificação global, mas NÃO existe mapa código→descrição nem a lista dos 11 grupos aprovados — e sem esse referencial ''descrição que diverge do contrato'' não é verificável, porque trocar a descrição de um código mantém todas as quatro cardinalidades. Silver então NÃO INVENTA referencial e NÃO aceita o grupo novo por default: sem o mapa declarado no contrato, a comparação por identidade devolve NAO_MEDIDO, distinto de bloquear por defeito — e esse NAO_MEDIDO IMPEDE produzir ''silver classificado'', porque uma capacidade chamada ''classificado'' que sai com a identidade não medida mente no próprio nome. A cadeia para aqui com o motivo nomeado, em vez de seguir e publicar com a identidade em aberto. Declarar esse mapa é trabalho do contrato, com aprovador e data, não desta camada — e ENQUANTO ele não existir, esta tarefa entrega apenas a capacidade CONDICIONAL: o caminho NAO_MEDIDO provado, e o caminho positivo provado contra contrato de teste, jamais contra a competência contratada. Concluir Bronze NÃO habilita a prova positiva de Silver sobre 2026-01, e o plano não finge que habilita. scripts/medir_colapso.py já mede os 11 grupos na competência inteira; falta a aprovação, que é decisão de negócio.'
        evals:
        - id: eval_1
          description: Chave é o código; contagem, mapa e soma preservados, inclusive linha de valor zero
          bash: bash infra/medalhao-evals.sh tests/test_silver.py -k "chave_e_codigo or multiconjunto_identico or linhas_irmas_com_valores_trocados or linha_de_valor_zero_nao_some or mapa_por_codigo_preservado"
          verifies:
          - B-1
        - id: eval_2
          description: Os 11 colapsos saem classificados e a contagem confere
          bash: bash infra/medalhao-evals.sh tests/test_silver.py -k "colapso_classificado or contagem_de_colapsos or classificacao_unica or colapsos_na_descricao_original"
          verifies:
          - B-1
        - id: eval_3
          description: Defeito não classificado bloqueia em vez de passar
          bash: bash infra/medalhao-evals.sh tests/test_silver.py -k "nao_classificado_bloqueia or valor_intacto or atravessa_sem_descartar or unresolved_bloqueia or sem_mapa_nao_produz_capacidade"
          verifies:
          - B-2
        anti_patterns:
        - action: provar a conservação só com a soma global entre Bronze e Silver
