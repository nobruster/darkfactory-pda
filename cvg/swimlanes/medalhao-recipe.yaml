      tasks:
      - id: T-20260923-contrato-expoe-particao
        title: Expor particionamento e limites de expoente no Contrato carregado
        goal: Fazer o objeto carregado dizer o que o YAML já declara, sem quebrar a primeira descida.
        done_condition: O contrato real expõe particionamento e politica_decimal.emax/emin; um contrato sem esses blocos carrega com os campos None; e TODA a suíte já existente de tests/test_contrato.py passa sem que um teste dela seja editado.
        effort: S
        profile: standard
        execution_backend: any
        required_tools:
        - git
        - bash
        - python3
        - pytest
        - docker
        depends_on: []
        touches_paths:
