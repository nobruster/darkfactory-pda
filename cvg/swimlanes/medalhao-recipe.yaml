    sha256: 823955da853edb64bd7dc9caafb2e87327ca6aac3e5a6bae06c23dc7e2d0c5eb
  confidence: 1.0
  summary: 'Medido na competência inteira (ADR 0008): 65 códigos, 52 descrições, e 11 descrições cobrem 24 códigos — ''Pensão por Morte de '' funde 01, 03, 23 e 59. O defeito é identidade colapsada, não largura.'
decisions:
- id: ADR-0002-POSICIONAL
  status: accepted
  owner: Bruno Nunes
  rationale: Espécie aparece duas vezes no cabeçalho; ler por nome perde uma das duas em silêncio.
- id: ADR-0003-HALF-EVEN
  status: accepted
  owner: Bruno Nunes
  rationale: Precisão declarada, arredonda uma vez no total, meio-para-par — as três em ordem de precedência.
- id: ADR-0004-CODIGO-E-CHAVE
  status: accepted
  owner: Bruno Nunes
  rationale: A chave é o código; agrupar por descrição somaria quatro espécies numa linha com o total continuando a bater.
- id: DEC-MAPA-APROVADO-OBRIGATORIO
  owner: Bruno Nunes
  rationale: 'Decidido pelo dono em 2026-09-23, respondendo à objeção R26 C4 do adversário, que devolveu a pergunta como requisito: a aprovação INDIVIDUAL do mapa código→descrição dos 11 colapsos é condição obrigatória de publicação. A aprovação global de IDENTIDADE_COLAPSADA como CONFIRMED_SOURCE_DEFECT não basta, porque ela aprova a EXISTÊNCIA dos 11 colapsos e não QUAIS códigos cada um cobre — e trocar a descrição de um código mantém as quatro cardinalidades. Consequência aceita: a competência 2026-01 não chega a Gold até o mapa ser aprovado.'
  status: accepted
seams:
