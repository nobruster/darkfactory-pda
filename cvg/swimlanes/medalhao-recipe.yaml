er veredito, e remover depois não desfaz a exposição. Um teste que confira só o resultado final ou a ausência de arquivos ao término não vê isso — o eval observa que o caminho de destino permanece inalterado DURANTE a reconciliação. E a publicação em si é uma transição INDIVISÍVEL de visibilidade: o conjunto publicado é exatamente o conjunto reconciliado, tudo ou nada. Copiar vários arquivos expondo-os à medida que chegam deixaria um consumidor lendo parte das candidatas, ou misturadas com as da execução anterior, com a reconciliação correta e o total lido por ninguém aprovado — e uma interrupção no meio congela esse estado. Publicação interrompida deixa o destino como estava antes'
