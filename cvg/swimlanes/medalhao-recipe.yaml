        - tests/test_contrato.py
        creates_paths: []
        behavior:
        - id: B-1
          given: o contrato real da competência 2026-01, que declara particionamento — chave, caminho, formato, valores medidos, objetos auxiliares ignorados — e politica_decimal com emax 999999 e emin -999999, com aprovador e data
          when: o contrato é carregado
          then: 'o objeto Contrato expõe um campo particionamento com os cinco atributos, a politica_decimal expõe emax e emin, e o Contrato expõe o MAPA DE COLAPSOS APROVADO — os grupos, cada um com a descrição original e a lista dos códigos que ela cobre, e o aprovador e a data da aprovação —, porque a decisão DEC-MAPA-APROVADO-OBRIGATORIO torna o mapa condição de publicação e, sem este campo, ele não teria caminho do YAML até Silver nem depois de aprovado, lidos do MESMO carregamento — uma única leitura do YAML, nunca uma segunda porta para o mesmo oráculo. Os campos novos são OPCIONAIS no carregador: um contrato sem esses blocos carrega com eles None, e None não é zero nem vazio — é ausência declarada, que Bronze, e não o carregador, trata como NAO_MEDIDO. Exigi-los aqui recusaria os contratos-fixture da primeira descida, que não os têm, e quebraria a suíte selada: o requisito é do consumidor, e é ele que o impõe. Já um bloco PRESENTE E INVÁLIDO é RECUSADO no carregamento, como o carregador selado já faz com política contraditória — emax que não é inteiro, emin maior que emax, particionamento sem chave, mapa com grupo de um código só ou código repetido entre grupos, aprovação sem aprovador ou sem data. Entregar o bloco e deixar a camada tropeçar ao construir o Context trocaria uma recusa com motivo por uma exceção longe da causa'
        - id: B-2
          given: a suíte já existente de tests/test_contrato.py, selada na primeira descida
          when: o carregador estendido é testado
          then: 'toda a suíte existente passa SEM que um teste dela seja editado, e o comportamento selado fica intacto — recusa de float nos controles, precisão derivada por suficiência, política contraditória recusada no carregamento, NAO_MEDIDO sem âncora. Estender não é afrouxar: a tarefa só ACRESCENTA atributos, e um teste selado que precisasse mudar denunciaria que o carregador mudou de comportamento, que é o que a Regra 11 existe para impedir sem autorização'
        evals:
