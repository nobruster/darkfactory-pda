schema_version: 1
intent:
  id: DI-FABRICA-COMPETENCIA
  title: Conferir uma competência contra âncora medida antes de publicar
  summary: >-
    Ler o arquivo de uma competência, produzir o agregado, compará-lo contra a
    âncora medida na origem, classificar toda diferença encontrada e deixar um
    pacote de evidência — recusando publicar quando não houver prova.
  claim: proposed
  source:
    uri: cvg/docs/tech-spec/tech-spec-exemplo-fabrica.md
    captured_at: "2026-09-17T00:00:00Z"
    sha256: "c820a57d632bf5b05dac362f1df7c4a251d27e215aab4b85d1a55ab95cf207c1"
  success:
    - Sem âncora medida o veredito é ACEITO_SEM_ANCORA e não autoriza publicar.
    - Toda diferença recebe exatamente uma de seis classificações.
    - Um valor de ponto flutuante em campo monetário é recusado na entrada.
    - Uma divergência de um centavo é recusada antes da publicação.
    - Cada execução deixa evidência que reconstrói o veredito sem reexecutar.
  out_of_scope:
    - Corrigir defeitos da origem — a fábrica classifica, nunca corrige.
    - Substituir o sistema atual, que segue rodando em paralelo.
    - Interface visual ou painel.
system_map:
  claim: proposed
  components:
    - Contrato e âncora
    - Leitura da competência
    - Agregação monetária
    - Juízo do agregado
    - Pacote de evidência
  external_dependencies:
    - Arquivo da competência publicado pela origem, imutável
    - Âncora medida na origem por fora do pipeline
  unknowns: []
evidence:
  - id: E-ANCORA-202603
    claim: external
    source:
      uri: cvg/docs/adrs/0002-the-first-anchor-is-competencia-2026-03-measured-at-source.md
      captured_at: "2026-09-16T00:00:00Z"
      sha256: "f2a12e31911ddd46863e80ea2fcc18d8c7820c08b457d5632522df1dae9d0f9b"
    confidence: 1.0
    summary: >-
      Competência 2026-03 medida na origem em 46s por totais_controle.py,
      independente do pipeline — 41719140 linhas, soma 78771556568.72.
  - id: E-ADR-ARREDONDAMENTO
    claim: derived
    source:
      uri: cvg/docs/adrs/0001-money-rounds-half-to-even-at-two-decimals.md
      captured_at: "2026-09-17T00:00:00Z"
      sha256: "04aa9a6c1e696ae77305cd3191c3a7828dbf3bcde3d27d5e8f0edca554cbbaea"
    confidence: 1.0
    summary: >-
      Arredondamento meio-para-par a 2 casas; dois de três empates testados
      divergem em um centavo contra meio-para-cima.
decisions:
  - id: ADR-0001-HALF-EVEN
    status: accepted
    owner: Bruno Nunes
    rationale: >-
      Meio-para-par não enviesa o acumulado; meio-para-cima empurra todo
      empate na mesma direção e vira tendência em volume.
  - id: ADR-0002-ANCORA-2026-03
    status: accepted
    owner: Bruno Nunes
    rationale: >-
      A âncora é medida na origem por fora do pipeline. Medi-la com o
      pipeline seria o pipeline conferindo a si mesmo.
  - id: ADR-0006-PRECISAO-DECLARADA
    status: accepted
    owner: Bruno Nunes
    rationale: >-
      A precisão do contexto decimal é declarada, não herdada. Em prec=6,
      10000.00 + 0.01 vira 10000.0 e quantizar depois não recupera — a
      perda é anterior ao arredondamento.
  - id: ADR-0005-VEREDITO-SEM-ANCORA
    status: accepted
    owner: Bruno Nunes
    rationale: >-
      Execução sem âncora vale ACEITO_SEM_ANCORA; NAO_MEDIDO é a causa,
      campo dentro do pacote. São camadas, não alternativas — e os vereditos
      terminais são quatro, incluindo RECUSADO.
  - id: ADR-0004-ARREDONDA-NO-TOTAL
    status: accepted
    owner: Bruno Nunes
    rationale: >-
      Arredonda uma vez, sobre o total final. Por campo, 2,345 + 2,345 dá
      4,68 contra 4,69 — ambos meio-para-par. A mesma granularidade vale
      para a medição da âncora, senão a comparação mede a granularidade.
seams:
  - id: SEAM-CONTRATO-ANCORA
    name: Contrato e âncora
    description: Separa a verdade declarada do código que a consome.
    evidence: [E-ANCORA-202603]
    responsibility: >-
      Guardar a âncora medida e o layout de leitura, e recusar construir sem
      eles.
    consumes: [âncora medida na origem]
    produces: [contrato validado]
    owner: contrato
    independent_proof: >-
      Um contrato sem âncora para a competência pedida retorna NAO_MEDIDO e
      o processo termina em código diferente de zero.
    decision_ids: [ADR-0002-ANCORA-2026-03]
    rejected_alternatives:
      - alternative: Gerar a âncora rodando o pipeline na competência
        reason: >-
          Seria o pipeline conferindo a si mesmo; defeito comum às duas
          execuções ficaria invisível.
    swimlane:
      id: LANE-CONTRATO
      name: Contrato lane
      owner: contrato
      legs:
        - id: LEG-CONTRATO-RECUSA-SEM-ANCORA
          observable_state: A fábrica recusa construir sem âncora medida
          proof: >-
            Competência sem âncora no contrato produz NAO_MEDIDO e exit
            diferente de zero, antes de qualquer leitura de dado.
          requires: []
          produces: [contrato validado]
          tasks:
            - id: T-20260917-contrato-ancora
              title: Carregar o contrato e recusar competência sem âncora
              goal: Fazer a ausência de prova bloquear, em vez de virar verde.
              done_condition: >-
                Competência com âncora carrega os cinco valores; sem âncora
                retorna NAO_MEDIDO e exit 1.
              effort: S
              profile: standard
              execution_backend: any
              required_tools: [git, bash, python3, pytest]
              depends_on: []
              touches_paths: []
              creates_paths:
                - src/fabrica/contrato.py
                - tests/test_contrato.py
              behavior:
                - id: B-1
                  given: um contrato com os cinco números nomeados (count_linhas, sum_vl_liquido, min, max, linhas_invalidas), a procedência (aprovador, data, comando que mediu) E o layout de leitura (posições, formato monetário, chave do registro)
                  when: o contrato é carregado
                  then: âncora, procedência e layout saem juntos, com os cinco controles sob os MESMOS nomes que o agregado usa — count_linhas, sum_vl_liquido, min_vl_liquido, max_vl_liquido, linhas_invalidas; a MESMA âncora sem aprovador, sem data ou sem layout resulta em NAO_MEDIDO
                - id: B-2
                  given: uma competência sem âncora no contrato
                  when: o contrato é carregado
                  then: RETORNA o veredito NAO_MEDIDO como valor — não grava nem encerra o processo; quem persiste é a evidência, e quem encerra é o orquestrador
              evals:
                - id: eval_1
                  description: Cinco valores nomeados com procedência; sem aprovador ou data vira NAO_MEDIDO
                  bash: pytest -q tests/test_contrato.py -k "ancorada or sem_procedencia"
                  verifies: [B-1]
                - id: eval_2
                  description: Sem âncora retorna NAO_MEDIDO como valor, sem escrever em disco
                  bash: pytest -q tests/test_contrato.py -k "nao_medido and not evidencia"
                  verifies: [B-2]
                - id: eval_3
                  description: A âncora carregada bate com o contrato em disco
                  bash: pytest -q tests/test_contrato.py -k integridade
                  verifies: [B-1, B-2]
              anti_patterns:
                - action: gerar a âncora automaticamente quando ela falta
                  reason: um número que ninguém viu medir é um palpite
                  instead: retornar NAO_MEDIDO e parar
                - action: tratar âncora ausente como zero
                  reason: o gate compararia contra nada e publicaria ACEITO
                  instead: distinguir ausência de valor
                - action: editar a âncora para um veredito passar
                  reason: falsifica a verdade contra a qual tudo é medido
                  instead: investigar; âncora revista exige nova aprovação
              do_not_touch: [cvg/docs/adrs]
              rollback: Remover o carregador de contrato e seus testes.
              observability: contagem de competências ancoradas no contrato
  - id: SEAM-LEITURA
    name: Leitura da competência
    description: Separa a extração dos bytes da interpretação monetária.
    evidence: [E-ANCORA-202603]
    responsibility: Ler os registros da competência preservando os bytes originais.
    consumes: [arquivo da competência]
    produces: [registros lidos, defeitos observados]
    owner: leitura
    independent_proof: >-
      O hash do arquivo antes e depois da leitura é idêntico, e a contagem de
      registros lidos bate com a contagem da âncora.
    decision_ids: [ADR-0002-ANCORA-2026-03]
    rejected_alternatives:
      - alternative: Normalizar valores durante a leitura
        reason: >-
          Normalizar apaga o defeito da origem antes que alguém possa
          classificá-lo.
    swimlane:
      id: LANE-LEITURA
      name: Leitura lane
      owner: leitura
      legs:
        - id: LEG-LEITURA-NAO-ALTERA-FONTE
          observable_state: A leitura não altera a fonte e conta o esperado
          proof: >-
            sha256 do arquivo inalterado após a leitura; contagem de
            registros igual a 41719140 para 2026-03.
          requires: [contrato validado]
          produces: [registros lidos, defeitos observados]
          tasks:
            - id: T-20260917-leitura-competencia
              title: Ler a competência sem alterar a fonte
              goal: Extrair registros preservando os bytes originais.
              done_condition: >-
                O sha256 do arquivo é idêntico antes e depois, e a contagem
                de registros bate com a âncora.
              effort: M
              profile: standard
              execution_backend: any
              required_tools: [git, bash, python3, pytest]
              depends_on: [T-20260917-contrato-ancora]
              touches_paths: []
              creates_paths:
                - src/fabrica/leitura.py
                - tests/test_leitura.py
              behavior:
                - id: B-1
                  given: o arquivo de uma competência e o layout declarado no contrato (posições, formato monetário, chave do registro)
                  when: a leitura termina
                  then: o sha256 do arquivo é idêntico ao de antes, e cada campo lido vem da POSIÇÃO declarada — cabeçalho repetido não decide nada
                - id: B-2
                  given: o arquivo de 2026-03, com um registro cujo campo monetário é ilegível
                  when: os registros são contados e a leitura termina
                  then: a contagem é 41719140, o registro entra em linhas_invalidas e NÃO entra em sum/min/max, e o defeito sai com identidade, valor original e posição — preservar no arquivo não basta se a informação some na interface
              evals:
                - id: eval_1
                  description: Fonte byte-idêntica; leitura posicional com cabeçalho repetido
                  bash: pytest -q tests/test_leitura.py -k "sha256 or posicional"
                  verifies: [B-1]
                - id: eval_2
                  description: Contagem bate com a âncora e o defeito sai com identidade
                  bash: pytest -q tests/test_leitura.py -k "contagem or defeito_identificado"
                  verifies: [B-2]
                - id: eval_3
                  description: A leitura reporta seus segundos para a orquestração medir o total
                  bash: pytest -q tests/test_leitura.py -k reporta_duracao
                  verifies: [B-1, B-2]
              anti_patterns:
                - action: escrever no arquivo de origem
                  reason: destrói a prova de que a origem publicou aquilo
                  instead: tratar a origem como somente leitura
                - action: corrigir valor malformado durante a leitura
                  reason: apaga o defeito antes da classificação
                  instead: preservar e deixar o juízo classificar
                - action: ler colunas por nome de cabeçalho
                  reason: cabeçalho com nome repetido faz perder a coluna em silêncio
                  instead: ler por posição declarada no contrato
              do_not_touch: [_raw]
              rollback: Remover o leitor e seus testes.
              observability: >-
                contagem de registros lidos por competência, defeitos
                observados por tipo, e segundos do início da leitura ao
                veredito (o limite de R-6, sem o qual tudo passa mesmo
                levando horas — objeção C7)
  - id: SEAM-AGREGACAO
    name: Agregação monetária
    description: Separa a soma exata da comparação contra a âncora.
    evidence: [E-ADR-ARREDONDAMENTO]
    responsibility: Somar valores monetários com aritmética exata declarada.
    consumes: [registros lidos]
    produces: [agregado da competência]
    owner: agregacao
    independent_proof: >-
      Ponto flutuante em campo monetário é recusado na entrada, e o mesmo
      dado arredondado meio-para-cima leva o juízo a um VEREDITO diferente
      — total diferente não basta, porque o juízo poderia re-arredondar e
      anular a diferença (objeção C5).
    decision_ids: [ADR-0001-HALF-EVEN, ADR-0004-ARREDONDA-NO-TOTAL]
    rejected_alternatives:
      - alternative: Usar ponto flutuante e arredondar no final
        reason: >-
          0.1 + 0.2 != 0.3 em binário; o centavo some sem nada acusar.
      - alternative: Arredondar cada campo na entrada
        reason: >-
          Cada arredondamento é uma perda e elas somam — 2,345 + 2,345 dá
          4,68 por campo contra 4,69 só no total, ambos meio-para-par.
    swimlane:
      id: LANE-AGREGACAO
      name: Agregação lane
      owner: agregacao
      legs:
        - id: LEG-AGREGADO-EXATO
          observable_state: O agregado é exato e recusa float
          proof: >-
            Float em campo monetário é recusado; HALF_EVEN e HALF_UP
            produzem totais diferentes no mesmo dado.
          requires: [registros lidos]
          produces: [agregado da competência]
          tasks:
            - id: T-20260917-agregacao-exata
              title: Somar valores monetários com meio-para-par
              goal: Tornar a regra de arredondamento explícita e verificável.
              done_condition: >-
                Float é recusado na entrada e o total usa meio-para-par a
                duas casas.
              effort: M
              profile: standard
              execution_backend: any
              required_tools: [git, bash, python3, pytest]
              depends_on: [T-20260917-leitura-competencia]
              touches_paths: []
              creates_paths:
                - src/fabrica/agregacao.py
                - tests/test_agregacao.py
              behavior:
                - id: B-1
                  given: um valor de ponto flutuante em campo monetário
                  when: o agregado é calculado
                  then: a entrada é recusada com erro explícito, e o agregado devolvido traz os CINCO controles nomeados que o juízo compara — count_linhas, sum_vl_liquido, min_vl_liquido, max_vl_liquido, linhas_invalidas
                - id: B-2
                  given: valores em empate exato, um contexto cujo default já é meio-para-par, um contexto com prec=6, e a alternativa de arredondar por campo
                  when: o total é calculado
                  then: precisão E modo são DECLARADOS, não herdados — com prec=6 a soma acusa a perda (10000.00 + 0.01 vira 10000.0, e quantizar depois não recupera, ADR 0006); trocar o default do contexto para meio-para-cima faz o teste falhar se a implementação o herdar; e arredondar por campo dá 4,68 contra 4,69 no total (ADR 0004)
              evals:
                - id: eval_1
                  description: Float recusado; o agregado traz os cinco controles nomeados
                  bash: pytest -q tests/test_agregacao.py -k "recusa_float or cinco_controles"
                  verifies: [B-1]
                - id: eval_2
                  description: Precisão e modo declarados; prec=6 acusa; granularidade do total
                  bash: pytest -q tests/test_agregacao.py -k "precisao_declarada or modo_explicito or granularidade"
                  verifies: [B-2]
                - id: eval_3
                  description: O total de 2026-03 reproduz a âncora medida
                  bash: pytest -q tests/test_agregacao.py -k total_ancora
                  verifies: [B-1, B-2]
              anti_patterns:
                - action: herdar o arredondamento padrão da linguagem
                  reason: defaults divergem e o erro fica estruturalmente verde
                  instead: declarar a regra no contrato e testá-la
                - action: converter float para decimal silenciosamente
                  reason: o centavo já se perdeu antes da conversão
                  instead: recusar float na entrada
                - action: arredondar a cada soma parcial
                  reason: o erro de arredondamento acumula linha a linha
                  instead: somar exato e arredondar uma vez no final
              do_not_touch: [cvg/docs/adrs]
              rollback: Remover o agregador e seus testes.
              observability: total agregado por competência
  - id: SEAM-JUIZO
    name: Juízo do agregado
    description: Separa a decisão de aceitar da produção do número.
    evidence: [E-ANCORA-202603]
    responsibility: Comparar agregado contra âncora e classificar toda diferença.
    consumes: [agregado da competência, contrato validado, defeitos observados]
    produces: [veredito classificado]
    owner: juizo
    independent_proof: >-
      Uma divergência de um centavo introduzida de propósito é recusada, e
      diferença não classificada bloqueia.
    decision_ids: [ADR-0001-HALF-EVEN, ADR-0002-ANCORA-2026-03]
    rejected_alternatives:
      - alternative: Aceitar diferença abaixo de um limite configurável
        reason: >-
          Tolerância configurável é como um centavo inexplicado vira um
          centavo aceito.
    swimlane:
      id: LANE-JUIZO
      name: Juízo lane
      owner: juizo
      legs:
        - id: LEG-JUIZO-ACUSA-CENTAVO
          observable_state: O juiz recusa um centavo de divergência
          proof: >-
            Teste que corrompe UMA LINHA do arquivo em um centavo e roda o
            pipeline de ponta a ponta exige recusa. Partir de um agregado já
            alterado não serve: passaria mesmo se a leitura descartasse a
            linha ou a agregação anulasse a diferença (objeção C6).
          requires: [agregado da competência, contrato validado, defeitos observados]
          produces: [veredito classificado]
          tasks:
            - id: T-20260917-juizo-classifica
              title: Comparar contra a âncora e classificar a diferença
              goal: Fazer o juiz acusar, não apenas aprovar.
              done_condition: >-
                Um centavo alterado é recusado, e diferença sem
                classificação bloqueia a publicação.
              effort: M
              profile: standard
              execution_backend: any
              required_tools: [git, bash, python3, pytest]
              depends_on: [T-20260917-agregacao-exata]
              touches_paths: []
              creates_paths:
                - src/fabrica/juizo.py
                - tests/test_juizo.py
              behavior:
                - id: B-1
                  given: o arquivo da competência com UMA LINHA corrompida, e um caso que redistribui valores mantendo soma e contagem
                  when: o pipeline roda de ponta a ponta e o juízo compara contra a âncora
                  then: os CINCO controles são comparados individualmente (count_linhas, sum_vl_liquido, min, max, linhas_invalidas) e qualquer divergência recusa — soma e contagem iguais não bastam
                - id: B-2
                  given: uma diferença de cada uma das seis classificações, incluindo um controle divergente classificado como CONFIRMED_SOURCE_DEFECT, e o mesmo dado agregado com meio-para-cima
                  when: o veredito é calculado
                  then: PRECEDÊNCIA — divergência em qualquer dos cinco controles RECUSA, mesmo classificada como CONFIRMED ou APPROVED; a classificação explica, nunca autoriza. Fora dos controles, MODERN_DEFECT, CONTRACT_AMBIGUITY e UNRESOLVED bloqueiam e as três CONFIRMED/APPROVED apenas registram. E o arredondamento errado muda o VEREDITO, não só o total
              evals:
                - id: eval_1
                  description: Um centavo na linha recusa; extremos alterados com soma igual também
                  bash: pytest -q tests/test_juizo.py -k "um_centavo_na_linha or cinco_controles"
                  verifies: [B-1]
                - id: eval_2
                  description: Cada uma das seis decide publicar ou bloquear; arredondamento muda o veredito
                  bash: pytest -q tests/test_juizo.py -k "politica_por_classificacao or arredondamento_muda_veredito"
                  verifies: [B-2]
                - id: eval_3
                  description: As seis são exaustivas e exclusivas
                  bash: pytest -q tests/test_juizo.py -k classificacoes
                  verifies: [B-1, B-2]
              anti_patterns:
                - action: introduzir parâmetro de tolerância
                  reason: um centavo inexplicado viraria um centavo aceito
                  instead: classificar a diferença ou consertar o pipeline
                - action: editar a âncora para o veredito passar
                  reason: falsifica a prova em vez de investigar
                  instead: investigar; âncora revista exige nova aprovação
                - action: classificar como UNRESOLVED para destravar
                  reason: UNRESOLVED bloqueia; usá-lo como atalho esconde a causa
                  instead: medir a diferença e atribuir a classificação certa
              do_not_touch: [cvg/docs/adrs, contracts]
              rollback: Remover o juízo e seus testes.
              observability: vereditos por classificação
  - id: SEAM-EVIDENCIA
    name: Pacote de evidência
    description: Separa o registro da prova da decisão que a produziu.
    evidence: [E-ANCORA-202603]
    responsibility: Gravar o veredito e os números de forma reconstruível.
    consumes: [veredito classificado]
    produces: [pacote de evidência]
    owner: evidencia
    independent_proof: >-
      O veredito é reconstruído a partir do pacote sem reexecutar o
      pipeline, e ACEITO_SEM_ANCORA nunca aparece como ACEITO.
    decision_ids: [ADR-0002-ANCORA-2026-03]
    rejected_alternatives:
      - alternative: Registrar apenas o veredito final
        reason: >-
          Sem os números, ninguém consegue responder meses depois por que
          aquele número foi aceito.
    swimlane:
      id: LANE-EVIDENCIA
      name: Evidência lane
      owner: evidencia
      legs:
        - id: LEG-EVIDENCIA-RECONSTROI
          observable_state: O pacote reconstrói o veredito sem reexecutar
          proof: >-
            Ler o pacote reproduz o mesmo veredito; ACEITO_SEM_ANCORA é
            distinguível de ACEITO no arquivo.
          requires: [veredito classificado]
          produces: [pacote de evidência]
          tasks:
            - id: T-20260917-evidencia-packet
              title: Gravar o pacote de evidência por execução
              goal: Tornar o veredito auditável sem reexecutar o pipeline.
              done_condition: >-
                O pacote contém veredito, âncora, agregado e classificações,
                e distingue ACEITO de ACEITO_SEM_ANCORA.
              effort: S
              profile: standard
              execution_backend: any
              required_tools: [git, bash, python3, pytest]
              depends_on: [T-20260917-juizo-classifica]
              touches_paths: []
              creates_paths:
                - src/fabrica/evidencia.py
                - tests/test_evidencia.py
              behavior:
                - id: B-1
                  given: uma execução com âncora medida, e uma que terminou antes da leitura (sem agregado nem classificações)
                  when: o pacote é lido de volta
                  then: o veredito é reconstruído sem reexecutar; campos que não existiam no caminho percorrido são AUSENTES e assim marcados, nunca preenchidos com zero ou valor artificial
                - id: B-2
                  given: qualquer um dos quatro vereditos terminais — ACEITO, ACEITO_SEM_ANCORA, RECUSADO ou ERRO
                  when: o pacote é gravado
                  then: o pacote registra o VEREDITO e, separadamente, a CAUSA — NAO_MEDIDO por exemplo — conforme ADR 0005; a recusa com âncora grava como RECUSADO, e NAO_MEDIDO nunca aparece no campo veredito
              evals:
                - id: eval_1
                  description: O pacote reconstrói o veredito
                  bash: pytest -q tests/test_evidencia.py -k reconstroi
                  verifies: [B-1]
                - id: eval_2
                  description: Sem âncora nunca vira ACEITO
                  bash: pytest -q tests/test_evidencia.py -k sem_ancora
                  verifies: [B-2]
                - id: eval_3
                  description: O pacote registra âncora, agregado e classificações
                  bash: pytest -q tests/test_evidencia.py -k campos_obrigatorios
                  verifies: [B-1, B-2]
              anti_patterns:
                - action: gravar ACEITO com gate de âncora falso dentro
                  reason: foi a objeção 28 — 82 milhões de linhas sem conferência
                  instead: publicar ACEITO_SEM_ANCORA de forma visível
                - action: editar um pacote antigo para corrigir o histórico
                  reason: falsifica evidência
                  instead: gravar evidência nova e manter a antiga
                - action: gravar só o veredito, sem os números
                  reason: ninguém consegue reconstruir por que aquilo foi aceito
                  instead: registrar âncora, agregado e cada classificação
              do_not_touch: [evidence]
              rollback: Remover o gravador de evidência e seus testes.
              observability: pacotes gravados por competência
  - id: SEAM-ORQUESTRACAO
    name: Orquestração da execução
    description: >-
      Separa quem decide o desfecho de quem produz cada parte. Nenhuma das
      cinco costuras possuía o fluxo, e a lacuna migrava de vizinho em
      vizinho a cada correção (objeções C11, C14, C16, C17, C19).
    evidence: [E-ANCORA-202603]
    responsibility: >-
      Encadear as etapas, decidir o veredito terminal e o código de saída, e
      garantir que TODO caminho termina com pacote gravado.
    consumes: [contrato validado, veredito classificado, pacote de evidência]
    produces: [desfecho da execução]
    owner: orquestracao
    independent_proof: >-
      Os quatro desfechos terminam com pacote e código de saída distintos, e
      a execução completa cabe em 600 segundos — a etapa rápida com o resto
      lento não passa.
    decision_ids: [ADR-0005-VEREDITO-SEM-ANCORA]
    rejected_alternatives:
      - alternative: Deixar cada etapa encerrar o processo por conta própria
        reason: >-
          Foi o que se tentou: o contrato saía com exit 1 antes da leitura, e
          o pacote prometido pela evidência nunca era gravado. Encerrar é
          decisão de fluxo, não de etapa.
    swimlane:
      id: LANE-ORQUESTRACAO
      name: Orquestração lane
      owner: orquestracao
      legs:
        - id: LEG-DESFECHO-SEMPRE-COM-PACOTE
          observable_state: Todo caminho termina com pacote e código de saída
          proof: >-
            Os quatro desfechos (ACEITO, ACEITO_SEM_ANCORA, RECUSADO, ERRO)
            gravam pacote e saem com código distinto; o tempo é medido da
            leitura ao veredito, não por etapa.
          requires: [contrato validado, veredito classificado, pacote de evidência]
          produces: [desfecho da execução]
          tasks:
            - id: T-20260917-orquestra-desfecho
              title: Decidir o desfecho e garantir o pacote em todo caminho
              goal: >-
                Dar dono ao fluxo — sem ele a lacuna migra de costura em
                costura.
              done_condition: >-
                Os quatro desfechos gravam pacote e saem com código próprio;
                a execução completa é medida contra os 600s de R-6.
              effort: M
              profile: standard
              execution_backend: any
              required_tools: [git, bash, python3, pytest]
              depends_on: [T-20260917-evidencia-packet]
              touches_paths: []
              creates_paths:
                - src/fabrica/orquestracao.py
                - tests/test_orquestracao.py
              behavior:
                - id: B-1
                  given: execução sem âncora, execução ancorada que bate, e execução ancorada com divergência bloqueante
                  when: a orquestração decide o desfecho
                  then: as três gravam pacote — ACEITO_SEM_ANCORA com causa NAO_MEDIDO, ACEITO, e RECUSADO — com códigos de saída distintos, e só ACEITO autoriza publicar
                - id: B-2
                  given: uma exceção REAL levantada dentro da leitura, e um caso em que a leitura cabe no limite mas o resto estoura
                  when: a orquestração conduz a execução
                  then: a exceção vira desfecho ERRO com pacote gravado — não escapa encerrando o processo; e R-6 reprova acima de 600s no TOTAL, etapa rápida com o resto lento não passa. Falha do próprio gravador é o único caso sem pacote, e sai com código distinto
              evals:
                - id: eval_1
                  description: Os quatro desfechos gravam pacote com código de saída próprio
                  bash: pytest -q tests/test_orquestracao.py -k desfechos
                  verifies: [B-1]
                - id: eval_2
                  description: Exceção real vira ERRO com pacote; R-6 mede o total, não a etapa
                  bash: pytest -q tests/test_orquestracao.py -k "excecao_vira_erro or tempo_total"
                  verifies: [B-2]
                - id: eval_3
                  description: Só ACEITO autoriza publicar
                  bash: pytest -q tests/test_orquestracao.py -k autoriza_publicar
                  verifies: [B-1, B-2]
              anti_patterns:
                - action: encerrar o processo dentro de uma etapa
                  reason: o pacote prometido nunca é gravado
                  instead: retornar o veredito e deixar a orquestração decidir
                - action: medir o tempo por etapa
                  reason: leitura em 530s mais o resto em 120s viola R-6 e passa
                  instead: medir do início da leitura ao veredito
                - action: tratar ACEITO_SEM_ANCORA como autorização
                  reason: a palavra aceito nomeia o término, não a prova
                  instead: só ACEITO autoriza, e só com os cinco controles conferidos
              do_not_touch: [cvg/docs/adrs]
              rollback: Remover a orquestração e seus testes.
              observability: desfechos por tipo e segundos da leitura ao veredito
steel_thread:
  - LEG-CONTRATO-RECUSA-SEM-ANCORA
  - LEG-LEITURA-NAO-ALTERA-FONTE
  - LEG-AGREGADO-EXATO
  - LEG-JUIZO-ACUSA-CENTAVO
  - LEG-EVIDENCIA-RECONSTROI
  - LEG-DESFECHO-SEMPRE-COM-PACOTE
objections:
  - id: OBJ-C1
    status: FIXED
    summary: >-
      O pacote entregue continha índices, mas não os planos dos legs — o
      adversário revisava cabeçalhos sem o conteúdo a implementar.
    owner: Bruno Nunes
    rationale: >-
      A ponte passou a projetar os LEG-*.md ao lado de cada _lane.md. O
      dispatcher, que varre <dir>/*/*.md, passou de 5 para 10 arquivos.
  - id: OBJ-C2
    status: FIXED
    summary: >-
      A evidência prometia gravar ACEITO_SEM_ANCORA, mas o contrato
      encerrava com NAO_MEDIDO antes de qualquer leitura, sem transferir
      esse resultado.
    owner: Bruno Nunes
    rationale: >-
      O contrato passou a produzir 'veredito NAO_MEDIDO' como saída
      declarada, e a evidência a consumi-lo. B-4 exige que ele alcance a
      evidência antes do exit.
  - id: OBJ-C3
    status: FIXED
    summary: >-
      Presença de cinco números era tratada como prova de âncora medida,
      sem exigir aprovador nem data.
    owner: Bruno Nunes
    rationale: >-
      B-1 passou a exigir os cinco números NOMEADOS mais a procedência, e
      B-3 recusa (NAO_MEDIDO) uma âncora numericamente completa sem
      aprovador ou data de medição.
  - id: OBJ-C4
    status: FIXED
    summary: >-
      O defeito preservado na leitura desaparecia ao virar agregado — o
      juízo não recebia o que precisava para classificá-lo.
    owner: Bruno Nunes
    rationale: >-
      'defeitos observados' virou saída da leitura, atravessa a agregação e
      é consumido pelo juízo. B-3 exige identidade do registro, valor
      original e posição.
  - id: OBJ-C5
    status: FIXED
    summary: >-
      A prova de arredondamento verificava apenas total diferente; R-3
      exige veredito diferente.
    owner: Bruno Nunes
    rationale: >-
      B-3 do juízo passou a exigir que meio-para-cima leve a VEREDITO
      diferente. Total diferente não basta: o juízo poderia re-arredondar e
      anular a divergência.
  - id: OBJ-C6
    status: FIXED
    summary: >-
      A prova de um centavo partia de um agregado já alterado, não de uma
      linha corrompida como R-5 exige.
    owner: Bruno Nunes
    rationale: >-
      B-1 passou a corromper UMA LINHA do arquivo e rodar o pipeline ponta
      a ponta. O teste anterior passaria mesmo se a leitura descartasse a
      linha.
  - id: OBJ-C30
    status: FIXED
    summary: >-
      A classificação podia sobrepor a recusa obrigatória dos cinco
      controles — um total divergente marcado CONFIRMED autorizaria.
    owner: Bruno Nunes
    rationale: >-
      B-2 do juízo declara a PRECEDÊNCIA: divergência em qualquer controle
      recusa, mesmo classificada. A classificação explica, nunca autoriza.
  - id: OBJ-C31
    status: FIXED
    summary: >-
      Modo explícito não garantia soma exata — a precisão do contexto
      decide antes.
    owner: Bruno Nunes
    rationale: >-
      ADR 0006 (novo). Verificado: em prec=6, 10000.00 + 0.01 vira 10000.0,
      e quantizar depois devolve 10000.00, não 10000.01. A perda é anterior
      ao arredondamento. Um teste força prec=6 e exige que a soma acuse.
  - id: OBJ-C32
    status: FIXED
    summary: >-
      O pacote exigia campos que não existem nos términos antecipados —
      o gravador rejeitaria o próprio caso que deve registrar.
    owner: Bruno Nunes
    rationale: >-
      B-1 da evidência passou a exigir que campos não percorridos sejam
      AUSENTES e marcados como tal, nunca preenchidos com zero ou valor
      artificial que comprometeria a reconstrução.
  - id: OBJ-C33
    status: FIXED
    summary: >-
      ERRO não tinha cenário de falha real — testar a enumeração não prova
      que exceções chegam ao finalizador.
    owner: Bruno Nunes
    rationale: >-
      B-2 da orquestração passou a exigir uma exceção REAL dentro da
      leitura, que deve virar ERRO com pacote. Falha do próprio gravador é
      o único caso sem pacote, e sai com código distinto.
  - id: OBJ-C34
    status: FIXED
    summary: >-
      Registro monetário malformado não tinha participação definida nos
      cinco controles.
    owner: Bruno Nunes
    rationale: >-
      B-2 da leitura declara: entra em linhas_invalidas e NÃO entra em
      sum/min/max.
  - id: OBJ-C35
    status: FIXED
    summary: >-
      Os nomes dos extremos divergiam entre contrato e agregado.
    owner: Bruno Nunes
    rationale: >-
      B-1 do contrato passou a exigir os cinco controles sob os MESMOS
      nomes que o agregado usa.
  - id: OBJ-C14
    status: FIXED
    summary: >-
      O encerramento sem âncora foi delegado a um "orquestrador" que nenhuma
      das cinco tarefas assumia.
    owner: Bruno Nunes
    rationale: >-
      Criada a sexta costura, SEAM-ORQUESTRACAO, com tarefa própria. Ela
      possui o fluxo: decide o desfecho, o código de saída, e garante o
      pacote em todo caminho.
  - id: OBJ-C15
    status: FIXED
    summary: >-
      O juízo exigia cinco controles que o produtor não prometia entregar —
      não havia schema de saída.
    owner: Bruno Nunes
    rationale: >-
      B-1 da agregação passou a exigir os cinco controles NOMEADOS no
      agregado devolvido.
  - id: OBJ-C16
    status: FIXED
    summary: >-
      Os três vereditos enumerados excluíam a recusa com âncora — justamente
      quando o juiz acusa.
    owner: Bruno Nunes
    rationale: >-
      São quatro terminais (ADR 0005): ACEITO, ACEITO_SEM_ANCORA, RECUSADO e
      ERRO. A recusa com âncora grava como RECUSADO.
  - id: OBJ-C17
    status: FIXED
    summary: >-
      O teste de R-6 media só a leitura: 530s de leitura mais 120s do resto
      passaria e violaria o requisito.
    owner: Bruno Nunes
    rationale: >-
      A medição saiu da leitura (que agora só reporta sua duração) e foi
      para a orquestração, que mede do início ao veredito contra os 600s.
  - id: OBJ-C18
    status: FIXED
    summary: >-
      Exclusividade das classificações não provava bloqueio de MODERN_DEFECT
      nem CONTRACT_AMBIGUITY.
    owner: Bruno Nunes
    rationale: >-
      B-2 do juízo passou a exigir a política de cada uma das seis: três
      bloqueiam, três registram sem bloquear.
  - id: OBJ-C19
    status: FIXED
    summary: >-
      O veredito público sem âncora divergia de R-1 — NAO_MEDIDO e
      ACEITO_SEM_ANCORA sem relação declarada.
    owner: Bruno Nunes
    rationale: >-
      ADR 0005 resolve: ACEITO_SEM_ANCORA é o veredito, NAO_MEDIDO é a
      causa. Camadas, não alternativas.
  - id: OBJ-C8
    status: FIXED
    summary: >-
      A execução sem âncora tinha dois vereditos incompatíveis — o contrato
      mandava NAO_MEDIDO, a evidência esperava ACEITO_SEM_ANCORA.
    owner: Bruno Nunes
    rationale: >-
      A evidência passou a gravar QUALQUER veredito terminal dos três,
      registrando qual foi, com os campos que existirem. NAO_MEDIDO grava
      sem agregado e nunca aparece como ACEITO.
  - id: OBJ-C9
    status: FIXED
    summary: >-
      O juízo não provava comparação dos cinco controles do ADR 0002 —
      redistribuir valores mantendo soma e contagem alterava extremos sem
      recusa.
    owner: Bruno Nunes
    rationale: >-
      B-1 passou a exigir comparação individual dos cinco, com um caso que
      mantém soma e contagem e ainda assim deve recusar.
  - id: OBJ-C10
    status: FIXED
    summary: >-
      O leitor consumia posições que o contrato não prometia fornecer;
      contagem certa e hash inalterado não provam que a coluna certa foi
      lida.
    owner: Bruno Nunes
    rationale: >-
      O layout de leitura (posições, formato monetário, chave) virou parte
      do contrato, e sua ausência resulta em NAO_MEDIDO. B-1 da leitura
      exige leitura posicional mesmo com cabeçalho repetido.
  - id: OBJ-C11
    status: FIXED
    summary: >-
      Ciclo de construção: a primeira folha precisava provar gravação de
      evidência, mas o gravador é a última tarefa.
    owner: Bruno Nunes
    rationale: >-
      Defeito introduzido pela correção de C2. Separadas as
      responsabilidades: o contrato RETORNA o veredito como valor, sem
      gravar nem encerrar; quem persiste é a evidência. O eval de tempo da
      leitura passou a medir só a leitura, não até o veredito.
  - id: OBJ-C12
    status: FIXED
    summary: >-
      A granularidade do arredondamento não estava reconciliada: 2,345 +
      2,345 dá 4,68 por campo e 4,69 só no total, ambos HALF_EVEN.
    owner: Bruno Nunes
    rationale: >-
      Registrado no ADR 0004 — arredonda uma vez, sobre o total final, e a
      mesma granularidade vale para a medição da âncora. Contra-exemplo
      verificado; com três valores o desvio dobra.
  - id: OBJ-C13
    status: FIXED
    summary: >-
      Comparar meio-para-par com meio-para-cima não detectava herança do
      default — um contexto já configurado passaria, violando R-3.
    owner: Bruno Nunes
    rationale: >-
      B-2 da agregação passou a exigir modo EXPLÍCITO, com um teste que
      troca o default do contexto e falha se a implementação o herdar.
  - id: OBJ-C7
    status: FIXED
    summary: >-
      R-6 (10 minutos) não tinha prova nem responsável — tudo passaria com
      a competência levando horas.
    owner: Bruno Nunes
    rationale: >-
      B-4 da leitura mede do início ao veredito e reprova acima de 600s. O
      tempo entrou na observabilidade da lane.
contentions: []
