          - B-1
          - B-2
        - id: eval_3
          description: Recusas
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in sha256_divergente_nao_grava arquivo_ausente_nao_medido arquivo_fora_da_lista_recusa; do python3 -m pytest --collect-only -q tests/test_landing_referencia.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_landing_referencia.py -k "sha256_divergente_nao_grava or arquivo_ausente_nao_medido or arquivo_fora_da_lista_recusa"'
          verifies:
          - B-2
