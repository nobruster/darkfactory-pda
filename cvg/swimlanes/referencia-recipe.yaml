          - B-1
        - id: eval_2
          description: Idempotente e sem sobrescrever
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in segunda_execucao_integro_sem_regravar objeto_divergente_nao_sobrescreve; do python3 -m pytest --collect-only -q tests/test_landing_referencia.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_landing_referencia.py -k "segunda_execucao_integro_sem_regravar or objeto_divergente_nao_sobrescreve"'
