          verifies:
          - B-2
        - id: eval_3
          description: A procedência e o resto da Bronze iguais
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in manifesto_confere_objetos_listados procedencia_confere_tira_a_marca classificacao_das_seis; do python3 -m pytest --collect-only -q tests/test_bronze.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_bronze.py -k "manifesto_confere_objetos_listados or procedencia_confere_tira_a_marca or classificacao_das_seis"'
