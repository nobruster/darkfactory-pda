  description: Separa agregar para o negócio de reler o bruto.
  evidence:
  - E-ANCORA-202601
  responsibility: Publicar a Gold principal a partir da versão da Silver, seguindo a linhagem até o pacote ACEITO da ingestão, sem ler a landing nem o CSV.
