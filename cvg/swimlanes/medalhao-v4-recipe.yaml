schema_version: 1
intent:
  id: DI-PDA-MEDALHAO-V4
  title: Medalhão v4 — juízo na ingestão, Gold lê a Silver, Gold por assuntos
  summary: O arquivo bruto é lido UMA vez, na ingestão, onde o juízo com o segundo motor aceita a Bronze; Silver e Gold consomem só a camada anterior persistida; a Gold entrega tabelas por assunto; e o preparo é apagado depois da publicação conferida.
  claim: proposed
  source:
    uri: cvg/docs/tech-spec/tech-spec-pda-beneficios.md
    captured_at: '2026-09-21T00:00:00Z'
    sha256: e619ead9d343282533110bc8cb8f1203614d8e733565b21e3157df2b8f157b88
  success:
  - A Gold principal publica sem ler a landing nem o CSV.
  - A Bronze só publica com o pacote ACEITO do juízo da ingestão.
  - fat_especie e kpis_nacionais fecham exato com a âncora.
  - Nenhum _preparo sobrevive a uma publicação conferida, e nada fora dele é apagado.
  out_of_scope:
  - 'fat_uf, fat_banco e perfil demográfico: exigem a landing v2 com as 14 colunas (Fase 2).'
  - 'Alterar o orquestrador ou o juiz selados: eles são REUSADOS na ingestão, não modificados.'
system_map:
  claim: proposed
  components:
  - Ingestão julgada
  - Gold principal
  - Contrato com grupos
  - Gold por assuntos
  - Limpeza do preparo
  external_dependencies:
  - Silver publicada em s3a://silver/pda/beneficios-emitidos
  - Gold principal publicada em s3a://gold/pda/beneficios-emitidos
  - grupos_especie aprovado no contrato
  unknowns: []
evidence:
- id: E-ANCORA-202601
  claim: external
  source:
    uri: cvg/docs/adrs/0001-the-2026-01-anchor-is-41572553-rows-summing-78521752562-12.md
    captured_at: '2026-09-21T00:00:00Z'
    sha256: 0505a743963abfb09a257373a431c3878b25cf6c19d71467c722da9830779acd
  confidence: 1.0
  summary: 'Competência 2026-01 medida na origem: 41572553 linhas, soma 78521752562.12.'
decisions:
- id: ADR-0003-HALF-EVEN
  status: accepted
  owner: Bruno Nunes
  rationale: Dinheiro arredonda meio-para-par, 2 casas; meio-para-cima vira tendência em volume.
- id: DEC-GOLD-POR-ASSUNTOS
  status: accepted
  owner: Bruno Nunes
  rationale: 'Decidido pelo dono em 2026-09-23: a Gold entrega tabelas por assunto em duas fases; a Fase 1 são fat_especie e kpis_nacionais, que as colunas da landing atual permitem. Grupos de espécie por texto, aprovados no contrato; mediana e P90 aproximados e rotulados; somas e contagens exatas.'
- id: DEC-JUIZO-NA-INGESTAO
  status: accepted
  owner: Bruno Nunes
  rationale: 'Decidido pelo dono em 2026-09-23: a Gold não recebe o arquivo inteiro. Medido: a Gold principal recalculava Bronze e Silver da landing e o juiz lia as 41,5 M linhas do CSV — cerca de 20 dos 22 minutos — sem ler a Silver publicada. O ADR 0006 (Spark grava, Python confere) continua valendo; o que muda é ONDE o juízo acontece: na ingestão, uma vez, onde o bruto é legitimamente lido. As camadas seguintes reconciliam exato contra a anterior e seguem a linhagem até o pacote ACEITO da ingestão.'
- id: DEC-PREPARO-APAGADO-APOS-CONFERIR
  status: accepted
  owner: Bruno Nunes
  rationale: 'Decidido pelo dono em 2026-09-23: o _preparo de uma execução é apagado depois que a publicação é relida e conferida. O histórico Delta da tabela publicada é a evidência; o preparo somava 646 MiB e crescia cerca de 650 MiB por execução.'
seams:
- id: SEAM-JUIZO-NA-INGESTAO
  name: Ingestão julgada — o bruto lido uma vez, pelos dois motores
  description: Separa ler o arquivo bruto de consumir as camadas que dele derivam.
  evidence:
  - E-ANCORA-202601
  responsibility: Julgar a Bronze contra o CSV pelo segundo motor na ingestão e só publicá-la com o pacote ACEITO, registrando esse pacote no commit.
  consumes:
  - procedencia vinculada
  produces:
  - bronze julgada
  owner: medalhao
  independent_proof: Sobre o dado real, conduzir devolve ACEITO na ingestão e o commit da Bronze nomeia o caminho e o sha256 do pacote.
  decision_ids:
  - DEC-JUIZO-NA-INGESTAO
  rejected_alternatives:
  - alternative: Manter o juízo no portão da Gold
    reason: Obriga a Gold a ler o arquivo inteiro, contra o medalhão.
  swimlane:
    id: LANE-JUIZO-NA-INGESTAO
    name: Ingestão julgada lane
    owner: medalhao
    legs:
    - id: LEG-JUIZO-NA-INGESTAO
      observable_state: A Bronze publicada carrega o pacote ACEITO da ingestão
      proof: Sem ACEITO, a Bronze não publica; com ACEITO, o commit nomeia o pacote.
      requires: []
      produces:
      - bronze julgada
      tasks:
      - id: T-20260923-ingestao-julgada
        title: Julgar a ingestão com o segundo motor e publicar a Bronze só com ACEITO
        goal: Ler o arquivo bruto uma vez, na ingestão, com os dois motores.
        done_condition: Sobre uma landing vinculada, conduzir julga a Bronze contra o CSV; só com autorizado_publicar a Bronze publica, e o commit nomeia o pacote; sem autorização, nada é publicado.
        effort: M
        profile: standard
        execution_backend: any
        required_tools: &id001
        - git
        - bash
        - python3
        - pytest
        - docker
        depends_on: []
        touches_paths:
        - src/medalhao/bronze.py
        creates_paths:
        - src/medalhao/ingestao.py
        - tests/test_ingestao.py
        behavior:
        - id: B-1
          given: a landing vinculada ao CSV, o contrato e o CSV original em _raw/
          when: a ingestão roda para a competência
          then: chama orquestracao.conduzir com um executar_leitura que mede a Bronze no motor Spark SEM gravar e lê o CSV pelo segundo motor, o leitor posicional em Python já selado, montando InsumosExecucao; só com Desfecho.autorizado_publicar a Bronze publica pelo protocolo que já existe — preparo, replaceWhere, reconferência —, e o userMetadata do commit nomeia o caminho_pacote e o sha256 do pacote do juízo. O orquestrador e o juiz selados são reusados, nunca alterados.
        - id: B-2
          given: um juízo que não autoriza — RECUSADO, ERRO ou ACEITO_SEM_ANCORA
          when: a ingestão termina
          then: a Bronze não publica nada, o pacote do juízo fica gravado como evidência com o motivo, e a ingestão devolve o veredito do orquestrador sem traduzi-lo; nenhum teste já existente de tests/test_bronze.py é editado.
        evals:
        - id: eval_1
          description: O juízo acontece na ingestão, com os dois motores
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in julga_na_ingestao_com_segundo_motor publica_bronze_so_com_aceito commit_da_bronze_nomeia_o_pacote; do python3 -m pytest --collect-only -q tests/test_ingestao.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_ingestao.py -k "julga_na_ingestao_com_segundo_motor or publica_bronze_so_com_aceito or commit_da_bronze_nomeia_o_pacote"'
          verifies:
          - B-1
        - id: eval_2
          description: Sem autorização, nada publica
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in recusado_nao_publica erro_nao_publica pacote_fica_como_evidencia; do python3 -m pytest --collect-only -q tests/test_ingestao.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_ingestao.py -k "recusado_nao_publica or erro_nao_publica or pacote_fica_como_evidencia"'
          verifies:
          - B-2
        - id: eval_3
          description: Orquestrador reusado, não alterado
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in reusa_conduzir_selado reusa_leitor_posicional; do python3 -m pytest --collect-only -q tests/test_ingestao.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_ingestao.py -k "reusa_conduzir_selado or reusa_leitor_posicional"'
          verifies:
          - B-1
        anti_patterns:
        - action: reimplementar o juiz ou o orquestrador dentro da ingestão
          reason: são selados; uma segunda versão pode divergir em silêncio
          instead: chamar orquestracao.conduzir
        - action: ler o CSV pelo Spark no lugar do leitor Python
          reason: dois motores iguais não se conferem (ADR 0006)
          instead: usar o leitor posicional já selado
        - action: publicar a Bronze antes do veredito
          reason: publicação sem juízo é o que o portão existe para impedir
          instead: publicar só com autorizado_publicar
        do_not_touch:
        - _raw
        - cvg/docs/adrs
        - contracts
        - src/pda
        rollback: Reverter src/medalhao/bronze.py; remover ingestao.py e seu teste.
        observability: competências com Bronze publicada sem pacote no commit
- id: SEAM-GOLD-LE-SILVER
