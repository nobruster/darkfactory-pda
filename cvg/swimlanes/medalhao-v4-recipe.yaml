          given: a Silver publicada com estado INTEGRO, a Gold principal da competência publicada, e grupos_especie no Contrato
          when: a Gold por assuntos roda para a competência
          then: 'resolve UMA vez a versão da Silver e lê com versionAsOf; num único groupBy por especie_codigo monta fat_especie — grão (especie_codigo, competencia), com descrição, grupo_especie do mapa, qtd_beneficios, vl_total em soma EXATA no DecimalType declarado, vl_minimo, vl_maximo, qtd_vl_zero, vl_medio arredondado meio-para-par com bround, vl_mediano_aprox e vl_p90_aprox — nomes que dizem que são aproximados — com a precisão do percentil declarada, rank_no_grupo e percentuais nacionais —; kpis_nacionais sai SOMANDO fat_especie, grão competência, uma linha, e só os percentis nacionais exigem outra passada. Antes de publicar, confere EXATO: soma de qtd_beneficios igual a count_linhas da âncora, soma de vl_total igual a sum_vl_liquido, kpis_nacionais com os mesmos totais, 65 códigos, cada um em um grupo. Grava em preparo e publica com replaceWhere na competência em s3a://gold/pda/assuntos/fat_especie e s3a://gold/pda/assuntos/kpis_nacionais, DecimalType do contrato, ansi.enabled=true, CHECK >= 0 nas colunas monetárias, imposição de schema ligada e evolução só aditiva com mergeSchema — nunca overwriteSchema —, e o userMetadata do commit nomeia a versão da Silver e a da Gold principal lidas.'
        - id: B-2
          given: uma competência sem Gold principal publicada, sem grupos_especie, com código fora do mapa, ou cujas somas não fecham
          when: a Gold por assuntos roda
          then: sem Gold principal publicada ou sem grupos_especie devolve NAO_MEDIDO; código fora do mapa ou soma que não fecha devolve DIVERGE nomeando a diferença; em nenhum dos casos publica nada, e nenhuma tolerância é aceita — a igualdade é exata, porque tolerância aqui seria afrouxar o oráculo.
        evals:
        - id: eval_1
          description: Grão, colunas e fechamento exato
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in fat_especie_fecha_com_a_ancora kpis_somam_fat_especie medio_arredonda_meio_para_par percentis_rotulados_aprox le_silver_por_versao; do python3 -m pytest --collect-only -q tests/test_gold_assuntos.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_gold_assuntos.py -k "fat_especie_fecha_com_a_ancora or kpis_somam_fat_especie or medio_arredonda_meio_para_par or percentis_rotulados_aprox or le_silver_por_versao"'
          verifies:
          - B-1
        - id: eval_2
          description: Delta com a doutrina
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in publica_com_replacewhere check_nao_negativo_monetario commit_nomeia_versoes_lidas; do python3 -m pytest --collect-only -q tests/test_gold_assuntos.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_gold_assuntos.py -k "publica_com_replacewhere or check_nao_negativo_monetario or commit_nomeia_versoes_lidas"'
          verifies:
          - B-1
        - id: eval_3
          description: Nada publica sem pré-condição
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in sem_gold_principal_nao_medido sem_grupos_nao_medido codigo_fora_do_mapa_diverge soma_que_nao_fecha_diverge; do python3 -m pytest --collect-only -q tests/test_gold_assuntos.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_gold_assuntos.py -k "sem_gold_principal_nao_medido or sem_grupos_nao_medido or codigo_fora_do_mapa_diverge or soma_que_nao_fecha_diverge"'
          verifies:
          - B-2
        anti_patterns:
        - action: validar com tolerância (< 10 linhas, ~100%)
          reason: tolerância afrouxa o oráculo e esconde centavo sumido
          instead: igualdade exata contra a âncora
        - action: usar overwriteSchema ou round (meio-para-cima)
          reason: apaga schema em silêncio; arredonda contra o ADR
          instead: mergeSchema só aditivo; bround meio-para-par
        - action: comparar especie_codigo com inteiros
          reason: '''01'' não casa com 1 e tudo cai fora do grupo em silêncio'
          instead: usar os códigos texto do grupos_especie
        do_not_touch:
        - _raw
        - cvg/docs/adrs
        - contracts
        - src/medalhao/gold.py
        rollback: Remover as duas tabelas por assunto; Silver e Gold principal não são tocadas.
        observability: competências publicadas na Gold principal sem tabelas por assunto
- id: SEAM-LIMPA-PREPARO
  name: Limpeza do preparo — só depois da publicação conferida
  description: Separa o estágio privado da evidência que fica.
  evidence:
  - E-ANCORA-202601
  responsibility: Apagar o _preparo de uma execução só quando a tabela publicada tem o commit dessa execução, e nunca nada fora do prefixo do preparo dela.
  consumes:
  - gold principal publicada
  produces:
  - preparo limpo
  owner: medalhao
  independent_proof: Com a publicação real conferida, o preparo da execução some e as tabelas publicadas ficam com o mesmo tamanho e a mesma soma.
  decision_ids:
  - DEC-PREPARO-APAGADO-APOS-CONFERIR
  rejected_alternatives:
  - alternative: Apagar todo o _preparo de uma vez
    reason: Apagaria o estágio de uma execução ainda em curso.
  swimlane:
    id: LANE-LIMPA-PREPARO
    name: Limpeza do preparo lane
    owner: medalhao
    legs:
    - id: LEG-LIMPA-PREPARO
      observable_state: Nenhum preparo de execução publicada e conferida sobrevive
      proof: Só apaga com o commit da execução no histórico; nunca fora do prefixo dela.
      requires:
      - gold principal publicada
      produces:
      - preparo limpo
      tasks:
      - id: T-20260923-limpa-preparo
        title: Apagar o preparo de execuções publicadas e conferidas
        goal: Não deixar o estágio privado ocupar o armazenamento.
        done_condition: Para cada camada, o preparo de uma execução é apagado só se o histórico da tabela publicada tem o commit daquela execução; qualquer outro caso preserva o preparo e diz por quê.
        effort: S
        profile: standard
        execution_backend: any
        required_tools: *id001
        depends_on:
        - T-20260923-gold-le-silver
        touches_paths: []
        creates_paths:
        - src/medalhao/limpeza.py
        - tests/test_limpeza.py
        behavior:
        - id: B-1
          given: o preparo de uma execução cujo commit está no histórico da tabela publicada
          when: a limpeza roda para a camada e a execução
          then: confere o commit pelo id da execução no userMetadata, apaga SÓ o prefixo <camada>/_preparo/.../execucao=<id> — um caminho montado de partes validadas, recusado se vier vazio ou fora de _preparo —, e confere depois que a tabela publicada mantém a mesma versão, a mesma contagem e a mesma soma.
        - id: B-2
          given: uma execução sem commit no histórico, um id vazio ou um caminho fora do preparo
          when: a limpeza roda
          then: 'não apaga nada e devolve o motivo: execução não publicada preserva o preparo; id vazio ou caminho fora de _preparo é RECUSADO antes de qualquer remoção, porque um prefixo vazio já montou uma vez o caminho do bucket inteiro.'
        evals:
        - id: eval_1
          description: Apaga só o preparo conferido
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in apaga_preparo_de_execucao_publicada publicada_intacta_depois; do python3 -m pytest --collect-only -q tests/test_limpeza.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_limpeza.py -k "apaga_preparo_de_execucao_publicada or publicada_intacta_depois"'
          verifies:
          - B-1
        - id: eval_2
          description: Guarda de caminho
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in id_vazio_recusado caminho_fora_do_preparo_recusado execucao_nao_publicada_preserva; do python3 -m pytest --collect-only -q tests/test_limpeza.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_limpeza.py -k "id_vazio_recusado or caminho_fora_do_preparo_recusado or execucao_nao_publicada_preserva"'
          verifies:
          - B-2
        - id: eval_3
          description: Nada além do prefixo da execução
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in outra_execucao_intacta prefixo_montado_de_partes_validadas; do python3 -m pytest --collect-only -q tests/test_limpeza.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_limpeza.py -k "outra_execucao_intacta or prefixo_montado_de_partes_validadas"'
          verifies:
          - B-1
          - B-2
        anti_patterns:
        - action: montar o caminho a apagar com variável não validada
          reason: um valor vazio vira o bucket inteiro
          instead: validar cada parte e exigir o prefixo _preparo/…/execucao=<id>
        - action: apagar preparo de execução sem commit publicado
          reason: pode ser uma execução ainda em curso
          instead: exigir o commit da execução no histórico
        - action: usar VACUUM para liberar espaço
          reason: VACUUM apaga histórico, que é evidência
          instead: apagar só o preparo, que não é histórico de tabela publicada
        do_not_touch:
        - _raw
        - cvg/docs/adrs
        - contracts
        rollback: Remover limpeza.py e seu teste; o preparo apagado é regenerável rodando a camada.
        observability: preparos de execuções já publicadas
