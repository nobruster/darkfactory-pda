          given: o tests/test_produtor.py depois da tarefa do produtor
          when: a tarefa atualiza os testes
          then: 'EXATAMENTE estas mudanças, e nenhuma outra: test_primeira_grava_segunda_diverge_sem_apagar sai e entra test_segunda_carga_recusada_sem_gravar — a primeira dá LAGO=GRAVADO, a segunda LAGO=RECUSADO, e os objetos da primeira ficam os mesmos, em nome e quantidade; test_cada_controle_divergente_acusa pode ajustar só o valor que altera, se usava uma linha que a gramática nova recusa; entram test_rejeitos_guardam_o_texto_bruto, test_rejeitos_fora_da_tabela, test_contagem_de_rejeitos_reconferida e test_especie_fora_do_padrao_nao_grava; os demais test_* ficam como estão e passam. Nenhum cenário usa skip, xfail ou importorskip.'
