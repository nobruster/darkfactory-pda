        - src/produtor/gravar_lago.py
        - src/produtor/vincular_procedencia.py
        - tests/test_vincular_procedencia.py
        rollback: Reverter src/produtor/spark_produtor.py e tests/test_produtor.py ao commit anterior.
        observability: arquivos recusados por espécie
