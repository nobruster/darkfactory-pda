        done_condition: src/produtor/vincular_procedencia.py usa gramatica.valor_decimal; os testes existentes de tests/test_vincular_procedencia.py passam sem edição; um teste novo prova que vinculador e gravador medem igual.
        effort: S
        profile: standard
        execution_backend: any
        required_tools: *id003
        depends_on:
        - T-20260924-gravador-corrige
        touches_paths:
        - src/produtor/vincular_procedencia.py
        - tests/test_vincular_procedencia.py
        creates_paths: []
        behavior:
        - id: B-1
          given: um CSV com '1,5', '-5,00' e valores válidos
          when: vincular_procedencia.ler_fonte e gravar_lago._ler_fonte leem o mesmo arquivo, no mesmo processo
          then: os cinco controles dos dois são iguais, porque ler_fonte usa gramatica.valor_decimal — a regex local sai de vincular_procedencia.py; a declaração de ANSI que já existe fica; nenhuma outra função muda de comportamento.
        - id: B-2
          given: o tests/test_vincular_procedencia.py selado
          when: a tarefa acrescenta os testes novos
          then: todos os test_* existentes ficam como estão e passam; entram só test_vinculador_usa_a_gramatica_do_juiz e test_vinculador_e_gravador_medem_igual. Nenhum cenário usa skip, xfail ou importorskip.
        evals:
        - id: eval_1
          description: A mesma gramática
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in vinculador_usa_a_gramatica_do_juiz vinculador_e_gravador_medem_igual; do python3 -m pytest --collect-only -q tests/test_vincular_procedencia.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_vincular_procedencia.py -k "vinculador_usa_a_gramatica_do_juiz or vinculador_e_gravador_medem_igual"'
          verifies:
          - B-1
        - id: eval_2
          description: A prova segue igual
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in grava_manifesto_hash_e_controles rele_o_que_gravou valor_em_decimal_nunca_float; do python3 -m pytest --collect-only -q tests/test_vincular_procedencia.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_vincular_procedencia.py -k "grava_manifesto_hash_e_controles or rele_o_que_gravou or valor_em_decimal_nunca_float"'
          verifies:
          - B-2
        - id: eval_3
          description: As recusas seguem iguais
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in zero_linhas_e_nao_medido prova_identica_nao_regrava hash_divergente_nao_grava; do python3 -m pytest --collect-only -q tests/test_vincular_procedencia.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_vincular_procedencia.py -k "zero_linhas_e_nao_medido or prova_identica_nao_regrava or hash_divergente_nao_grava"'
          verifies:
          - B-2
        anti_patterns:
        - action: editar um teste existente
          reason: a tarefa só troca a gramática
          instead: só acrescentar
        - action: regravar a _PROCEDENCIA.json da 2026-01
          reason: a prova anterior nunca é sobrescrita
          instead: o 2026-01 não muda com a gramática nova
        - action: copiar a regex de novo
          reason: é a duplicação que criou a divergência
          instead: importar gramatica
        do_not_touch:
