  swimlane:
    id: LANE-PRODUTOR-CORRIGE
    name: Produtor corrigido lane
    owner: medalhao
    legs:
    - id: LEG-PRODUTOR-CORRIGE
      observable_state: Produtor corrigido
      proof: Produtor sobre o CSV real de 2026-01 dá a âncora.
      requires:
      - gramatica do juiz em spark
      produces: *id002
      tasks:
      - id: T-20260924-produtor-corrige
        title: O produtor com a gramática do juiz, ANSI ligado, e espécie fora do padrão recusada
        goal: Corrigir no produtor Spark os defeitos latentes que a adoção fixou em teste. Para rodar testes, o ÚNICO comando liberado ao agente é `docker compose -f infra/docker-compose.yml exec -T spark python3 -m pytest <arquivo> -k <cenarios>`.
        done_condition: src/produtor/spark_produtor.py usa gramatica.valor_decimal e gramatica.especie_valida, declara spark.sql.ansi.enabled=true e recusa espécie fora do padrão; só os testes nomeados de tests/test_produtor.py mudam; todos passam.
        effort: S
        profile: standard
        execution_backend: any
        required_tools: *id003
        depends_on:
        - T-20260924-gramatica-do-juiz
        touches_paths:
        - src/produtor/spark_produtor.py
        - tests/test_produtor.py
        creates_paths: []
        behavior:
        - id: B-1
          given: o CSV de fixture da adoção
          when: produzir roda, num processo filho sem S3_*
          then: a conversão do valor é gramatica.valor_decimal — a regex local sai de spark_produtor.py —, então '1,5' entra como 1.50 e '-5,00' conta em linhas_invalidas; a sessão declara spark.sql.ansi.enabled=true; havendo QUALQUER linha com espécie inválida por gramatica.especie_valida, produzir levanta ProdutorRecusado com o motivo ESPECIE_FORA_DO_PADRAO e a contagem, e main imprime PRODUTOR=RECUSADO sem escrever envelope — como o juiz, que recusa o arquivo; nenhuma outra função de spark_produtor.py muda de comportamento.
        - id: B-2
          given: o tests/test_produtor.py selado pela adoção, que fixava o comportamento antigo
          when: a tarefa atualiza os testes
          then: 'EXATAMENTE estas mudanças, e nenhuma outra: test_gramatica_atual_fixada sai e entra test_gramatica_do_juiz; test_codigo_vazio_fora_do_total_fixado sai e entra test_especie_fora_do_padrao_recusa, com uma fixture própria contendo a linha de espécie vazia, que sai da fixture principal; test_produtor_totais_literais_da_fixture passa a ter os literais da gramática nova, recalculados à mão; entra test_sessao_do_produtor_ansi; as fixtures podem mudar só para isso; os demais test_* ficam como estão e passam. Nenhum cenário usa skip, xfail ou importorskip.'
        evals:
        - id: eval_1
          description: A gramática do juiz no produtor
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in gramatica_do_juiz produtor_totais_literais_da_fixture codigos_com_mesma_descricao_somam_separados; do python3 -m pytest --collect-only -q tests/test_produtor.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_produtor.py -k "gramatica_do_juiz or produtor_totais_literais_da_fixture or codigos_com_mesma_descricao_somam_separados"'
          verifies:
          - B-1
        - id: eval_2
          description: Espécie fora do padrão e ANSI
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in especie_fora_do_padrao_recusa sessao_do_produtor_ansi; do python3 -m pytest --collect-only -q tests/test_produtor.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_produtor.py -k "especie_fora_do_padrao_recusa or sessao_do_produtor_ansi"'
          verifies:
          - B-1
          - B-2
        - id: eval_3
          description: O resto do produtor igual
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in sha256_e_motor_no_envelope envelope_sem_float produzir_e_main_so_em_processo_filho; do python3 -m pytest --collect-only -q tests/test_produtor.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_produtor.py -k "sha256_e_motor_no_envelope or envelope_sem_float or produzir_e_main_so_em_processo_filho"'
          verifies:
          - B-2
        anti_patterns:
        - action: editar um teste fora da lista nomeada
          reason: a exceção à regra do teste selado é nomeada
          instead: só os testes listados em B-2
        - action: escolher entre as descrições ou descartar a linha de espécie inválida
          reason: descartar em silêncio é o defeito que se corrige (Regra 9)
          instead: recusar o arquivo
        - action: declarar ANSI por spark-defaults ou variável de ambiente
          reason: o que não se declara na sessão se herda
          instead: na própria sessão do produtor
        do_not_touch:
        - _raw
        - contracts
        - cvg/docs/adrs
        - src/pda
