      tasks:
      - id: T-20260924-gramatica-do-juiz
        title: A gramática do juiz, uma só, para os módulos Spark
        goal: Ter num módulo só a gramática monetária e o padrão de espécie que o juiz Python selado usa, expressos em Spark, para os três módulos do produtor pararem de divergir dele. Para rodar testes, o ÚNICO comando liberado ao agente é `docker compose -f infra/docker-compose.yml exec -T spark python3 -m pytest <arquivo> -k <cenarios>`.
        done_condition: src/produtor/gramatica.py dá, para cada caso da tabela, o MESMO veredito que pda.leitura; os testes de tests/test_gramatica.py passam.
        effort: S
        profile: standard
        execution_backend: any
        required_tools: &id003
