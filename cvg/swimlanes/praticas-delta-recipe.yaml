    reason: troca de tipo passaria (Regra 5).
  swimlane:
    id: LANE-MANUTENCAO
    name: Manutenção de retenção e OPTIMIZE lane
    owner: medalhao
    legs:
    - id: LEG-MANUTENCAO
      observable_state: Manutenção de retenção e OPTIMIZE
      proof: Multiconjunto igual antes e depois do OPTIMIZE.
      requires:
      - assuntos evoluem
      produces: *id006
      tasks:
      - id: T-20260925-manutencao-retencao-e-optimize
        title: 'Manutenção: retenção nas tabelas publicadas e OPTIMIZE com prova'
        goal: Dar às tabelas já publicadas a retenção de 5 anos e compactar ao fim de cada carga, provando que o dado não muda. Para rodar testes, o ÚNICO comando liberado ao agente é `docker compose -f infra/docker-compose.yml exec -T spark python3 -m pytest <arquivo> -k <cenarios>`.
        done_condition: src/medalhao/manutencao.py tem garantir_retencao e otimizar; scripts/manter_lago.py aplica os dois numa lista fechada de tabelas; os testes de tests/test_manutencao.py passam.
        effort: M
        profile: standard
        execution_backend: any
        required_tools: *id003
        depends_on:
        - T-20260925-assuntos-evoluem-por-padrao
        touches_paths: []
        creates_paths:
        - src/medalhao/manutencao.py
        - tests/test_manutencao.py
        - scripts/manter_lago.py
        behavior:
        - id: B-1
          given: tabelas Delta em tmp_path, com e sem as propriedades de retenção
          when: manutencao.garantir_retencao(spark, caminho) e manutencao.otimizar(spark, caminho) rodam
          then: 'garantir_retencao aplica por ALTER TABLE SET TBLPROPERTIES as duas propriedades = ''interval 1825 days'' SÓ quando faltam — devolve ALTERADA —; quando já presentes com esse valor, devolve JA_TINHA sem criar commit; quando presentes com OUTRO valor, ou só uma das duas, corrige as duas para ''interval 1825 days'' e devolve CORRIGIDA com os valores ANTERIORES no resultado — nunca encurta uma retenção, porque retenção curta deixa um VACUUM futuro apagar evidência; otimizar resolve a versão atual V, roda OPTIMIZE (executeCompaction), resolve a versão nova W, e prova que o dado não mudou: o multiconjunto de V e de W é igual nos dois sentidos, e as métricas do commit dizem numOutputRows == numInputRows (quando houve compactação); devolve OTIMIZADA ou SEM_MUDANCA (nada a compactar), e DIVERGE sem esconder se o dado mudasse. O módulo NÃO tem VACUUM — VACUUM só sob pedido do dono (ADR 0017). scripts/manter_lago.py aplica os dois a uma LISTA FECHADA e nomeada das tabelas Delta do lago, por padrão só MEDE (lista o que faria) e só altera com --aplicar, imprimindo um token por tabela.'
        - id: B-2
          given: uma tabela Delta em tmp_path e o script
          when: os testes rodam
          then: 'entram em tests/test_manutencao.py test_retencao_aplicada_em_tabela_sem, test_retencao_ja_presente_sem_commit, test_retencao_divergente_corrigida_e_registrada, test_retencao_parcial_completada, test_optimize_nao_muda_o_dado, test_optimize_sem_nada_a_compactar, test_optimize_acusa_dado_mudado (a leitura da versão nova é substituída por uma com uma linha a mais), test_modulo_sem_vacuum (AST: nenhuma chamada vacuum) e test_script_mede_por_padrao_e_lista_e_fechada (o script sem --aplicar não cria commit; a lista é literal). Nenhum cenário usa skip, xfail ou importorskip; os testes gravam só em tmp_path, nunca no MinIO; nenhuma função para a sessão Spark da suíte.'
        evals:
        - id: eval_1
          description: Retenção sem commit à toa
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in retencao_aplicada_em_tabela_sem retencao_ja_presente_sem_commit retencao_divergente_corrigida_e_registrada retencao_parcial_completada; do python3 -m pytest --collect-only -q tests/test_manutencao.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_manutencao.py -k "retencao_aplicada_em_tabela_sem or retencao_ja_presente_sem_commit or retencao_divergente_corrigida_e_registrada or retencao_parcial_completada"'
          verifies:
          - B-1
        - id: eval_2
          description: OPTIMIZE com prova
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in optimize_nao_muda_o_dado optimize_sem_nada_a_compactar optimize_acusa_dado_mudado; do python3 -m pytest --collect-only -q tests/test_manutencao.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_manutencao.py -k "optimize_nao_muda_o_dado or optimize_sem_nada_a_compactar or optimize_acusa_dado_mudado"'
          verifies:
          - B-1
        - id: eval_3
          description: Sem VACUUM, script que mede por padrão
          bash: docker compose -f infra/docker-compose.yml exec -T spark sh -c 'for c in modulo_sem_vacuum script_mede_por_padrao_e_lista_e_fechada; do python3 -m pytest --collect-only -q tests/test_manutencao.py -k "$c" 2>/dev/null | grep -q "::" || { echo "EVAL=CENARIO_AUSENTE_$c"; exit 1; }; done; python3 -m pytest -q tests/test_manutencao.py -k "modulo_sem_vacuum or script_mede_por_padrao_e_lista_e_fechada"'
          verifies:
          - B-1
          - B-2
