      pico do acumulador igual ao total, ambos com 11 dígitos inteiros; a
      premissa vale, mas por propriedade da FONTE, não da fórmula. Decidido
      com Bruno Nunes e registrado no ADR 0009, que SUPERSEDES o 0007 e
