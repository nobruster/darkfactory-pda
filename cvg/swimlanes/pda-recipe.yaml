  - id: OBJ-R13-C5
    status: FIXED
    summary: >-
      Hash antes/depois não prova W-1 — e o CSV estava em 0644, não 444.
    owner: Bruno Nunes
    rationale: >-
      CONFERIDO NO SISTEMA DE ARQUIVOS e o adversário estava certo: o ZIP
      estava r--r--r--, mas o CSV que a fábrica lê estava rw-r--r--. W-1
