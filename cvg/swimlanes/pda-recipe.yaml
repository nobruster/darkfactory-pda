schema_version: 1
intent:
  id: DI-PDA-BENEFICIOS
  title: Conferir uma competência do PDA contra âncora medida antes de publicar
  summary: >-
    Ler o CSV da competência por posição, agregar o valor líquido com
    aritmética exata, comparar contra os cinco controles da âncora medida na
    origem, classificar toda diferença e deixar um pacote de evidência —
    recusando publicar quando não houver prova.
  claim: proposed
  source:
    uri: cvg/docs/tech-spec/tech-spec-pda-beneficios.md
    captured_at: "2026-09-21T00:00:00Z"
    sha256: "94a7379f89cc795d8a355774626fc3984f116272b4184278ed9ab50750998573"
  success:
    - Sem âncora medida o veredito não autoriza publicar.
    - Os cinco controles são comparados individualmente.
    - Ponto flutuante em campo monetário é recusado na entrada.
    - Uma linha removida ou um centavo alterado é recusado.
    - Agrupar por descrição truncada é recusado.
  out_of_scope:
    - Corrigir defeitos da fonte — a fábrica classifica, nunca corrige.
    - Substituir o carregamento atual, que segue rodando em paralelo.
    - O ETL a jusante que consome o resultado.
    - O carregamento ao lago em Spark e MinIO. Não é incógnita - o ADR 0006
      decidiu que o juízo e o produtor são entregáveis separáveis, e que a
      infra ausente não impede construir nem provar o juízo. Entra como
      plano próprio, contra o envelope que a SEAM-FRONTEIRA já contrata.
      O ADR 0006 supersedes a linha de escopo do 0005, que prendia a infra
      a este mesmo plano.
    - Comparar competências VIZINHAS. O ADR 0001 nomeia a lacuna — nenhum
      gate aqui vê um salto na média entre meses, e a fábrica acusa um
      centavo errado DENTRO de uma competência sem enxergar isso. O
      darkfactory-inss mediu seis competências e achou dois fenômenos
      reais na média, além de um máximo de 2026-01 três vezes maior que o
      de fevereiro e março. Fica declarado como limite conhecido, não
      resolvido em silêncio — e faixa medida numa competência não vira
      regra para outra.
system_map:
  claim: proposed
  components:
    - Contrato e âncora
    - Leitura posicional
    - Agregação monetária
    - Juízo do agregado
    - Pacote de evidência
    - Orquestração da execução
  external_dependencies:
    - Arquivo CSV da competência, imutável em _raw/
    - Âncora medida na origem por fora do pipeline
    - Spark e MinIO, a montar — o carregamento ao lago é escopo próprio
  unknowns: []
evidence:
  - id: E-ANCORA-202601
    claim: external
    source:
      uri: cvg/docs/adrs/0001-the-2026-01-anchor-is-41572553-rows-summing-78521752562-12.md
      captured_at: "2026-09-21T00:00:00Z"
      sha256: "0505a743963abfb09a257373a431c3878b25cf6c19d71467c722da9830779acd"
    confidence: 1.0
    summary: >-
      Competência 2026-01 medida na origem em 64s — 41572553 linhas, soma
      78521752562.12, validada contra o darkfactory-inss.
  - id: E-ESPECIE-TRUNCADA
    claim: external
    source:
      uri: cvg/docs/adrs/0008-the-description-defect-is-collapsed-identity-not-field-width.md
      captured_at: "2026-09-21T00:00:00Z"
      sha256: "823955da853edb64bd7dc9caafb2e87327ca6aac3e5a6bae06c23dc7e2d0c5eb"
    confidence: 1.0
    summary: >-
      Medido na competência inteira (ADR 0008): 65 códigos, 52 descrições,
      e 11 descrições cobrem 24 códigos — 'Pensão por Morte de ' funde
      01, 03, 23 e 59. O defeito é identidade colapsada, não largura.
decisions:
  - id: ADR-0002-POSICIONAL
    status: accepted
    owner: Bruno Nunes
    rationale: >-
      Espécie aparece duas vezes no cabeçalho; ler por nome perde uma das
      duas em silêncio.
  - id: ADR-0003-HALF-EVEN
    status: accepted
    owner: Bruno Nunes
    rationale: >-
      Precisão declarada, arredonda uma vez no total, meio-para-par — as três
      em ordem de precedência.
  - id: ADR-0004-CODIGO-E-CHAVE
    status: accepted
    owner: Bruno Nunes
    rationale: >-
      A chave é o código; agrupar por descrição somaria quatro espécies numa
      linha com o total continuando a bater.
  - id: ADR-0005-MOTORES-SEPARADOS
    status: accepted
    owner: Bruno Nunes
    rationale: >-
      Spark grava no lago, Python puro confere. Um juiz que usa o motor que
      julga herda seus pontos cegos — se a leitura distribuída descartar uma
      das duas colunas Espécie, os dois lados concordariam e nada acusaria.
      O ADR 0006 supersedeu a parte de ESCOPO do 0005, não esta: a separação
      de motores continua valendo, e é justamente ela que torna o juízo e o
      produtor entregáveis separáveis.
seams:
  - id: SEAM-CONTRATO
    name: Contrato e âncora
    description: Separa a verdade declarada do código que a consome.
    evidence: [E-ANCORA-202601]
    responsibility: >-
      Guardar a âncora medida e o layout posicional, e recusar construir sem
      eles.
    consumes: [âncora medida na origem]
    produces: [contrato validado]
    owner: contrato
    independent_proof: >-
      Competência sem âncora devolve NAO_MEDIDO como valor, antes de abrir o
      arquivo.
    decision_ids: [ADR-0002-POSICIONAL]
    rejected_alternatives:
      - alternative: Derivar a âncora do Parquet já publicado
        reason: >-
          Mede o que o pipeline produziu, não o que a fonte publicou; um
          defeito comum às duas execuções ficaria invisível.
    swimlane:
      id: LANE-CONTRATO
      name: Contrato lane
      owner: contrato
      legs:
        - id: LEG-CONTRATO-RECUSA-SEM-ANCORA
          observable_state: A fábrica recusa construir sem âncora medida
          proof: >-
            Competência sem âncora devolve NAO_MEDIDO; com âncora incompleta
            (sem aprovador ou sem data) também.
          requires: []
          produces: [contrato validado]
          tasks:
            - id: T-20260921-contrato-ancora
              title: Carregar contrato, âncora e layout posicional
              goal: Fazer a ausência de prova bloquear em vez de virar verde.
              done_condition: >-
                Os cinco controles e o layout saem com procedência; sem
                âncora, ou sem aprovador, retorna NAO_MEDIDO como valor.
              effort: M
              profile: standard
              execution_backend: any
              required_tools: [git, bash, python3, pytest]
              depends_on: []
              touches_paths: []
              creates_paths:
                - src/pda/contrato.py
                - tests/test_contrato.py
                - contracts/competencia-202601.yaml
              behavior:
                - id: B-1
                  given: um contrato com os cinco controles nomeados, a procedência, o layout posicional e os DOIS hashes — o do ZIP publicado e o do CSV extraído sobre o qual a âncora foi medida
                  when: o contrato é carregado
                  then: âncora, procedência, layout, os dois hashes, a CARDINALIDADE de códigos medida na competência inteira — 65 nesta, não os 51 amostrados pelo ADR 0004 — a CONTAGEM MEDIDA DE COLAPSOS que o ADR 0008 exige junto dela, 11 descrições cobrindo 24 códigos, e a POLÍTICA DECIMAL com escala e não-negatividade saem juntas — precisão, granularidade e modo de arredondamento são dados carregados do contrato, como o ADR 0003 exige, não escolha privada de quem implementa. Contrato SEM política decimal é NAO_MEDIDO, senão o agregador local fixa a sua, passa nos exemplos, e um produtor externo escolhe outra sem nada acusar. E contrato COM política que contradiz o ADR — HALF_UP, ou granularidade por campo — é RECUSADO no carregamento, não validado, porque um contrato contraditório deixaria o agregador entre obedecer ao contrato e obedecer à decisão vinculante; a validação confere a política contra o ADR, e nunca o contrário. A precisão é conferida por SUFICIÊNCIA e é DERIVADA, como manda o ADR 0009 — dígitos inteiros da âncora mais a escala máxima declarada para os intermediários, 11 + 3 = 14 nesta competência, sob a premissa DECLARADA de soma monotônica; o contrato declara a escala e a NÃO-NEGATIVIDADE do domínio, medidas na fonte, em vez de assumir um padrão, porque um acumulador que exceda o total quebraria a fórmula e 14 perderia o centavo. A escala declarada é verificada por QUEM RECEBE O VALOR, não pelo carregador, que roda antes da leitura e não vê registro nenhum — a leitura confere cada valor da fonte, e a fronteira confere cada monetário do envelope externo, ambos contra a escala do contrato; um valor que a exceda é defeito classificado, nunca somado em silêncio. Escala finita não é escala menor ou igual a 3, e sem essa verificação na etapa consumidora a precisão validada perderia informação durante a soma e ainda devolveria o mesmo total global arredondado, com os mapas por código errados. Precisão 6 com HALF_EVEN e arredondamento final satisfaz presença, modo e granularidade e devolve 7.85218E+10 no lugar de 78.521.752.562,12; prec=13 representa o total e ainda assim perde o centavo ao SOMAR 78521752562,12 + 0,005 + 0,005, porque a perda acontece durante a soma e não na quantização. Contrato com precisão insuficiente é RECUSADO no carregamento, não descoberto durante a agregação. Falta o hash do CSV e também é NAO_MEDIDO, porque hoje só o ZIP tem checksum e a âncora foi medida no CSV — sem o par, trocar o CSV extraído não seria detectado; sem aprovador ou sem data, idem
                - id: B-2
                  given: uma competência sem âncora no contrato
                  when: o contrato é carregado
                  then: retorna NAO_MEDIDO como valor, sem gravar nem encerrar o processo
              evals:
                - id: eval_1
                  description: Hashes distintos; política ausente vira NAO_MEDIDO e política HALF_UP é recusada
                  bash: pytest -q tests/test_contrato.py -k "ancorada or hash_zip_e_csv or sem_politica_decimal or politica_contradiz_adr"
                  verifies: [B-1]
                - id: eval_2
                  description: Sem âncora retorna NAO_MEDIDO sem escrever em disco
                  bash: pytest -q tests/test_contrato.py -k nao_medido
                  verifies: [B-2]
                - id: eval_3
                  description: O layout declara as 14 posições, com Espécie em 12 e 13
                  bash: pytest -q tests/test_contrato.py -k layout
                  verifies: [B-1, B-2]
              anti_patterns:
                - action: gerar a âncora quando ela falta
                  reason: um número que ninguém viu medir é um palpite
                  instead: retornar NAO_MEDIDO
                - action: editar a âncora para um veredito passar
                  reason: falsifica a verdade contra a qual tudo é medido
                  instead: investigar; âncora revista exige nova aprovação
                - action: declarar colunas por nome no contrato
                  reason: Espécie aparece duas vezes e o nome não decide qual
                  instead: declarar o índice posicional
              do_not_touch: [_raw, cvg/docs/adrs]
              rollback: Remover o carregador de contrato e seus testes.
              observability: competências ancoradas no contrato
  - id: SEAM-LEITURA
    name: Leitura posicional
    description: Separa a extração dos bytes da interpretação monetária.
    evidence: [E-ESPECIE-TRUNCADA]
    responsibility: >-
      Ler os registros por posição declarada, preservando os bytes originais.
    consumes: [arquivo da competência, contrato validado]
    produces: [registros lidos, defeitos observados, sha256 computado na leitura, totais por código da leitura]
    owner: leitura
    independent_proof: >-
      O sha256 do arquivo é idêntico após a leitura, e cada campo vem da
      posição declarada mesmo com cabeçalho repetido.
    decision_ids: [ADR-0002-POSICIONAL]
    rejected_alternatives:
      - alternative: Ler por nome de cabeçalho, renomeando a duplicata
        reason: >-
          A renomeação é por ordem de aparição, não por significado; se a
          fonte inverter as colunas, lê a errada sem acusar.
    swimlane:
      id: LANE-LEITURA
      name: Leitura lane
      owner: leitura
      legs:
        - id: LEG-LEITURA-POSICIONAL
          observable_state: A leitura é posicional e não altera a fonte
          proof: >-
            sha256 inalterado; a coluna 12 traz código numérico e a 13
            descrição de até 20 caracteres.
          requires: [contrato validado]
          produces: [registros lidos, defeitos observados, sha256 computado na leitura, totais por código da leitura]
          tasks:
            - id: T-20260921-leitura-posicional
              title: Ler a competência por posição, sem alterar a fonte
              goal: Extrair registros preservando os bytes e o defeito de origem.
              done_condition: >-
                sha256 idêntico antes e depois; código e descrição saem de
                posições distintas; registro ilegível entra em
                linhas_invalidas.
              effort: M
              profile: standard
              execution_backend: any
              required_tools: [git, bash, python3, pytest]
              depends_on: [T-20260921-contrato-ancora]
              touches_paths: []
              creates_paths:
                - src/pda/leitura.py
                - tests/test_leitura.py
                - tests/fixtures/competencia-min.csv
              behavior:
                - id: B-1
                  given: um arquivo com Espécie repetida e o layout declarado, e outro em que as DUAS colunas de cabeçalho idêntico Espécie — índices 12 e 13 — tiveram os valores trocados entre si, deixando o cabeçalho byte a byte igual
                  when: a leitura começa
                  then: no primeiro o sha256 fica idêntico E a proteção de escrita é conferida antes de ler — W-1 exige chmod 444 nos bytes de origem, e hash antes/depois não prova proteção, porque um arquivo em 0666 passa nesse teste quando ninguém escreve durante ele; a leitura recusa começar se _raw não estiver protegido. Código e descrição vêm dos índices 12 e 13; os totais por código que a leitura produz são somados em contexto decimal PRÓPRIO, com a precisão derivada do contrato, e o teste força um contexto global adverso e exige exatidão mesmo assim — a proteção escrita para a agregação não alcança a leitura, e uma referência corrompida faria a fronteira recusar um produtor correto com os testes da leitura verdes. No segundo a leitura BLOQUEIA, e o gate NÃO pode ser conferência de cabeçalho — cabeçalho idêntico não distingue as duas — e sim o formato de cada posição, MEDIDO nas 41.572.553 linhas — o índice 12 é sempre só dígitos, largura 2 após strip, alinhado à direita, e o 13 é sempre textual, alinhado à esquerda, sem uma única linha em que os dois sejam indistinguíveis; o teste falha se for satisfeito trocando colunas de nomes diferentes, porque é esta troca, de nomes iguais, que motivou o ADR 0002 e que os cinco controles preservam
                - id: B-2
                  given: um registro cujo campo monetário é ilegível, os valores 'NaN', 'Infinity', '1_000' e '1e3', e os quatro exemplos do ADR 0004 — entre eles 'Pensão por Morte de ' com 20 caracteres brutos e 19 após strip
                  when: os registros são contados
                  then: o primeiro entra em linhas_invalidas com identidade, valor original e posição. Os quatro valores especiais TAMBÉM entram como inválidos, porque legível é o que casa a gramática monetária MEDIDA NA FONTE, e não o que Decimal() aceita. A fonte publica no formato brasileiro com preenchimento à esquerda — '        1.621,00', ponto de milhar e vírgula decimal, escala 2 nas 41.572.553 linhas, zero recusas — de modo que Decimal(bruto) RECUSA toda linha legítima e a normalização é parte da gramática, não um passo implícito — retira o preenchimento, exige o padrão e só então converte. E cada valor convertido é conferido contra a ESCALA CARREGADA do contrato, não contra duas casas fixas, antes de entrar nos mapas de referência — é a verificação que o carregador delega a quem recebe o valor; fixar duas casas recusaria uma fonte futura com escala maior legitimamente declarada, e não conferir deixaria um contrato de escala 1 aceitar '1,23' com a precisão validada para outro domínio. Valor fora da escala contratada é defeito classificado, e valor NEGATIVO também, porque o ADR 0009 derivou a precisão sob soma monotônica. Uma gramática de ponto decimal recusaria a competência inteira — os quatro passam pelo construtor, e um NaN chegaria vivo aos extremos, onde min levanta InvalidOperation e transformaria defeito de UMA linha em ERRO da execução inteira. E a descrição emite defeito de IDENTIDADE COLAPSADA, sem tornar a linha inválida, quando cobre mais de um código — critério do ADR 0008, medido na competência inteira — 11 descrições cobrem 24 códigos, entre elas 'Pensão por Morte de ' fundindo 01, 03, 23 e 59. A unidade do defeito é a DESCRIÇÃO, não a ocorrência, ele só é emitido ao fim da varredura, porque colapso é propriedade do conjunto, e a contagem observada é conferida contra a CONTAGEM MEDIDA que o contrato carrega — senão a leitura poderia omitir um colapso, o envelope local reproduzir a mesma lista, e a comparação por identidade concordar com cardinalidade, mapas e controles todos corretos — um leitor incremental que emitisse a partir do segundo código deixaria sem registro todas as ocorrências anteriores, e a fronteira concordaria com a lista incompleta por ter a própria leitura como referência. Largura NÃO é critério — as 41.572.553 descrições têm 20 caracteres brutos, então bruto==20 acusaria toda linha, e strip==20 deixaria de fora justamente esse colapso de quatro códigos, cujo strip é 19
              evals:
                - id: eval_1
                  description: Leitura posicional; _raw sem 444 bloqueia; Espécie 12 e 13 trocadas bloqueiam
                  bash: pytest -q tests/test_leitura.py -k "sha256 or w1_protecao or especie_12_13_trocadas"
                  verifies: [B-1]
                - id: eval_2
                  description: Ilegível vira inválida; NaN também; descrição que colapsa códigos acusa
                  bash: pytest -q tests/test_leitura.py -k "invalida or gramatica_monetaria or identidade_colapsada"
                  verifies: [B-2]
                - id: eval_3
                  description: A leitura reporta sua duração para a orquestração medir o total
                  bash: pytest -q tests/test_leitura.py -k duracao
                  verifies: [B-1, B-2]
              anti_patterns:
                - action: escrever no arquivo de origem
                  reason: destrói a prova de que a origem publicou aquilo
                  instead: tratar _raw/ como somente leitura
                - action: ler colunas por nome de cabeçalho
                  reason: Espécie repetida faz perder uma das duas em silêncio
                  instead: ler por posição declarada no contrato
                - action: corrigir valor malformado durante a leitura
                  reason: apaga o defeito antes da classificação
                  instead: preservar e contar como linha inválida
              do_not_touch: [_raw]
              rollback: Remover o leitor e seus testes.
              observability: registros lidos e defeitos por tipo
  - id: SEAM-AGREGACAO
    name: Agregação monetária
    description: Separa a soma exata da comparação contra a âncora.
    evidence: [E-ANCORA-202601]
    responsibility: >-
      Somar o valor líquido com precisão declarada e agrupar pelo código.
    consumes: [registros lidos, contrato validado]
    produces: [agregado da competência]
    owner: agregacao
    independent_proof: >-
      Float é recusado na entrada; agrupar por descrição produz contagem
      diferente de agrupar por código.
    decision_ids: [ADR-0003-HALF-EVEN, ADR-0004-CODIGO-E-CHAVE]
    rejected_alternatives:
      - alternative: Usar float e arredondar no final
        reason: 0.1 + 0.2 != 0.3 em binário; o centavo some sem nada acusar.
      - alternative: Agrupar por descricao_especie
        reason: >-
          51 códigos colapsam em 40 descrições; quatro espécies virariam uma
          linha com o total continuando a bater.
    swimlane:
      id: LANE-AGREGACAO
      name: Agregação lane
      owner: agregacao
      legs:
        - id: LEG-AGREGADO-EXATO
          observable_state: O agregado é exato e a chave é o código
          proof: >-
            Float recusado; precisão baixa acusa a perda; agrupar por
            descrição diverge de agrupar por código.
          requires: [registros lidos, contrato validado]
          produces: [agregado da competência]
          tasks:
            - id: T-20260921-agregacao-exata
              title: Somar com precisão declarada e agrupar pelo código
              goal: Tornar as três decisões de decimal explícitas e verificáveis.
              done_condition: >-
                Float recusado na entrada; os cinco controles saem nomeados;
                agrupar por descrição diverge de agrupar por código.
              effort: M
              profile: standard
              execution_backend: any
              required_tools: [git, bash, python3, pytest]
              depends_on: [T-20260921-leitura-posicional]
              touches_paths: []
              creates_paths:
                - src/pda/agregacao.py
                - tests/test_agregacao.py
              behavior:
                - id: B-1
                  given: um valor de ponto flutuante em campo monetário, e um lote com registros ilegíveis misturados aos válidos
                  when: o agregado é calculado
                  then: o float é recusado com erro explícito; os cinco controles são DOIS de contagem e TRÊS monetários, e só sum_vl_liquido é soma — count_linhas conta todo registro lido, linhas_invalidas conta só os ilegíveis, e sum, min e max ignoram o ilegível em vez de tratá-lo como 0.00; o teste prova que o ilegível foi EXCLUÍDO, nunca comparando totais, porque preencher com 0.00 não muda a soma, não muda max e não muda min — min já é 0.00 na fonte — e passaria despercebido pelos três. No limite em que NENHUM registro é legível, min e max não têm valor e o agregado os marca AUSENTES, com sum=0.00 e a contagem de inválidos igual à de lidos — zero inventaria extremos que não existem, e levantar exceção decidiria por conta própria que defeito de fonte interrompe o processamento, coisa que nem a tech-spec nem o juízo pediram; a ausência é representada e atravessa a fronteira e a evidência, que já marcam campo não percorrido como ausente
                - id: B-2
                  given: um contexto decimal de precisão baixa, valores em empate exato, e a alternativa meio-para-cima
                  when: o total é calculado
                  then: o resultado é o de HALF_EVEN a duas casas — comparado contra o valor que HALF_UP produziria, e RECUSANDO-o; declarar um modo não basta, o teste falha se a implementação usar meio-para-cima. A perda por precisão baixa também é acusada, e arredondar por campo difere de arredondar no total. E a SAÍDA do agregador preserva os códigos distintos — tantos quantos a competência tiver, conferidos contra a cardinalidade ancorada no contrato e NÃO contra os 51 do ADR 0004, que foram medidos em ~3 milhões de linhas; na competência inteira são 65, e fixar 51 recusaria o arquivo correto. Cada VALOR por código é conferido contra os totais por código da leitura, não só a chave presente — um agregador que somasse por descrição, atribuísse o total ao primeiro código e emitisse zero nos demais conservaria todas as chaves e todos os controles globais, e a demonstração de que descrição e código têm cardinalidades diferentes continuaria verdadeira; se esse agregador fornecesse a referência da fronteira, o defeito contaminaria a conferência também
              evals:
                - id: eval_1
                  description: Float recusado; ilegível excluído e não zerado; nenhum legível marca extremos ausentes
                  bash: pytest -q tests/test_agregacao.py -k "recusa_float or ilegivel_excluido_nao_zerado or nenhum_legivel_extremos_ausentes"
                  verifies: [B-1]
                - id: eval_2
                  description: HALF_EVEN recusa o valor que HALF_UP daria; precisão e granularidade
                  bash: pytest -q tests/test_agregacao.py -k "recusa_half_up or precisao_declarada or granularidade"
                  verifies: [B-2]
