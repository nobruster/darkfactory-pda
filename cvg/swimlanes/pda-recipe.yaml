      virando defeito classificado. scripts/medir_sinal.py registra
      (SINAL=MEDIDO). A leitura rejeitada ficou gravada — elevar a precisão
      com folga trocaria premissa tácita por margem arbitrária, mantendo o
      mesmo defeito.
  - id: OBJ-R12-C3
    status: FIXED
    summary: >-
      Colapso é propriedade do conjunto, mas um leitor incremental só o
