                  then: o veredito é REDERIVADO dos cinco controles, da âncora, das classificações de cada diferença, dos hashes, da COMPETÊNCIA SOLICITADA gravada ao lado das recebidas do contrato e do envelope — sem ela a execução de 2026-02 recusada por trazer artefatos coerentes de 2026-01 é indistinguível de uma execução legítima de janeiro, e rederivaria ACEITO, rejeitando o pacote legítimo de RECUSADO — e dos PARES de origens distintas que motivaram cada comparação — as duas listas de defeitos, a observada na leitura e a declarada no envelope, e os dois mapas de totais por código, o da leitura e o do envelope, todos gravados separadamente; sem eles, um RECUSADO legítimo rederivaria ACEITO, seja por omissão de defeito, seja por um envelope que transfere 1,00 do código A para o B mantendo chaves, controles globais, hashes e defeitos idênticos — casos em que só a divergência entre os dois lados explica a recusa. E o pacote preserva o TIPO original de cada campo monetário recebido, sem normalizar — serializar tudo como string faria 0.0 e '0.00' virarem insumos numericamente iguais, e a recusa legítima por número JSON deixaria de ser rederivável embora controles e hashes coincidam; o pacote adulterado é recusado porque o rótulo discorda do que esses insumos produzem. São TRÊS os hashes gravados, os mesmos que a fronteira compara — o ANCORADO do contrato, o OBSERVADO computado na leitura e o DECLARADO no envelope; com dois só, um pacote legítimo de RECUSADO por ancorado=observado e declarado divergente rederivaria ACEITO e seria rejeitado. A ausência não é recusa incondicional, ela decide o veredito — e quem decide é a CAUSA registrada, não a falta de um hash. Contrato que devolveu NAO_MEDIDO por qualquer motivo — sem âncora, sem aprovador, sem data ou sem política decimal — dá ACEITO_SEM_ANCORA, mesmo que o hash ancorado exista e nenhum observado tenha sido produzido; e o pacote grava TODOS os campos que determinam a validade do contrato como foram lidos — aprovador, data, política decimal e a escala declarada que deriva a precisão — cada um distinguindo CHAVE AUSENTE de valor null, porque montar o pacote com get() tornaria os dois indistinguíveis e a fronteira trata um como estrutura recusada e o outro como ausência aceita; numa competência ancorada sem registros legíveis essa perda mudaria o próprio veredito rederivado. Grava os campos, não só a causa, porque dois contratos em estados de aprovação diferentes produziriam os mesmos dados auditáveis e o leitor apenas confiaria no rótulo da causa — trocar a confiança no rótulo do veredito pela confiança noutro rótulo não é rederivar, e uma causa incorreta passaria sem ninguém ver; ler a falta do hash como se fosse a causa recusaria justamente o pacote que a orquestração deve gravar. Falta o observado COM evento de falha registrado e é execução interrompida, desfecho ERRO. Contrato RECUSADO no carregamento, por política que contradiz o ADR, é um terceiro caminho antecipado — termina sem hash observado, sem agregado e sem envelope, não é NAO_MEDIDO nem exceção, e o pacote grava a política recusada e a cláusula do ADR violada, que é o que a rederivação precisa para reconstruir esse RECUSADO sem depender do rótulo. A precedência é declarada, não deduzida — NAO_MEDIDO decide antes, RECUSADO por contrato exige a política gravada, e ERRO exige o evento. Os três casos gravam pacote válido; recusar qualquer um impediria de gravar justamente a execução que precisa de registro. Só é recusado o pacote cujo rótulo não bate com o que os insumos rederivam; campos não percorridos são marcados ausentes, nunca zerados
                - id: B-2
                  given: duas execuções da mesma competência
                  when: a segunda é gravada
                  then: as duas coexistem — a segunda não sobrescreve a primeira
              evals:
                - id: eval_1
                  description: Rederiva com os três hashes; precedência quando ancorado e observado faltam juntos
                  bash: pytest -q tests/test_evidencia.py -k "rederiva or rotulo_adulterado or tres_hashes or precedencia_sem_ancora"
