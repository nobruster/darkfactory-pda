  - id: OBJ-R8-C8
    status: FIXED
    summary: >-
      A prova do agregador local exigia as chaves, não os valores — somar
      por descrição e zerar os demais códigos passaria.
    owner: Bruno Nunes
    rationale: >-
      E se esse agregador fornecesse a referência da fronteira, o defeito
