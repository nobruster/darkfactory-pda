schema_version: 1
intent:
  id: DI-PDA-BENEFICIOS
  title: Conferir uma competência do PDA contra âncora medida antes de publicar
  summary: >-
    Ler o CSV da competência por posição, agregar o valor líquido com
    aritmética exata, comparar contra os cinco controles da âncora medida na
    origem, classificar toda diferença e deixar um pacote de evidência —
    recusando publicar quando não houver prova.
  claim: proposed
  source:
    uri: cvg/docs/tech-spec/tech-spec-pda-beneficios.md
    captured_at: "2026-09-21T00:00:00Z"
    sha256: "94a7379f89cc795d8a355774626fc3984f116272b4184278ed9ab50750998573"
  success:
    - Sem âncora medida o veredito não autoriza publicar.
    - Os cinco controles são comparados individualmente.
    - Ponto flutuante em campo monetário é recusado na entrada.
    - Uma linha removida ou um centavo alterado é recusado.
    - Agrupar por descrição truncada é recusado.
  out_of_scope:
    - Corrigir defeitos da fonte — a fábrica classifica, nunca corrige.
    - Substituir o carregamento atual, que segue rodando em paralelo.
    - O ETL a jusante que consome o resultado.
    - O carregamento ao lago em Spark e MinIO. Não é incógnita - o ADR 0006
      decidiu que o juízo e o produtor são entregáveis separáveis, e que a
      infra ausente não impede construir nem provar o juízo. Entra como
      plano próprio, contra o envelope que a SEAM-FRONTEIRA já contrata.
      O ADR 0006 supersedes a linha de escopo do 0005, que prendia a infra
      a este mesmo plano.
system_map:
  claim: proposed
  components:
    - Contrato e âncora
    - Leitura posicional
    - Agregação monetária
    - Juízo do agregado
    - Pacote de evidência
    - Orquestração da execução
  external_dependencies:
    - Arquivo CSV da competência, imutável em _raw/
    - Âncora medida na origem por fora do pipeline
    - Spark e MinIO, a montar — o carregamento ao lago é escopo próprio
  unknowns: []
evidence:
  - id: E-ANCORA-202601
    claim: external
    source:
      uri: cvg/docs/adrs/0001-the-2026-01-anchor-is-41572553-rows-summing-78521752562-12.md
      captured_at: "2026-09-21T00:00:00Z"
      sha256: "0505a743963abfb09a257373a431c3878b25cf6c19d71467c722da9830779acd"
    confidence: 1.0
    summary: >-
      Competência 2026-01 medida na origem em 64s — 41572553 linhas, soma
      78521752562.12, validada contra o darkfactory-inss.
  - id: E-ESPECIE-TRUNCADA
    claim: external
    source:
      uri: cvg/docs/adrs/0004-column-13-is-a-truncated-description-not-a-second-code.md
      captured_at: "2026-09-21T00:00:00Z"
      sha256: "b43c67e62096483fbc967ef82f1a2270c6039929859435b8dad12167ffec6de3"
    confidence: 1.0
    summary: >-
      51 códigos colapsam em 40 descrições truncadas em 20 caracteres;
      'Pensão por Morte de' cobre os códigos 01, 03, 23 e 59.
decisions:
  - id: ADR-0002-POSICIONAL
    status: accepted
    owner: Bruno Nunes
    rationale: >-
      Espécie aparece duas vezes no cabeçalho; ler por nome perde uma das
      duas em silêncio.
  - id: ADR-0003-HALF-EVEN
    status: accepted
    owner: Bruno Nunes
    rationale: >-
      Precisão declarada, arredonda uma vez no total, meio-para-par — as três
      em ordem de precedência.
  - id: ADR-0004-CODIGO-E-CHAVE
    status: accepted
    owner: Bruno Nunes
    rationale: >-
      A chave é o código; agrupar por descrição somaria quatro espécies numa
      linha com o total continuando a bater.
  - id: ADR-0005-MOTORES-SEPARADOS
    status: accepted
    owner: Bruno Nunes
    rationale: >-
      Spark grava no lago, Python puro confere. Um juiz que usa o motor que
      julga herda seus pontos cegos — se a leitura distribuída descartar uma
      das duas colunas Espécie, os dois lados concordariam e nada acusaria.
      O ADR 0006 supersedeu a parte de ESCOPO do 0005, não esta: a separação
      de motores continua valendo, e é justamente ela que torna o juízo e o
      produtor entregáveis separáveis.
seams:
  - id: SEAM-CONTRATO
    name: Contrato e âncora
    description: Separa a verdade declarada do código que a consome.
    evidence: [E-ANCORA-202601]
    responsibility: >-
      Guardar a âncora medida e o layout posicional, e recusar construir sem
      eles.
    consumes: [âncora medida na origem]
    produces: [contrato validado]
    owner: contrato
    independent_proof: >-
      Competência sem âncora devolve NAO_MEDIDO como valor, antes de abrir o
      arquivo.
    decision_ids: [ADR-0002-POSICIONAL]
    rejected_alternatives:
      - alternative: Derivar a âncora do Parquet já publicado
        reason: >-
          Mede o que o pipeline produziu, não o que a fonte publicou; um
          defeito comum às duas execuções ficaria invisível.
    swimlane:
      id: LANE-CONTRATO
      name: Contrato lane
      owner: contrato
      legs:
        - id: LEG-CONTRATO-RECUSA-SEM-ANCORA
          observable_state: A fábrica recusa construir sem âncora medida
          proof: >-
            Competência sem âncora devolve NAO_MEDIDO; com âncora incompleta
            (sem aprovador ou sem data) também.
          requires: []
          produces: [contrato validado]
          tasks:
            - id: T-20260921-contrato-ancora
              title: Carregar contrato, âncora e layout posicional
              goal: Fazer a ausência de prova bloquear em vez de virar verde.
              done_condition: >-
                Os cinco controles e o layout saem com procedência; sem
                âncora, ou sem aprovador, retorna NAO_MEDIDO como valor.
              effort: M
              profile: standard
              execution_backend: any
              required_tools: [git, bash, python3, pytest]
              depends_on: []
              touches_paths: []
              creates_paths:
                - src/pda/contrato.py
                - tests/test_contrato.py
                - contracts/competencia-202601.yaml
              behavior:
                - id: B-1
                  given: um contrato com os cinco controles nomeados, a procedência, o layout posicional e os DOIS hashes — o do ZIP publicado e o do CSV extraído sobre o qual a âncora foi medida
                  when: o contrato é carregado
                  then: âncora, procedência, layout, os dois hashes, a CARDINALIDADE de códigos medida na competência inteira — 65 nesta, não os 51 amostrados pelo ADR 0004 — e a POLÍTICA DECIMAL saem juntos — precisão, granularidade e modo de arredondamento são dados carregados do contrato, como o ADR 0003 exige, não escolha privada de quem implementa. Contrato SEM política decimal é NAO_MEDIDO, senão o agregador local fixa a sua, passa nos exemplos, e um produtor externo escolhe outra sem nada acusar. E contrato COM política que contradiz o ADR — HALF_UP, ou granularidade por campo — é RECUSADO no carregamento, não validado, porque um contrato contraditório deixaria o agregador entre obedecer ao contrato e obedecer à decisão vinculante; a validação confere a política contra o ADR, e nunca o contrário. Falta o hash do CSV e também é NAO_MEDIDO, porque hoje só o ZIP tem checksum e a âncora foi medida no CSV — sem o par, trocar o CSV extraído não seria detectado; sem aprovador ou sem data, idem
                - id: B-2
                  given: uma competência sem âncora no contrato
                  when: o contrato é carregado
                  then: retorna NAO_MEDIDO como valor, sem gravar nem encerrar o processo
              evals:
                - id: eval_1
                  description: Hashes distintos; política ausente vira NAO_MEDIDO e política HALF_UP é recusada
                  bash: pytest -q tests/test_contrato.py -k "ancorada or hash_zip_e_csv or sem_politica_decimal or politica_contradiz_adr"
                  verifies: [B-1]
                - id: eval_2
                  description: Sem âncora retorna NAO_MEDIDO sem escrever em disco
                  bash: pytest -q tests/test_contrato.py -k nao_medido
                  verifies: [B-2]
                - id: eval_3
                  description: O layout declara as 14 posições, com Espécie em 12 e 13
                  bash: pytest -q tests/test_contrato.py -k layout
                  verifies: [B-1, B-2]
              anti_patterns:
                - action: gerar a âncora quando ela falta
                  reason: um número que ninguém viu medir é um palpite
                  instead: retornar NAO_MEDIDO
                - action: editar a âncora para um veredito passar
                  reason: falsifica a verdade contra a qual tudo é medido
                  instead: investigar; âncora revista exige nova aprovação
                - action: declarar colunas por nome no contrato
                  reason: Espécie aparece duas vezes e o nome não decide qual
                  instead: declarar o índice posicional
              do_not_touch: [_raw, cvg/docs/adrs]
              rollback: Remover o carregador de contrato e seus testes.
              observability: competências ancoradas no contrato
  - id: SEAM-LEITURA
    name: Leitura posicional
    description: Separa a extração dos bytes da interpretação monetária.
    evidence: [E-ESPECIE-TRUNCADA]
    responsibility: >-
      Ler os registros por posição declarada, preservando os bytes originais.
    consumes: [arquivo da competência, contrato validado]
    produces: [registros lidos, defeitos observados, sha256 computado na leitura]
    owner: leitura
    independent_proof: >-
      O sha256 do arquivo é idêntico após a leitura, e cada campo vem da
      posição declarada mesmo com cabeçalho repetido.
    decision_ids: [ADR-0002-POSICIONAL]
    rejected_alternatives:
      - alternative: Ler por nome de cabeçalho, renomeando a duplicata
        reason: >-
          A renomeação é por ordem de aparição, não por significado; se a
          fonte inverter as colunas, lê a errada sem acusar.
    swimlane:
      id: LANE-LEITURA
      name: Leitura lane
      owner: leitura
      legs:
        - id: LEG-LEITURA-POSICIONAL
          observable_state: A leitura é posicional e não altera a fonte
          proof: >-
            sha256 inalterado; a coluna 12 traz código numérico e a 13
            descrição de até 20 caracteres.
          requires: [contrato validado]
          produces: [registros lidos, defeitos observados, sha256 computado na leitura]
          tasks:
            - id: T-20260921-leitura-posicional
              title: Ler a competência por posição, sem alterar a fonte
              goal: Extrair registros preservando os bytes e o defeito de origem.
              done_condition: >-
                sha256 idêntico antes e depois; código e descrição saem de
                posições distintas; registro ilegível entra em
                linhas_invalidas.
              effort: M
              profile: standard
              execution_backend: any
              required_tools: [git, bash, python3, pytest]
              depends_on: [T-20260921-contrato-ancora]
              touches_paths: []
              creates_paths:
                - src/pda/leitura.py
                - tests/test_leitura.py
                - tests/fixtures/competencia-min.csv
              behavior:
                - id: B-1
                  given: um arquivo com Espécie repetida e o layout declarado, e outro em que as DUAS colunas de cabeçalho idêntico Espécie — índices 12 e 13 — tiveram os valores trocados entre si, deixando o cabeçalho byte a byte igual
                  when: a leitura começa
                  then: no primeiro o sha256 fica idêntico e código e descrição vêm dos índices 12 e 13; no segundo a leitura BLOQUEIA, e o gate NÃO pode ser conferência de cabeçalho — cabeçalho idêntico não distingue as duas — e sim o formato de cada posição, o índice 12 com código de 2 dígitos à direita e o 13 com descrição textual; o teste falha se for satisfeito trocando colunas de nomes diferentes, porque é esta troca, de nomes iguais, que motivou o ADR 0002 e que os cinco controles preservam
                - id: B-2
                  given: um registro cujo campo monetário é ilegível, e os quatro exemplos do ADR 0004 — entre eles 'Pensão por Morte de ' com 20 caracteres brutos e 19 após strip
                  when: os registros são contados
                  then: o primeiro entra em linhas_invalidas com identidade, valor original e posição; os quatro emitem defeito de truncamento sem serem inválidos, porque o critério é o campo BRUTO ocupar os 20 caracteres do layout — medir após strip deixaria o exemplo principal do ADR de fora
              evals:
                - id: eval_1
                  description: Leitura posicional; Espécie 12 e 13 trocadas entre si bloqueiam
                  bash: pytest -q tests/test_leitura.py -k "sha256 or posicional or especie_12_13_trocadas"
                  verifies: [B-1]
                - id: eval_2
                  description: Ilegível vira inválida; descrição truncada emite defeito
                  bash: pytest -q tests/test_leitura.py -k "invalida or truncamento_emitido"
                  verifies: [B-2]
                - id: eval_3
                  description: A leitura reporta sua duração para a orquestração medir o total
                  bash: pytest -q tests/test_leitura.py -k duracao
                  verifies: [B-1, B-2]
              anti_patterns:
                - action: escrever no arquivo de origem
                  reason: destrói a prova de que a origem publicou aquilo
                  instead: tratar _raw/ como somente leitura
                - action: ler colunas por nome de cabeçalho
                  reason: Espécie repetida faz perder uma das duas em silêncio
                  instead: ler por posição declarada no contrato
                - action: corrigir valor malformado durante a leitura
                  reason: apaga o defeito antes da classificação
                  instead: preservar e contar como linha inválida
              do_not_touch: [_raw]
              rollback: Remover o leitor e seus testes.
              observability: registros lidos e defeitos por tipo
  - id: SEAM-AGREGACAO
    name: Agregação monetária
    description: Separa a soma exata da comparação contra a âncora.
    evidence: [E-ANCORA-202601]
    responsibility: >-
      Somar o valor líquido com precisão declarada e agrupar pelo código.
    consumes: [registros lidos, contrato validado]
    produces: [agregado da competência]
    owner: agregacao
    independent_proof: >-
      Float é recusado na entrada; agrupar por descrição produz contagem
      diferente de agrupar por código.
    decision_ids: [ADR-0003-HALF-EVEN, ADR-0004-CODIGO-E-CHAVE]
    rejected_alternatives:
      - alternative: Usar float e arredondar no final
        reason: 0.1 + 0.2 != 0.3 em binário; o centavo some sem nada acusar.
      - alternative: Agrupar por descricao_especie
        reason: >-
          51 códigos colapsam em 40 descrições; quatro espécies virariam uma
          linha com o total continuando a bater.
    swimlane:
      id: LANE-AGREGACAO
      name: Agregação lane
      owner: agregacao
      legs:
        - id: LEG-AGREGADO-EXATO
          observable_state: O agregado é exato e a chave é o código
          proof: >-
            Float recusado; precisão baixa acusa a perda; agrupar por
            descrição diverge de agrupar por código.
          requires: [registros lidos, contrato validado]
          produces: [agregado da competência]
          tasks:
            - id: T-20260921-agregacao-exata
              title: Somar com precisão declarada e agrupar pelo código
              goal: Tornar as três decisões de decimal explícitas e verificáveis.
              done_condition: >-
                Float recusado na entrada; os cinco controles saem nomeados;
                agrupar por descrição diverge de agrupar por código.
              effort: M
              profile: standard
              execution_backend: any
              required_tools: [git, bash, python3, pytest]
              depends_on: [T-20260921-leitura-posicional]
              touches_paths: []
              creates_paths:
                - src/pda/agregacao.py
                - tests/test_agregacao.py
              behavior:
                - id: B-1
                  given: um valor de ponto flutuante em campo monetário, e um lote com registros ilegíveis misturados aos válidos
                  when: o agregado é calculado
                  then: o float é recusado com erro explícito; os cinco controles são DOIS de contagem e TRÊS monetários, e só sum_vl_liquido é soma — count_linhas conta todo registro lido, linhas_invalidas conta só os ilegíveis, e sum, min e max ignoram o ilegível em vez de tratá-lo como 0.00; o teste prova que o ilegível foi EXCLUÍDO, nunca comparando totais, porque preencher com 0.00 não muda a soma, não muda max e não muda min — min já é 0.00 na fonte — e passaria despercebido pelos três
                - id: B-2
                  given: um contexto decimal de precisão baixa, valores em empate exato, e a alternativa meio-para-cima
                  when: o total é calculado
                  then: o resultado é o de HALF_EVEN a duas casas — comparado contra o valor que HALF_UP produziria, e RECUSANDO-o; declarar um modo não basta, o teste falha se a implementação usar meio-para-cima. A perda por precisão baixa também é acusada, e arredondar por campo difere de arredondar no total. E a SAÍDA do agregador preserva os códigos distintos — tantos quantos a competência tiver, conferidos contra a cardinalidade ancorada no contrato e NÃO contra os 51 do ADR 0004, que foram medidos em ~3 milhões de linhas; na competência inteira são 65, e fixar 51 recusaria o arquivo correto. O teste falha se a chave do agregador entregue for a descrição, porque demonstrar dentro do teste que os dois agrupamentos diferem continuaria verdadeiro com um agregador que usa a descrição
              evals:
                - id: eval_1
                  description: Float recusado; dois de contagem e três monetários; ilegível excluído, não zerado
                  bash: pytest -q tests/test_agregacao.py -k "recusa_float or cinco_controles or ilegivel_excluido_nao_zerado"
                  verifies: [B-1]
                - id: eval_2
                  description: HALF_EVEN recusa o valor que HALF_UP daria; precisão e granularidade
                  bash: pytest -q tests/test_agregacao.py -k "recusa_half_up or precisao_declarada or granularidade"
                  verifies: [B-2]
                - id: eval_3
                  description: A saída preserva a cardinalidade ancorada; chave por descrição faz falhar
                  bash: pytest -q tests/test_agregacao.py -k "chave_e_codigo or cardinalidade_ancorada"
                  verifies: [B-1, B-2]
              anti_patterns:
                - action: herdar o arredondamento padrão da linguagem
                  reason: defaults divergem e o erro fica estruturalmente verde
                  instead: declarar precisão, granularidade e regra
                - action: agrupar por descricao_especie
                  reason: quatro espécies virariam uma linha e o total bateria
                  instead: agrupar pelo código da posição 12
                - action: arredondar a cada soma parcial
                  reason: o erro de arredondamento acumula linha a linha
                  instead: somar exato e arredondar uma vez no final
              do_not_touch: [_raw, cvg/docs/adrs]
              rollback: Remover o agregador e seus testes.
              observability: total agregado e espécies distintas
  - id: SEAM-JUIZO
    name: Juízo do agregado
    description: Separa a decisão de aceitar da produção do número.
    evidence: [E-ANCORA-202601]
    responsibility: >-
      Comparar os cinco controles contra a âncora e classificar toda
      diferença.
    consumes: [envelope do produtor, contrato validado]
    produces: [veredito classificado]
    owner: juizo
    independent_proof: >-
      Uma linha removida do arquivo é recusada, e divergência em qualquer
      controle recusa mesmo classificada.
    decision_ids: [ADR-0003-HALF-EVEN]
    rejected_alternatives:
      - alternative: Aceitar diferença abaixo de um limite configurável
        reason: >-
          Tolerância configurável é como um centavo inexplicado vira um
          centavo aceito.
    swimlane:
      id: LANE-JUIZO
      name: Juízo lane
      owner: juizo
      legs:
        - id: LEG-JUIZO-ACUSA
          observable_state: O juiz recusa divergência em qualquer controle
          proof: >-
            Agregado com uma linha a menos é recusado; controle divergente
            classificado como CONFIRMED também recusa.
          requires: [envelope do produtor, contrato validado]
          produces: [veredito classificado]
          tasks:
            - id: T-20260921-juizo-classifica
              title: Comparar os cinco controles e classificar a diferença
              goal: Fazer o juiz acusar, não apenas aprovar.
              done_condition: >-
                Os cinco controles comparados individualmente; divergência
                recusa mesmo classificada; defeito sem classificação bloqueia.
              effort: M
              profile: standard
              execution_backend: any
              required_tools: [git, bash, python3, pytest]
              depends_on: [T-20260921-envelope-fronteira]
              touches_paths: []
              creates_paths:
                - src/pda/juizo.py
                - tests/test_juizo.py
              behavior:
                - id: B-1
                  given: um agregado com uma linha a menos, e outro que redistribui valores mantendo soma e contagem
                  when: o juízo compara contra a âncora
                  then: os cinco controles são comparados individualmente e qualquer divergência recusa — soma e contagem iguais não bastam
                - id: B-2
                  given: uma diferença de cada uma das seis classificações, uma sem classificação nenhuma, e uma marcada com DUAS ao mesmo tempo
                  when: o veredito é calculado
                  then: cada diferença carrega exatamente uma classificação — zero bloqueia e duas também, porque duas permitem escolher a mais branda na hora de ler; divergência em qualquer controle RECUSA mesmo classificada; fora dos controles, MODERN_DEFECT, CONTRACT_AMBIGUITY e UNRESOLVED bloqueiam e as três CONFIRMED/APPROVED apenas registram
              evals:
                - id: eval_1
                  description: Linha a menos recusa; extremos alterados com soma igual também
                  bash: pytest -q tests/test_juizo.py -k "linha_a_menos or cinco_controles"
                  verifies: [B-1]
                - id: eval_2
                  description: Precedência — controle divergente recusa mesmo classificado
                  bash: pytest -q tests/test_juizo.py -k precedencia
                  verifies: [B-2]
                - id: eval_3
                  description: Sem classificação bloqueia; DUAS classificações também
                  bash: pytest -q tests/test_juizo.py -k "defeito_sem_classe or classificacao_unica"
                  verifies: [B-1, B-2]
              anti_patterns:
                - action: introduzir parâmetro de tolerância
                  reason: um centavo inexplicado viraria um centavo aceito
                  instead: classificar a diferença ou consertar o pipeline
                - action: editar a âncora para o veredito passar
                  reason: falsifica a prova em vez de investigar
                  instead: investigar; âncora revista exige nova aprovação
                - action: deixar a classificação autorizar publicação
                  reason: CONFIRMED explica a diferença, não a aprova
                  instead: divergência em controle recusa, classificada ou não
              do_not_touch: [_raw, cvg/docs/adrs, contracts]
              rollback: Remover o juízo e seus testes.
              observability: vereditos por classificação
  - id: SEAM-EVIDENCIA
    name: Pacote de evidência
    description: Separa o registro da prova da decisão que a produziu.
    evidence: [E-ANCORA-202601]
    responsibility: Gravar veredito, causa e números de forma reconstruível.
    consumes: [veredito classificado]
    produces: [pacote de evidência]
    owner: evidencia
    independent_proof: >-
      O veredito é reconstruído do pacote sem reexecutar, e uma execução não
      sobrescreve a anterior.
    decision_ids: [ADR-0004-CODIGO-E-CHAVE]
    rejected_alternatives:
      - alternative: Gravar com overwrite, como o carregamento atual
        reason: >-
          Destrói a execução anterior; impossível responder depois o que foi
          publicado ou comparar duas execuções.
    swimlane:
      id: LANE-EVIDENCIA
      name: Evidência lane
      owner: evidencia
      legs:
        - id: LEG-EVIDENCIA-RECONSTROI
          observable_state: O pacote reconstrói o veredito sem reexecutar
          proof: >-
            Ler o pacote reproduz o veredito; gravar duas execuções preserva
            as duas.
          requires: [veredito classificado]
          produces: [pacote de evidência]
          tasks:
            - id: T-20260921-evidencia-packet
              title: Gravar o pacote por execução, sem sobrescrever
              goal: Tornar o veredito auditável sem reexecutar o pipeline.
              done_condition: >-
                O pacote traz veredito, causa, âncora, agregado, duração e
                classificações; duas execuções coexistem.
              effort: S
              profile: standard
              execution_backend: any
              required_tools: [git, bash, python3, pytest]
              depends_on: [T-20260921-juizo-classifica]
              touches_paths: []
              creates_paths:
                - src/pda/evidencia.py
                - tests/test_evidencia.py
              behavior:
                - id: B-1
                  given: uma execução com âncora, outra que terminou antes da leitura, e um pacote adulterado onde só o rótulo do veredito foi trocado
                  when: o pacote é lido de volta
                  then: o veredito é REDERIVADO dos cinco controles, da âncora, das classificações de cada diferença, dos hashes e das DUAS listas de defeitos — a observada na leitura e a declarada no envelope, gravadas separadamente, senão um RECUSADO legítimo por omissão rederivaria ACEITO, já que controles e hashes coincidem e só a divergência entre as listas explica a recusa; o pacote adulterado é recusado porque o rótulo discorda do que esses insumos produzem. São TRÊS os hashes gravados, os mesmos que a fronteira compara — o ANCORADO do contrato, o OBSERVADO computado na leitura e o DECLARADO no envelope; com dois só, um pacote legítimo de RECUSADO por ancorado=observado e declarado divergente rederivaria ACEITO e seria rejeitado. A ausência não é recusa incondicional, ela decide o veredito — e quem decide é a CAUSA registrada, não a falta de um hash. Contrato que devolveu NAO_MEDIDO por qualquer motivo — sem âncora, sem aprovador, sem data ou sem política decimal — dá ACEITO_SEM_ANCORA, mesmo que o hash ancorado exista e nenhum observado tenha sido produzido; ler a falta do hash como se fosse a causa recusaria justamente o pacote que a orquestração deve gravar. Falta o observado COM evento de falha registrado e é execução interrompida, desfecho ERRO. Contrato RECUSADO no carregamento, por política que contradiz o ADR, é um terceiro caminho antecipado — termina sem hash observado, sem agregado e sem envelope, não é NAO_MEDIDO nem exceção, e o pacote grava a política recusada e a cláusula do ADR violada, que é o que a rederivação precisa para reconstruir esse RECUSADO sem depender do rótulo. A precedência é declarada, não deduzida — NAO_MEDIDO decide antes, RECUSADO por contrato exige a política gravada, e ERRO exige o evento. Os três casos gravam pacote válido; recusar qualquer um impediria de gravar justamente a execução que precisa de registro. Só é recusado o pacote cujo rótulo não bate com o que os insumos rederivam; campos não percorridos são marcados ausentes, nunca zerados
                - id: B-2
                  given: duas execuções da mesma competência
                  when: a segunda é gravada
                  then: as duas coexistem — a segunda não sobrescreve a primeira
              evals:
                - id: eval_1
                  description: Rederiva com os três hashes; precedência quando ancorado e observado faltam juntos
                  bash: pytest -q tests/test_evidencia.py -k "rederiva or rotulo_adulterado or tres_hashes or precedencia_sem_ancora"
                  verifies: [B-1]
                - id: eval_2
                  description: Duas execuções coexistem, sem overwrite
                  bash: pytest -q tests/test_evidencia.py -k nao_sobrescreve
                  verifies: [B-2]
                - id: eval_3
                  description: Os quatro vereditos terminais são distinguíveis
                  bash: pytest -q tests/test_evidencia.py -k vereditos
                  verifies: [B-1, B-2]
              anti_patterns:
                - action: gravar com mode overwrite
                  reason: e o defeito do carregamento atual — destrói a prova
                  instead: gravar um pacote por execução
                - action: editar um pacote antigo para corrigir o histórico
                  reason: falsifica evidência
                  instead: gravar evidência nova e manter a antiga
                - action: ler o veredito do rótulo gravado no pacote
                  reason: o rótulo é conclusão, não prova — trocá-lo basta para mentir
                  instead: rederivar dos controles, da âncora e dos hashes
              do_not_touch: [_raw, evidence]
              rollback: Remover o gravador de evidência e seus testes.
              observability: pacotes gravados por competência
  - id: SEAM-ORQUESTRACAO
    name: Orquestração da execução
    description: Separa quem decide o desfecho de quem produz cada parte.
    evidence: [E-ANCORA-202601]
    responsibility: >-
      Encadear as etapas, decidir o veredito terminal e o código de saída, e
      garantir pacote em todo caminho.
    consumes: [contrato validado, veredito classificado, pacote de evidência]
    produces: [desfecho da execução]
    owner: orquestracao
    independent_proof: >-
      Os quatro desfechos terminam com pacote e código distintos, e uma
      exceção real vira ERRO com pacote.
    decision_ids: [ADR-0003-HALF-EVEN]
    rejected_alternatives:
      - alternative: Deixar cada etapa encerrar o processo
        reason: >-
          O contrato sairia antes da leitura e o pacote prometido nunca seria
          gravado; encerrar é decisão de fluxo, não de etapa.
    swimlane:
      id: LANE-ORQUESTRACAO
      name: Orquestração lane
      owner: orquestracao
      legs:
        - id: LEG-DESFECHO-COM-PACOTE
          observable_state: Todo caminho termina com pacote e código de saída
          proof: >-
            Os quatro desfechos gravam pacote; uma exceção dentro da leitura
            vira ERRO com pacote; o tempo é medido do início ao veredito.
          requires: [contrato validado, veredito classificado, pacote de evidência]
          produces: [desfecho da execução]
          tasks:
            - id: T-20260921-orquestra-desfecho
              title: Decidir o desfecho e garantir o pacote em todo caminho
              goal: Dar dono ao fluxo — sem ele a lacuna migra de etapa em etapa.
              done_condition: >-
                Os quatro desfechos gravam pacote com código próprio; exceção
                real vira ERRO; o tempo total é medido e registrado no pacote.
                R-9 é should e NÃO é declarado coberto aqui — medir com
                relógio simulado não demonstra orçamento de competência
                completa, e inventar recusa por timeout seria afrouxar o que
                a tech-spec não pediu.
              effort: M
              profile: standard
              execution_backend: any
              required_tools: [git, bash, python3, pytest]
              depends_on: [T-20260921-evidencia-packet]
              touches_paths: []
              creates_paths:
                - src/pda/orquestracao.py
                - tests/test_orquestracao.py
              behavior:
                - id: B-1
                  given: execução sem âncora, execução que bate, e a execução de R-7 — um centavo alterado nos bytes do arquivo, com o sha256 do arquivo ALTERADO reancorado no contrato, de modo que a fronteira passe e o juízo seja quem decide
                  when: a orquestração conduz o fluxo inteiro
                  then: as três gravam pacote, com ACEITO_SEM_ANCORA, ACEITO e RECUSADO de códigos de saída distintos, e só ACEITO autoriza publicar. O caso de R-7 é UMA prova conjunta, não duas separadas — a alteração é real nos bytes, a recusa vem do JUÍZO comparando contra a âncora monetária original, e o teste FALHA se um juízo permissivo for injetado. Sem reancorar, a fronteira recusaria pelo sha256 antes do juízo comparar, e o teste ficaria verde com juízo permissivo — provando metade do que R-7 escreveu
                - id: B-2
                  given: uma exceção real levantada dentro da leitura, uma execução com contrato de política HALF_UP, e uma execução cujo tempo total é medido
                  when: a orquestração conduz a execução
                  then: o contrato HALF_UP termina em RECUSADO com pacote gravado, sem chegar à leitura — caminho exercido aqui, não só declarado no contrato; a exceção vira ERRO com pacote gravado, e o tempo do início da leitura ao veredito é medido e REGISTRADO no pacote, sem virar recusa — R-9 é should, e o pacote passa a carregar o número para que a cobertura de R-9 seja decidida contra competência real, não contra relógio simulado. Se o PRÓPRIO gravador falhar — permissão negada, disco cheio — o desfecho é ERRO com código próprio e a falha vai para a saída de erro; nunca se devolve ACEITO sem pacote, porque autorização sem evidência é o que esta fábrica existe para impedir
              evals:
                - id: eval_1
                  description: R-7 numa prova só — centavo alterado, hash reancorado, juízo permissivo falha
                  bash: pytest -q tests/test_orquestracao.py -k "desfechos or r7_centavo_reancorado"
                  verifies: [B-1]
                - id: eval_2
                  description: Exceção real vira ERRO; o tempo é medido no total
                  bash: pytest -q tests/test_orquestracao.py -k "excecao or tempo_total"
                  verifies: [B-2]
                - id: eval_3
                  description: Só ACEITO autoriza publicar
                  bash: pytest -q tests/test_orquestracao.py -k autoriza
                  verifies: [B-1, B-2]
              anti_patterns:
                - action: encerrar o processo dentro de uma etapa
                  reason: o pacote prometido nunca é gravado
                  instead: retornar o veredito e deixar a orquestração decidir
                - action: medir o tempo por etapa
                  reason: etapa rápida com o resto lento passaria
                  instead: medir do início da leitura ao veredito
                - action: tratar ACEITO_SEM_ANCORA como autorização
                  reason: a palavra aceito nomeia o término, não a prova
                  instead: só ACEITO autoriza, com os cinco controles conferidos
              do_not_touch: [_raw, cvg/docs/adrs]
              rollback: Remover a orquestração e seus testes.
              observability: desfechos por tipo e segundos até o veredito
  - id: SEAM-FRONTEIRA
    name: Fronteira produtor-juiz
    description: >-
      Separa quem produz o agregado de quem o julga. O ADR 0005 decidiu que
      são motores diferentes; esta costura escreve o contrato entre eles,
      para que o produtor real implemente contra algo declarado em vez de
      contra o que o juiz por acaso aceita.
    evidence: [E-ANCORA-202601]
    responsibility: >-
      Declarar e validar o envelope que o produtor entrega ao juiz — os
      cinco controles, a procedência do arquivo lido e os defeitos
      observados.
    consumes: [agregado da competência, defeitos observados, sha256 computado na leitura]
    produces: [envelope do produtor]
    owner: fronteira
    independent_proof: >-
      Um envelope sem o sha256 do arquivo lido é recusado; um envelope cujo
      sha256 difere do que o contrato ancorou é recusado; e linhas_invalidas
      é conferido contra a contagem de defeitos, não aceito de graça.
    decision_ids: [ADR-0005-MOTORES-SEPARADOS]
    rejected_alternatives:
      - alternative: Deixar o juiz ler o Parquet do lago diretamente
        reason: >-
          O juiz passaria a depender do formato e do motor que julga — se a
          leitura distribuída perder uma coluna, os dois lados concordariam.
      - alternative: Definir o envelope só quando o Spark existir
        reason: >-
          O produtor implementaria contra o que o juiz por acaso aceita, e a
          fronteira nasceria implícita — que é como C1, C4 e C5 apareceram.
    swimlane:
      id: LANE-FRONTEIRA
      name: Fronteira lane
      owner: fronteira
      legs:
        - id: LEG-ENVELOPE-VINCULADO
          observable_state: O envelope liga o agregado ao arquivo que o gerou
          proof: >-
            Envelope sem sha256 do arquivo é recusado; sha256 divergente do
            ancorado é recusado; linhas_invalidas incoerente com os defeitos
            observados é recusado.
          requires: [agregado da competência, defeitos observados, sha256 computado na leitura]
          produces: [envelope do produtor]
          tasks:
            - id: T-20260921-envelope-fronteira
              title: Declarar e validar o envelope entre produtor e juiz
              goal: >-
                Fazer a fronteira ser um contrato escrito, não o que o juiz
                por acaso aceita.
              done_condition: >-
                O envelope declara os cinco controles, o sha256 do arquivo
                lido e os defeitos; validação recusa sha256 ausente,
                divergente, ou linhas_invalidas incoerente.
              effort: M
              profile: standard
              execution_backend: any
              required_tools: [git, bash, python3, pytest]
              depends_on: [T-20260921-agregacao-exata]
              touches_paths: []
              creates_paths:
                - src/pda/envelope.py
                - tests/test_envelope.py
                - contracts/envelope-produtor.schema.json
              behavior:
                - id: B-1
                  given: um envelope sem o sha256 do arquivo lido, outro cujo sha256 difere do ancorado, e um terceiro que COPIOU o sha256 ancorado mas foi produzido lendo outro arquivo
                  when: o envelope é validado
                  then: os três são recusados. O hash computado chega ao validador como capacidade própria, sha256 computado na leitura, que a leitura declara entre seus produtos e a fronteira exige entre seus requisitos — não como mais um campo do envelope, senão os dois campos viriam da mesma mão e repetir o ancorado bastaria. O terceiro é recusado porque o hash que a leitura computou discorda do que o envelope declara, e é esse caso, não a mera igualdade, que prova o vínculo. Para produtor externo, que o ADR 0006 permite, vale o mesmo — sem a capacidade computada por quem leu os bytes, o envelope é recusado por falta de insumo, nunca aceito por ausência de contraditório
                - id: B-2
                  given: um envelope onde linhas_invalidas diverge dos defeitos do tipo VALOR_ILEGIVEL, outro com linhas_invalidas=0 e defeitos de truncamento, outro produzido por motor que não é o juiz, outro cujos três controles monetários vêm como número JSON, e outro que OMITE truncamentos que a leitura observou
                  when: o envelope é validado
                  then: o primeiro é recusado; o segundo é ACEITO — truncamento é defeito numa linha válida, e a competência 2026-01 tem linhas_invalidas=0 com milhões de truncamentos; o terceiro é aceito sem que o juiz importe nada do motor produtor. O quarto é RECUSADO na fronteira, antes de qualquer conversão — TODO campo monetário do envelope é contratado como string ou Decimal, os três controles globais e também cada total por código, porque R-4 e o ADR 0003 valem para todo dinheiro e não só para os três; um envelope com controles em string e totais por espécie como número JSON satisfaria uma recusa escrita só para os três. Converter com Decimal(str(v)) apagaria a prova de que veio float, então a recusa do agregador local não cobre produtor externo. O quinto é RECUSADO por omissão — e a conferência é POR IDENTIDADE de cada defeito, a que a leitura produz com valor original e posição, não por contagem e tipo — dois defeitos A e B do mesmo tipo, com A duplicado e B omitido, preservam contagem e tipo, cada entrada declarada recebe sua classificação única, e B nunca é classificado, violando R-6 com juízo e rederivação concordando entre si. Conferir por contagem deixaria a substituição passar, e só a omissão seria vista. E o envelope declara o agregado POR CÓDIGO de espécie, com as chaves conferidas contra a cardinalidade ANCORADA no contrato — medida na competência inteira, nunca os 51 do ADR 0004, que saíram de ~3 milhões de linhas; exigir 51 recusaria esta competência, que tem 65 códigos, entre eles o '60' com 1.395 ocorrências em 41,5 milhões. E cada total por código é CONFERIDO contra a leitura, não só a presença da chave — um produtor que agrupasse por descrição e atribuísse o total ao primeiro código, zerando os demais, manteria todas as chaves, os cinco controles, hashes e defeitos idênticos; R-3 vale para o produtor externo, e prova-se por valor, não por forma
              evals:
                - id: eval_1
                  description: Sha ausente, divergente, ou copiado de outro arquivo lido é recusado
                  bash: pytest -q tests/test_envelope.py -k "sha_ausente or sha_divergente or sha_copiado_outro_arquivo"
                  verifies: [B-1]
                - id: eval_2
                  description: Float em todo campo monetário; defeito por identidade; total por código conferido
                  bash: pytest -q tests/test_envelope.py -k "invalidas_por_tipo or float_em_todo_monetario or defeito_por_identidade or total_por_codigo"
                  verifies: [B-2]
                - id: eval_3
                  description: O schema aceita envelope de qualquer produtor, sem importar o motor
                  bash: pytest -q tests/test_envelope.py -k produtor_agnostico
                  verifies: [B-1, B-2]
              anti_patterns:
                - action: aceitar envelope sem o sha256 do arquivo lido
                  reason: a âncora vale para um arquivo; sem o vínculo, outra publicação da mesma competência passaria
                  instead: exigir o sha256 e compará-lo com o ancorado
                - action: importar o motor produtor dentro do validador
                  reason: o juiz voltaria a depender de quem ele julga
                  instead: validar o envelope como dado, seja qual for a origem
                - action: somar todo defeito em linhas_invalidas
                  reason: truncamento é defeito numa linha VÁLIDA; a competência 2026-01 tem linhas_invalidas=0 com milhões de truncamentos, e a regra recusaria o dado correto
                  instead: conferir linhas_invalidas só contra defeitos do tipo VALOR_ILEGIVEL
              do_not_touch: [_raw, cvg/docs/adrs]
              rollback: Remover o validador de envelope e seus testes.
              observability: envelopes recusados por motivo
steel_thread:
  - LEG-CONTRATO-RECUSA-SEM-ANCORA
  - LEG-LEITURA-POSICIONAL
  - LEG-AGREGADO-EXATO
  - LEG-ENVELOPE-VINCULADO
  - LEG-JUIZO-ACUSA
  - LEG-EVIDENCIA-RECONSTROI
  - LEG-DESFECHO-COM-PACOTE
objections:
  - id: OBJ-C1
    status: FIXED
    summary: >-
      O fluxo dito inteiro não cobria a arquitetura do ADR 0005 — dava para
      concluir a cadeia com módulos Python e fixtures, sem nunca conectar o
      produtor que será julgado.
    owner: Bruno Nunes
    rationale: >-
      Criada a sétima costura, SEAM-FRONTEIRA. Ela escreve o contrato entre
      produtor e juiz agora, para que o Spark implemente contra algo
      declarado em vez de contra o que o juiz por acaso aceita. A
      independência do ADR 0005 deixa de ser só declaração.
  - id: OBJ-C2
    status: FIXED
    summary: >-
      Declarar um modo de arredondamento não demonstrava HALF_EVEN — uma
      implementação com HALF_UP passaria nos testes descritos.
    owner: Bruno Nunes
    rationale: >-
      B-2 da agregação passou a exigir o resultado de HALF_EVEN comparado
      contra o que HALF_UP produziria, recusando-o.
  - id: OBJ-C3
    status: FIXED
    summary: >-
      Leitura posicional não provava rejeição de mudança de layout; trocar
      duas colunas não monetárias preservaria os cinco controles.
    owner: Bruno Nunes
    rationale: >-
      B-1 da leitura passou a exigir bloqueio ANTES de ler qualquer
      registro quando o cabeçalho está fora da ordem declarada, como o ADR
      0002 promete.
  - id: OBJ-C4
    status: FIXED
    summary: >-
      A procedência não vinculava a âncora ao arquivo efetivamente lido —
      uma republicação com os mesmos controles passaria.
    owner: Bruno Nunes
    rationale: >-
      O envelope da SEAM-FRONTEIRA carrega o sha256 do arquivo lido, e a
      validação recusa sha256 ausente ou divergente do ancorado.
  - id: OBJ-C5
    status: FIXED
    summary: >-
      A interface não definia como linhas inválidas chegam aos cinco
      controles; um produtor que contasse só as válidas devolveria zero.
    owner: Bruno Nunes
    rationale: >-
      O envelope exige coerência entre linhas_invalidas e a contagem de
      defeitos observados, e recusa envelope incoerente.
  - id: OBJ-C6
    status: FIXED
    summary: >-
      O truncamento do ADR 0004 podia nunca chegar à classificação —
      dinheiro válido e descrições truncadas passariam com defeitos vazios.
    owner: Bruno Nunes
    rationale: >-
      B-2 da leitura passou a exigir que descrição de exatamente 20
      caracteres emita defeito de truncamento, mesmo sem ser linha inválida.
  - id: OBJ-C7
    status: FIXED
    summary: >-
      A promessa de pacote em todo caminho assumia que a própria gravação
      não falha.
    owner: Bruno Nunes
    rationale: >-
      B-2 da orquestração declara o desfecho quando o gravador falha: ERRO
      com código próprio, nunca ACEITO sem pacote — autorização sem
      evidência é o que a fábrica existe para impedir.
  - id: OBJ-R2-C1
    status: ACCEPTED
    summary: >-
      O fluxo não construiria o produtor Spark nem a infraestrutura que o
      ADR 0005 menciona — dava para fechar a cadeia com Python e envelope
      sintético, sem produtor real.
    owner: Bruno Nunes
    rationale: >-
      ACCEPTED aqui significa RECEBIDA E DECIDIDA SEM MUDANÇA — o schema do
      seamwise só admite FIXED, ACCEPTED e OPEN, e esta objeção foi
      REFUTADA, não corrigida. A objeção lê o ADR 0005 como se ele
      encomendasse o produtor; ele decide QUAL motor julga — Spark grava,
      Python puro confere — e existe justamente para que o juiz não herde
      os defeitos de quem ele julga. O carregamento em Spark e MinIO já
      está em out_of_scope desta receita, com o motivo escrito: o juízo
      precisa existir antes de haver o que julgar, e entra como plano
      próprio depois deste. A tensão com a tech-spec que a objeção aponta
      é a mesma exclusão, vista do outro lado — não há contradição a
      resolver. Construir o produtor aqui apagaria a separação de motores
      que o ADR 0005 estabelece. Segunda vez que esta objeção aparece; a
      primeira virou a sétima costura, e a reincidência mostra que o que
      faltava não era mais uma correção, e sim esta decisão explícita.
  - id: OBJ-R2-C2
    status: FIXED
    summary: >-
      A regra que EU escrevi na rodada 1 confundia contagem de defeitos com
      linhas inválidas, e recusaria a competência 2026-01, que está correta.
    owner: Bruno Nunes
    rationale: >-
      Verificado contra a âncora medida: linhas_invalidas=0 com milhões de
      truncamentos válidos. B-2 da fronteira passou a confrontar
      linhas_invalidas só com defeitos do tipo VALOR_ILEGIVEL — truncamento
      é defeito numa linha válida.
  - id: OBJ-R2-C3
    status: FIXED
    summary: >-
      O hash ancorado não dizia se cobria o ZIP publicado ou o CSV extraído
      sobre o qual a âncora foi medida.
    owner: Bruno Nunes
    rationale: >-
      Verificado no repositório: CHECKSUMS.txt traz só o sha256 do ZIP, e a
      âncora foi medida no CSV, que não tem hash nenhum — trocar o CSV
      extraído não seria detectado. B-1 do contrato passou a exigir os dois
      hashes, cada um declarando qual artefato cobre.
  - id: OBJ-R2-C4
    status: FIXED
    summary: >-
      O juízo provava ausência de classificação, não classificação única —
      duas classificações na mesma diferença passariam.
    owner: Bruno Nunes
    rationale: >-
      B-2 do juízo passou a exigir exatamente uma classificação por
      diferença: zero bloqueia e duas também, porque duas permitem escolher
      a mais branda na hora de ler.
  - id: OBJ-R2-C5
    status: FIXED
    summary: >-
      O pacote podia reproduzir o rótulo do veredito sem preservar a prova
      que o prende ao arquivo julgado.
    owner: Bruno Nunes
    rationale: >-
      B-1 da evidência passou a exigir veredito REDERIVADO dos controles, da
      âncora e dos dois hashes; pacote com rótulo trocado é recusado, e
      pacote sem os hashes é recusado antes disso.
  - id: OBJ-R2-C6
    status: FIXED
    summary: >-
      A regra que EU escrevi na rodada 1 — descrição com exatamente 20
      caracteres — deixava de fora o exemplo principal do ADR 0004.
    owner: Bruno Nunes
    rationale: >-
      Verificado: 'Pensão por Morte de ' tem bruto=20 e strip=19; medindo
      após strip, os códigos 01, 03, 23 e 59 não emitiriam defeito. B-2 da
      leitura passou a medir o campo BRUTO ocupando os 20 caracteres do
      layout.
  - id: OBJ-R2-C7
    status: FIXED
    summary: >-
      Os cinco controles não tinham semântica para registros ilegíveis —
      cada implementação decidiria se contá-los.
    owner: Bruno Nunes
    rationale: >-
      B-1 da agregação passou a exigir que cada controle declare se conta o
      ilegível: count_linhas conta todo registro lido, os quatro monetários
      somam só os legíveis. Contar o ilegível no monetário somaria zero e
      faria a âncora medida deixar de bater.
  - id: OBJ-R3-C1
    status: FIXED
    summary: >-
      O ADR 0005 põe a infra Spark no escopo do Pass 3, e o out_of_scope da
      receita a exclui. Terceira rodada da mesma objeção.
    owner: Bruno Nunes
    rationale: >-
      MINHA REFUTAÇÃO DA 2a RODADA ESTAVA ERRADA. Argumentei que o ADR 0005
      só decidia qual motor julga; ele diz na linha 90 que montar a infra
      "faz parte do escopo, e entra como tarefa no plano do Pass 3". Eu
      tinha lido a seção Decision e não o resto do documento. O adversário
      tinha os fatos; eu tinha leitura parcial. A contradição era real e
      estava entre a doutrina e o plano. Resolvida com o ADR 0006, que
      SUPERSEDES a parte de escopo do 0005 e registra o fato verificável:
      a receita das sete costuras não menciona pyspark, e a âncora foi
      medida por Python sequencial em 64s — juízo e produtor são
      entregáveis separáveis. A separação de motores do 0005 permanece; é
      ela que torna a ordem livre. CHECK_ADR=OK.
  - id: OBJ-R3-C2
    status: FIXED
    summary: >-
      Minha correção de C5 recusava pacote sem hash incondicionalmente, o
      que impedia gravar justamente a execução ACEITO_SEM_ANCORA.
    owner: Bruno Nunes
    rationale: >-
      Duas correções minhas se contradiziam. B-1 da evidência passou a
      tratar ausência de hash como algo que DECIDE o veredito, não que o
      recusa: sem hash do CSV o desfecho é ACEITO_SEM_ANCORA com causa
      NAO_MEDIDO, e o pacote é válido. Só é recusado o pacote cujo rótulo
      não bate com o que os insumos rederivam.
  - id: OBJ-R3-C3
    status: FIXED
    summary: >-
      Os insumos que eu listei para rederivar o veredito não o determinam:
      mesmos controles e hashes admitem decisões distintas.
    owner: Bruno Nunes
    rationale: >-
      Correto — um defeito fora dos controles com CONFIRMED apenas registra
      e com UNRESOLVED bloqueia, e as classificações não estavam entre os
      insumos. B-1 da evidência passou a incluí-las na regra de rederivação.
  - id: OBJ-R3-C4
    status: FIXED
    summary: >-
      Minha correção de C7 dizia "os quatro monetários somam"; não existem
      quatro monetários, e min/max não somam.
    owner: Bruno Nunes
    rationale: >-
      Verificado contra a âncora: são DOIS de contagem (count_linhas,
      linhas_invalidas) e TRÊS monetários (sum, min, max), e só sum é soma.
      Pior, minha justificativa era aritmeticamente falsa: preencher o
      ilegível com 0.00 NÃO é detectado por nenhum dos três — a soma não
      muda, max não muda, e min já é 0.00 na fonte. Só linhas_invalidas
      acusa. B-1 da agregação passou a exigir que o teste prove EXCLUSÃO do
      ilegível, nunca comparando totais.
  - id: OBJ-R3-C5
    status: FIXED
    summary: >-
      Comparar o hash declarado não prova que ele veio dos bytes lidos —
      um produtor com cache errado pode copiar o hash ancorado.
    owner: Bruno Nunes
    rationale: >-
      B-1 da fronteira passou a declarar o sha256 como SAÍDA do leitor,
      computada sobre os mesmos bytes que alimentaram os controles, e a
      recusar o envelope cujo hash declarado discorda do que o leitor
      computou. Igualdade com o ancorado não bastava.
  - id: OBJ-R3-C6
    status: FIXED
    summary: >-
      A prova integrada de R-7 passaria sem exercitar o juízo: remover uma
      linha muda o hash, e a fronteira recusa antes da comparação.
    owner: Bruno Nunes
    rationale: >-
      B-1 da orquestração trocou o caso: agora é o arquivo ÍNTEGRO com o
      agregador divergindo de um controle, recusado pelo JUÍZO com hash
      válido. E o teste falha se um juízo permissivo for injetado — é isso
      que prova que a integração chama e respeita o juízo, como R-7 exige.
  - id: OBJ-R4-C1
    status: FIXED
    summary: >-
      Minha correção de R3-C5 exigia comparar o hash computado, mas nada no
      grafo levava esse valor até o validador.
    owner: Bruno Nunes
    rationale: >-
      Verificado no grafo de capacidades — a leitura produzia apenas
      registros lidos e defeitos observados; o hash computado não existia
      como capacidade, e dois campos do mesmo envelope podiam repetir o
      ancorado. Criada a capacidade "sha256 computado na leitura", produzida
      pela leitura e exigida pela fronteira. Para produtor externo, que o
      ADR 0006 permite, o envelope sem essa capacidade é recusado por falta
      de insumo, nunca aceito por ausência de contraditório.
  - id: OBJ-R4-C2
    status: FIXED
    summary: >-
      Minha correção de R3-C2 não distinguia falta de âncora de falha na
      execução — as duas chegam sem hash e não são o mesmo desfecho.
    owner: Bruno Nunes
    rationale: >-
      B-1 da evidência passou a separar os dois hashes. Falta o ANCORADO, do
      contrato, e é ACEITO_SEM_ANCORA com causa NAO_MEDIDO. Falta o
      OBSERVADO, da leitura, e é execução interrompida — ERRO, com o evento
      de falha entre os insumos da rederivação, porque controles ausentes
      depois de uma exceção não determinam ERRO por si.
  - id: OBJ-R4-C3
    status: FIXED
    summary: >-
      O gate de layout não cobria a troca entre as duas colunas de cabeçalho
      idêntico — justamente o caso que motivou a leitura posicional.
    owner: Bruno Nunes
    rationale: >-
      Verificado no arquivo real: os índices 12 e 13 trazem o MESMO
      cabeçalho 'Espécie', um com o código de 2 dígitos e outro com a
      descrição truncada. Trocar os valores entre si deixa o cabeçalho byte
      a byte igual e preserva os cinco controles. Conferir cabeçalho não
      distingue as duas; B-1 da leitura passou a exigir o formato de cada
      posição, e o teste falha se for satisfeito com colunas de nomes
      diferentes.
  - id: OBJ-R4-C4
    status: FIXED
    summary: >-
      Demonstrar que dois agrupamentos diferem não prova qual deles o
      agregador entregue usa.
    owner: Bruno Nunes
    rationale: >-
      A prova anterior era satisfeita dentro do teste, e continuaria
      verdadeira com um agregador que agrupa por descrição. B-2 da agregação
      passou a exigir que a SAÍDA preserve os 51 códigos distintos do ADR
      0004, com o teste falhando se a chave entregue for a descrição.
  - id: OBJ-R4-C5
    status: FIXED
    summary: >-
      Minha correção de R3-C6 SUBSTITUIU o cenário obrigatório de R-7 em vez
      de somar a ele.
    owner: Bruno Nunes
    rationale: >-
      R-7 exige uma linha removida ou um centavo alterado no arquivo, e eu
      troquei esse caso por divergência do agregador sobre arquivo íntegro.
      As duas provas verificam falhas diferentes e nenhuma substitui a
      outra. B-1 da orquestração passou a exigir as DUAS execuções de
      recusa — a do centavo alterado nos bytes e a do arquivo íntegro com
      juízo permissivo injetado.
  - id: OBJ-R5-C1
    status: FIXED
    summary: >-
      A recusa de float estava só no agregador local; o envelope aceita
      produtor externo, que não passa por ele.
    owner: Bruno Nunes
    rationale: >-
      Quatro das cinco objeções desta rodada têm a mesma raiz — o ADR 0006
      admitiu produtor externo e a fronteira ainda era escrita supondo o
      agregador local. B-2 da fronteira passou a contratar os três
      monetários como string ou Decimal, com recusa ANTES de qualquer
      conversão, porque Decimal(str(v)) apagaria a prova de que veio float.
  - id: OBJ-R5-C2
    status: FIXED
    summary: >-
      Um envelope podia omitir os truncamentos que a leitura observou e
      passar, com o juiz aprovando lista vazia.
    owner: Bruno Nunes
    rationale: >-
      A única reconciliação exigida era linhas_invalidas contra
      VALOR_ILEGIVEL. B-2 da fronteira passou a exigir que os defeitos
      observados cheguem por contagem e por tipo, e recusa a omissão — o
      juiz não violaria classificação única porque o defeito sumia antes de
      chegar nele.
  - id: OBJ-R5-C3
    status: FIXED
    summary: >-
      A fronteira compara TRÊS hashes e o pacote gravava dois; um RECUSADO
      legítimo rederivaria ACEITO.
    owner: Bruno Nunes
    rationale: >-
      Contraexemplo válido — ancorado=observado=A com envelope declarando B
      é recusado pela fronteira, e sem o declarado no pacote a razão da
      recusa se perde. B-1 da evidência passou a gravar os três.
  - id: OBJ-R5-C4
    status: FIXED
    summary: >-
      Execução encerrada por NAO_MEDIDO antes da leitura não tem nenhum dos
      dois hashes, e a precedência não estava declarada.
    owner: Bruno Nunes
    rationale: >-
      B-1 da evidência passou a declarar a precedência em vez de deixá-la
      deduzir: falta o ancorado e é ACEITO_SEM_ANCORA, inclusive quando o
      observado também falta; ERRO exige evento de falha registrado.
      Implementações independentes deixam de poder discordar.
  - id: OBJ-R5-C5
    status: FIXED
    summary: >-
      O ADR 0003 põe precisão e arredondamento no contrato, mas o carregador
      não os carregava — ficavam escolha privada da implementação.
    owner: Bruno Nunes
    rationale: >-
      B-1 do contrato passou a carregar a política decimal junto com âncora,
      layout e hashes, e contrato sem ela é NAO_MEDIDO. A agregação passou a
      exigir contrato validado entre seus requisitos, para que a política
      atravesse o grafo em vez de ser fixada dentro do agregador.
  - id: OBJ-R6-C1
    status: FIXED
    summary: >-
      Minha correção de R5-C2 criou uma recusa por omissão que a evidência
      não conseguia rederivar.
    owner: Bruno Nunes
    rationale: >-
      Contraexemplo válido — leitura observa truncamento, envelope declara
      lista vazia, controles e os três hashes coincidem; a recusa é legítima
      e só a divergência entre as listas a explica. B-1 da evidência passou
      a gravar as DUAS listas separadamente, a observada e a declarada.
  - id: OBJ-R6-C2
    status: FIXED
    summary: >-
      NAO_MEDIDO tem várias causas — sem aprovador, sem data, sem política
      decimal — e minha regra lia a falta do hash como se fosse a causa.
    owner: Bruno Nunes
    rationale: >-
      Contraexemplo válido — contrato com âncora e os dois hashes, mas sem
      aprovador, parando antes da leitura sem exceção: há hash ancorado, não
      há observado, não há evento de falha, e nenhuma regra determinava o
      desfecho. B-1 da evidência passou a decidir pela CAUSA registrada:
      NAO_MEDIDO por qualquer motivo dá ACEITO_SEM_ANCORA, e ERRO exige
      evento de falha.
  - id: OBJ-R6-C3
    status: FIXED
    summary: >-
      Produtor externo podia agrupar por descrição, colapsar espécies e
      declarar os mesmos cinco controles, hashes e defeitos.
    owner: Bruno Nunes
    rationale: >-
      Mesma raiz da rodada 5 — R-3 estava provado só no agregador local,
      enquanto o envelope é o contrato do produtor externo. B-2 da fronteira
      passou a exigir o agregado declarado POR CÓDIGO, com os 51 códigos do
      ADR 0004 como chaves.
  - id: OBJ-R6-C4
    status: FIXED
    summary: >-
      Minha correção de R5-C5 cobria política decimal ausente, mas não
      política presente e contraditória.
    owner: Bruno Nunes
    rationale: >-
      Um contrato com HALF_UP satisfaria a condição de presença e sairia
      validado, deixando o agregador entre obedecer ao contrato e obedecer
      ao ADR. B-1 do contrato passou a RECUSAR no carregamento a política
      que contradiz o ADR 0003. A validação confere a política contra o ADR,
      nunca o contrário — afrouxar o ADR para o contrato passar é a manobra
      que a Regra 3 proíbe.
  - id: OBJ-R6-C5
    status: FIXED
    summary: >-
      Minha correção de R4-C5 dividiu R-7 em duas provas; R-7 escreveu uma
      propriedade CONJUNTA.
    owner: Bruno Nunes
    rationale: >-
      R-7 exige alteração real no arquivo, recusada, "provada por teste que
      falha se o juízo aceitar". Separadas, um juízo permissivo deixa o
      teste da alteração real verde. Decidido com Bruno Nunes — o teste
      altera um centavo E reancora o sha256 do arquivo alterado, de modo que
      a fronteira passe e o JUÍZO seja quem recusa, contra a âncora
      monetária original. Uma prova só, conjunta, como R-7 escreveu.
  - id: OBJ-R6-C6
    status: FIXED
    summary: >-
      O done_condition dizia "medido contra R-9", mas medir com relógio
      simulado não demonstra orçamento de competência completa.
    owner: Bruno Nunes
    rationale: >-
      R-9 é should, e a lacuna não autoriza inventar recusa por timeout. O
      done_condition passou a declarar que R-9 NÃO está coberto aqui, e o
      tempo é medido e registrado no pacote para que a cobertura seja
      decidida contra competência real. Declarar cobertura que o teste não
      entrega é verde pelo motivo errado.
  - id: OBJ-R7-C1
    status: FIXED
    summary: >-
      Minha correção de R6-C3 tratou os 51 códigos do ADR 0004 como o
      universo; eles saíram de uma AMOSTRA de ~3 milhões de linhas.
    owner: Bruno Nunes
    rationale: >-
      MEDIDO NA COMPETÊNCIA INTEIRA, e o adversário estava certo — são 65
      códigos, não 51. A regra que escrevi RECUSARIA o arquivo correto. A
      cauda mostra por que a amostra não os viu: o código '60' aparece 1.395
      vezes em 41.572.553 linhas. É a Regra 3 pelo avesso — um gate
      calibrado em amostra recusa a verdade. A cardinalidade passou a ser
      ANCORADA no contrato, medida na competência inteira, e
      scripts/medir_codigos.py registra a medição (CODIGOS=MEDIDO).
  - id: OBJ-R7-C2
    status: FIXED
    summary: >-
      Minha correção de R6-C4 criou um RECUSADO no carregamento do contrato
      sem caminho de rederivação nem exercício na orquestração.
    owner: Bruno Nunes
    rationale: >-
      Mesmo padrão das rodadas 5 e 6 — garantia nova cria estado novo cuja
      consequência eu não declaro. B-1 da evidência passou a antecipar o
      terceiro caminho, gravando a política recusada e a cláusula do ADR
      violada; B-2 da orquestração passou a exercitá-lo.
  - id: OBJ-R7-C3
    status: FIXED
    summary: >-
      Exigir os códigos como chaves não prova agrupamento correto — dá para
      atribuir o total ao primeiro código e zerar os demais.
    owner: Bruno Nunes
    rationale: >-
      Todas as chaves presentes, cinco controles, hashes e defeitos
      idênticos, e as espécies fundidas mesmo assim. B-2 da fronteira passou
      a CONFERIR cada total por código contra a leitura — R-3 prova-se por
      valor, não por forma.
  - id: OBJ-R7-C4
    status: FIXED
    summary: >-
      A recusa de float cobria os três controles globais e deixava o
      dinheiro por espécie sem contrato.
    owner: Bruno Nunes
    rationale: >-
      Um envelope com controles em string e totais por espécie como número
      JSON satisfaria a recusa escrita só para os três, e o produtor externo
      introduziria float sem passar pelo agregador local. B-2 da fronteira
      passou a contratar TODO campo monetário, porque R-4 e o ADR 0003 valem
      para todo dinheiro.
  - id: OBJ-R7-C5
    status: FIXED
    summary: >-
      Conferir defeitos por contagem e tipo não detecta substituição — A
      duplicado e B omitido preserva ambas as contagens.
    owner: Bruno Nunes
    rationale: >-
      Contraexemplo válido e mais fino que a omissão que eu tinha coberto:
      cada entrada declarada recebe classificação única, B nunca é
      classificado, e juízo e rederivação concordam violando R-6. B-2 da
      fronteira passou a conferir POR IDENTIDADE, com valor original e
      posição, que é o que a leitura já produz.
contentions: []
