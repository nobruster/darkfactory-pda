  - id: OBJ-R8-C6
    status: FIXED
    summary: >-
      Minha correção de R7-C3 mandava conferir o total por código contra a
      leitura, mas a fronteira consumia um agregado só.
    owner: Bruno Nunes
    rationale: >-
      Mesmo erro da R4-C1, terceira vez — regra que compara um valor que
      ninguém se compromete a entregar. Com um mapa só, deslocar valores
