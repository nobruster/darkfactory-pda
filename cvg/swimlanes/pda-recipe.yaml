      nunca somado em silêncio. A fonte mede escala exatamente 2 nas
      41.572.553 linhas.
  - id: OBJ-R10-C4
    status: FIXED
    summary: >-
      NAO_MEDIDO era reproduzido pela causa declarada, sem os insumos que
