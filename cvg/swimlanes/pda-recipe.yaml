      capacidade "totais por código da leitura", produzida pela LEITURA e
      exigida pela fronteira; a referência não vem do agregador julgado,
      pelo mesmo motivo do ADR 0005.
  - id: OBJ-R8-C7
    status: FIXED
    summary: >-
      A rederivação não contemplava a recusa por total divergente de uma
      espécie — transferir 1,00 de A para B preserva tudo o mais.
    owner: Bruno Nunes
    rationale: >-
      B-1 da evidência passou a gravar os PARES de origens distintas que
