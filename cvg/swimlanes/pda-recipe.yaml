  - id: OBJ-R12-C2
    status: FIXED
    summary: >-
      Meu ADR 0007 derivava a precisão do TOTAL ancorado; um acumulador
      intermediário pode excedê-lo, e aí 14 perde o centavo.
    owner: Bruno Nunes
    rationale: >-
      Contraexemplo executado e confirmado — com os valores
      100000000000.005, -100000000000, 0.005 e 78521752562.12, prec=14
