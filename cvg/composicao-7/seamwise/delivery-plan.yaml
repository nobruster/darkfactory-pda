  summary: Texto obsoleto — "milhões de truncamentos" sobreviveu à troca de critério do ADR 0008 e criava
    duas unidades de defeito concorrentes.
  owner: Bruno Nunes
  rationale: 'O ADR 0008 substituiu largura por identidade colapsada, e a unidade é a DESCRIÇÃO: são 11
    defeitos na competência, não milhões. Um teste de fronteira construído literalmente do exemplo antigo
    não poderia representar a leitura contratada e passar na igualdade por identidade. Corrigido em B-2
    da fronteira e no anti_pattern. Lição — trocar um critério exige varrer o texto inteiro, não só o
    ponto onde ele foi escrito.'
- id: OBJ-AG-CERCAS
  status: FIXED
  summary: Achado pelo agente fabrica-architect, não pelo adversário — o PDA não tinha .cvg/gate.yaml,
    e o .claude/settings.json era cópia byte-a-byte da bancada.
  owner: Bruno Nunes
  rationale: 'CONFERIDO — o sha256 do settings.json era idêntico ao do template, e .cvg/ não existia.
    As quatro pastas que a doutrina manda cercar numa fábrica gerada estavam desprotegidas nas DUAS cercas:
    _raw/ com 12 GB, contracts/, cvg/docs/adrs/ com os 10 ADRs, e evidence/ com a âncora. O próprio settings.json
    previa o erro e nomeava o remédio, que nunca foi executado. Criado .cvg/gate.yaml com os caminhos
    REAIS — cvg/docs/adrs, não docs/adrs, que casaria com zero arquivo como na objeção #11 do inss. Acrescentadas
    20 regras ao settings.json, de 38 para 58. E criado scripts/verificar_cercas.py, testado contra divergência
    injetada (CERCAS=DIVERGEM, e volta a OK). Ele também acusa cerca que casa com zero arquivo — achou
    .github/workflows, que não existe aqui. É a Regra 8 valendo — o adversário lê o plano e não confere
    cerca nenhuma; catorze rodadas não viram isto.'
- id: OBJ-AG-TECHSPEC
  status: FIXED
  summary: Achado pelo agente — o R-3 da tech-spec, um `must`, citava os números que o ADR 0008 mediu
    e refutou.
  owner: Bruno Nunes
  rationale: O requisito dizia "51 códigos colapsam em 40 descrições truncadas em 20 caracteres (ADR 0004)".
    São 65 e 52, e o critério de largura marcaria toda linha. Implementar R-3 ao pé da letra recusaria
    o arquivo correto — o mesmo defeito que a rodada 7 achou no plano, sobrevivendo na tech-spec. Decidido
    com Bruno Nunes corrigir o requisito citando o ADR 0008, e o R-4 passou a citar o 0009 com a precisão
    derivada e a não-negatividade. Alterar Pass 1 reabre CHECK_TECH_SPEC, mas deixar um `must` com número
    refutado é pior. O hash da tech-spec mudou e checar_evidencia.py acusou, dando o novo.
- id: OBJ-AG-VERIFICADORES
  status: FIXED
  summary: Achado pelo agente code-reviewer — os próprios verificadores tinham falsos verdes, inclusive
    o que sustenta o ADR 0009.
  owner: Bruno Nunes
  rationale: 'Uma causa comum em todos — os scripts distinguiam "não achei o arquivo" de sucesso, mas
    NÃO distinguiam "li e não havia nada". Reproduzi cada achado antes de corrigir. medir_sinal.py, que
    mede a premissa do ADR 0009, imprimia "a fórmula do ADR vale" tendo lido ZERO valores, e somava com
    precisão HERDADA — o script que mede a premissa violando a primeira camada do próprio ADR. checar_w1.py
    devolvia W1=OK sobre o CSV de 11,6 GB sem hash nenhum, e chmod 444 no arquivo não impede rm-e-recriar,
    porque a escrita é do DIRETÓRIO — verificado, com _raw em 755 o ataque funciona e em 555 falha. medir_ancora.py
    aceitava Infinity, e sem gramática convertia ''1.621'' em 1621, inflação de 1000x contada como válida.
    checar_yaml.py virava verde permanente sem PyYAML. Tudo corrigido e TESTADO contra defeito injetado.
    E a âncora foi RE-MEDIDA com o script endurecido: os cinco controles batem, o número estava certo
    e agora a prova também está.'
- id: OBJ-AG-W1-DIRETORIO
  status: FIXED
  summary: A correção de R13-C5 fechou metade do W-1 — o modo do arquivo — e deixou o diretório gravável.
  owner: Bruno Nunes
  rationale: Permissão de escrita em Unix é do diretório. Com _raw em 755, um rm seguido de recriação
    substitui um arquivo 444 e o deixa em 444 de novo, e checar_w1.py diria ok. Aplicado chmod 555 em
    _raw, e o sha256 do CSV conferido antes e depois. E acrescentado o hash do CSV ao CHECKSUMS.txt —
    até aqui só o ZIP tinha, e era o CSV onde a âncora foi medida. As duas metades da promessa de W-1
    agora existem.
- id: OBJ-R15-C1
  status: FIXED
  summary: Fechei o buraco do contexto decimal na LEITURA e deixei a AGREGAÇÃO aberta — quem soma era
    justamente quem ficou exposto.
  owner: Bruno Nunes
  rationale: A exigência de contexto completo protegia o mapa de referência e não o agregador. B-2 da
    agregação passou a exigir contexto próprio e completo, com teste sob global adverso nos três eixos.
- id: OBJ-R15-C2
  status: FIXED
  summary: O carregador recusava float, mas não âncora monetária não finita nem contagem booleana ou fracionária.
  owner: Bruno Nunes
  rationale: '''Infinity'' no total alcançaria a derivação de precisão, e False em linhas_invalidas passaria
    por igualdade contra um inteiro legítimo. A fronteira protege o envelope, não o referencial. B-1 do
    contrato passou a exigir monetário finito e contagens inteiras não negativas.'
- id: OBJ-R15-C3
  status: FIXED
  summary: Código presente só em registros inválidos não tinha representação acordada entre leitura e
    produtor.
  owner: Bruno Nunes
  rationale: Chave omitida, soma zero e ausência eram todas defensáveis, e os dois lados podiam cumprir
    seus textos emitindo mapas diferentes — recusando uma competência legitimamente ancorada antes de
    o juízo comparar. B-2 da fronteira passou a exigir chave PRESENTE com soma ausente; zero inventaria
    dinheiro que ninguém recebeu.
- id: OBJ-R15-C4
  status: FIXED
  summary: Preservar o tipo monetário não definia como persistir Decimal, que JSON não tem.
  owner: Bruno Nunes
  rationale: Converter para string violaria a própria preservação exigida, e o gravador podia falhar justamente
    ao registrar uma recusa legítima de sNaN. B-1 da evidência passou a gravar um par declarado — tipo
    recebido e texto exato dos bytes — que distingue Decimal('0.00'), a string '0.00' e o número 0.0.
- id: OBJ-R15-C5
  status: FIXED
  summary: Nada declarava QUEM classifica os defeitos — e a competência tem 11 colapsos reais que a Regra
    4 manda bloquear sem classificação.
  owner: Bruno Nunes
  rationale: 'A objeção que impedia a fábrica de rodar. Sem a entrada, a execução trava com os cinco controles
    corretos; se o juízo inventasse a classificação, teria tomado decisão de negócio sem autoridade. Decidido
    com Bruno Nunes — a classificação vem do CONTRATO: os defeitos conhecidos da fonte entram pré-classificados
    e aprovados junto da âncora, com os 11 colapsos como CONFIRMED_SOURCE_DEFECT, e defeito FORA dessa
    lista continua bloqueando, que é o comportamento que a Regra 4 exige.'
