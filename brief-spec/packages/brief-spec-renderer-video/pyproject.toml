[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "brief-spec-renderer-video"
version = "0.1.0"
description = "Optional deterministic Chronicle video renderer for Brief-Spec."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Luan Moreno Maciel" }]
dependencies = [
  "brief-spec>=0.5,<1.0",
  "brief-spec-chronicle>=0.1,<1.0",
  "brief-spec-renderer-audio>=0.5,<1.0",
  "playwright>=1.48",
]

[tool.hatch.build.targets.wheel]
packages = ["src/brief_spec_renderer_video"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
