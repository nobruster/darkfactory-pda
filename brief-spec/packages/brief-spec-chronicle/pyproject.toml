[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "brief-spec-chronicle"
version = "0.1.0"
description = "Optional evidence-bound project continuity for Brief-Spec."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Luan Moreno Maciel" }]
dependencies = ["brief-spec>=0.5,<1.0"]

[project.scripts]
brief-spec-chronicle = "brief_spec_chronicle.cli:main"

[project.optional-dependencies]
pdf = ["brief-spec-renderer-pdf>=0.5,<1.0"]
audio = ["brief-spec-renderer-audio>=0.5,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/brief_spec_chronicle"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "brief_spec_chronicle/resources/schemas"

[tool.hatch.build.targets.sdist]
include = ["/src", "/schemas", "/tests", "/README.md"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
